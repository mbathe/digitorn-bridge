                - strong [ref=e526]: This is a real security finding.
                - text: A malicious file content, a clever prompt, or a confused agent with
                - code [ref=e527]: filesystem.write
                - text: can land arbitrary content anywhere the daemon process has write access. The "workspace boundary" promise of
                - code [ref=e528]: "workdir_mode: auto"
                - text: is
