                    - generic [ref=e550]: "trigger: [write]"
                    - generic [ref=e551]: "when: pre_tool"
                    - generic [ref=e552]: "action: block"
                    - generic [ref=e553]: "condition:"
                    - generic [ref=e554]: "any:"
                    - generic [ref=e555]: "- param_matches: {param: file_path, pattern: \"^[a-zA-Z]:[\\\\\\\\/]\"} # Windows drive"
                    - generic [ref=e556]: "- param_matches: {param: file_path, pattern: \"^/\"} # Unix abs"
                    - generic [ref=e557]: "- param_contains: {param: file_path, value: \"..\"} # any traversal"
                    - generic [ref=e558]: "message: \"Absolute paths and parent traversal are forbidden.\""
