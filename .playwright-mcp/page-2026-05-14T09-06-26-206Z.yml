              - heading "Cross-cutting ideasDirect link to Cross-cutting ideas" [level=2] [ref=e287]:
                - text: Cross-cutting ideas
                - link "Direct link to Cross-cutting ideas" [ref=e288] [cursor=pointer]:
                  - /url: "#cross-cutting-ideas"
                  - text: "#"
              - paragraph [ref=e289]: A few patterns are repeated across the codebase. Knowing them up front makes everything else click.
              - heading "One tool, N modesDirect link to One tool, N modes" [level=3] [ref=e290]:
                - text: One tool, N modes
                - link "Direct link to One tool, N modes" [ref=e291] [cursor=pointer]:
                  - /url: "#one-tool-n-modes"
                  - text: "#"
              - paragraph [ref=e292]:
                - text: Many tools that look like a tool family are actually a single tool with branching behaviour controlled by params. The
                - code [ref=e293]: Agent
                - text: spawn tool (8 modes via params),
                - code [ref=e294]: background_run
                - text: (5 modes), the file edit tool's fuzzy matcher, the workspace
                - code [ref=e295]: WsRead
                - text: reader (offset and limit selection). When you see this pattern, look for the "mode hint" parameter in the params model.
              - 'heading "extra: forbid on every YAML blockDirect link to extra-forbid-on-every-yaml-block" [level=3] [ref=e296]':
                - code [ref=e297]: "extra: forbid"
                - text: on every YAML block
                - link "Direct link to extra-forbid-on-every-yaml-block" [ref=e298] [cursor=pointer]:
                  - /url: "#extra-forbid-on-every-yaml-block"
                  - text: "#"
              - paragraph [ref=e299]:
                - text: Every Pydantic model in and declares
                - code [ref=e300]: "model_config = {\"extra\": \"forbid\"}"
                - text: ". This is a deliberate correctness choice: a typo in a YAML key is a compile error, not a silent default. If you see \"Extra inputs are not permitted\" with a list of accepted keys, the schema is showing you exactly where the typo is."
              - heading "Compile time vs run timeDirect link to Compile time vs run time" [level=3] [ref=e301]:
                - text: Compile time vs run time
                - link "Direct link to Compile time vs run time" [ref=e302] [cursor=pointer]:
                  - /url: "#compile-time-vs-run-time"
                  - text: "#"
              - paragraph [ref=e303]:
                - text: The boundary is sharp. Anything that depends only on
                - code [ref=e304]: app.yaml
                - text: +
                - code [ref=e305]: os.environ
                - text: "+ the bundle directory + the daemon's catalog is compile-time. Anything that depends on a live LLM, a fired trigger, a live tool result is run-time. The doc and the schema reflect this: a"
                - code [ref=e306]: runtime.X
                - text: field never resolves at compile, a
                - code [ref=e307]: dev.variables
                - text: template always does.
              - heading "Modules are stateful, slots are typedDirect link to Modules are stateful, slots are typed" [level=3] [ref=e308]:
                - text: Modules are stateful, slots are typed
                - link "Direct link to Modules are stateful, slots are typed" [ref=e309] [cursor=pointer]:
                  - /url: "#modules-are-stateful-slots-are-typed"
                  - text: "#"
              - paragraph [ref=e310]:
                - text: A module is a single Python class that owns its state for the life of the daemon (
                - code [ref=e311]: "isolation: shared"
                - text: ) or per-app (
                - code [ref=e312]: "isolation: per_app"
                - text: "). A slot is the typed declaration of what config a module accepts and what credential it consumes. The distinction matters when you reason about \"two apps share the same vector index\": that's a"
                - code [ref=e313]: shared
                - text: module that exposes a per-app override (see how the rag module reuses the same Qdrant collection across apps but isolates its in-memory KB list per app).
              - heading "Direct vs FQN namesDirect link to Direct vs FQN names" [level=3] [ref=e314]:
                - text: Direct vs FQN names
                - link "Direct link to Direct vs FQN names" [ref=e315] [cursor=pointer]:
                  - /url: "#direct-vs-fqn-names"
                  - text: "#"
              - paragraph [ref=e316]:
                - text: The LLM sees short PascalCase tool names (
                - code [ref=e317]: Bash
                - text: ","
                - code [ref=e318]: Write
                - text: ","
                - code [ref=e319]: Edit
                - text: ","
                - code [ref=e320]: Agent
                - text: ","
                - code [ref=e321]: Remember
                - text: ). Internally the daemon dispatches via FQNs (
                - code [ref=e322]: shell.bash
                - text: ","
                - code [ref=e323]: filesystem.write
                - text: ","
                - code [ref=e324]: filesystem.edit
                - text: ","
                - code [ref=e325]: agent_spawn.spawn
                - text: ","
                - code [ref=e326]: memory.remember
                - text: ). YAML constraints and capabilities use the FQN suffix (
                - code [ref=e327]: "{ shell: [bash] }"
                - text: "). The mapping is one source of truth:"
                - link:
                  - /url: https://github.com/
                - text: .
