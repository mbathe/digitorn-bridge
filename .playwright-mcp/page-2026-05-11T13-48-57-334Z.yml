                  - text: "#"
              - paragraph [ref=e412]: Same idea but expressed as a deny in the capabilities section. This is also schema-level in current Digitorn (the action is removed before the LLM sees it), AND it adds a runtime guard so the LLM cannot route around it via meta-tools.
