              - paragraph [ref=e568]:
                - text: These tests aren't proving the docs - they're proving the
                - strong [ref=e569]: daemon really enforces what the YAML declares
                - text: ", end to end:"
              - list [ref=e570]:
                - listitem [ref=e571]:
                  - strong [ref=e572]: Schema filtering is honest.
                  - code [ref=e573]: allowed_actions
                  - text: and
                  - code [ref=e574]: deny
                  - text: actually remove the tool from the schema sent to the LLM. We confirmed this by asking the LLM to enumerate its tools - the masked tools were absent from its own reported list.
                - listitem [ref=e575]:
                  - strong [ref=e576]: Bypasses are blocked.
                  - text: A clever LLM trying to invoke a denied tool through
                  - code [ref=e577]: background_run
                  - text: gets refused at the dispatch layer. The deny isn't just cosmetic.
                - listitem [ref=e578]:
                  - strong [ref=e579]: Behavior rules intercept at runtime.
                  - text: Parameter-level rules look at the actual tool call payload, return a structured error before execution, and the agent reads that error and explains it correctly.
