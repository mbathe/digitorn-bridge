                    - columnheader "What the LLM sees" [ref=e299]
                    - columnheader "What happens if it tries" [ref=e300]
                - rowgroup [ref=e301]:
                  - row "constraints.allowed_actions Schema Tool not in the schema Can't even attempt - it's invisible" [ref=e302]:
                    - cell "constraints.allowed_actions" [ref=e303]:
                      - code [ref=e304]: constraints.allowed_actions
                    - cell "Schema" [ref=e305]
                    - cell "Tool not in the schema" [ref=e306]:
                      - strong [ref=e307]: Tool not in the schema
                    - cell "Can't even attempt - it's invisible" [ref=e308]
                  - row "capabilities.deny Dispatch Tool not in the schema Even meta-tools (background_run) refuse to call it" [ref=e309]:
                    - cell "capabilities.deny" [ref=e310]:
                      - code [ref=e311]: capabilities.deny
                    - cell "Dispatch" [ref=e312]
                    - cell "Tool not in the schema" [ref=e313]:
                      - strong [ref=e314]: Tool not in the schema
                    - cell "Even meta-tools (background_run) refuse to call it" [ref=e315]
                  - 'row "behavior.rule_definitions (action: block) Runtime Tool is in the schema Tool fires, daemon intercepts on params, returns block message" [ref=e316]':
                    - 'cell "behavior.rule_definitions (action: block)" [ref=e317]':
                      - code [ref=e318]: behavior.rule_definitions
                      - text: (
                      - code [ref=e319]: "action: block"
                      - text: )
                    - cell "Runtime" [ref=e320]
                    - cell "Tool is in the schema" [ref=e321]:
                      - text: Tool
                      - strong [ref=e322]: is
                      - text: in the schema
                    - cell "Tool fires, daemon intercepts on params, returns block message" [ref=e323]
              - paragraph [ref=e324]:
                - text: This tutorial deploys three apps against the daemon, each isolating one mechanism, and pushes the LLM hard to verify the restriction
                - emphasis [ref=e325]: actually
                - text: sticks. All transcripts below are real captures from the live daemon, not invented.
              - heading "Mechanism 1 - allowed_actions (schema-level masking)Direct link to mechanism-1---allowed_actions-schema-level-masking" [level=2] [ref=e326]:
                - text: Mechanism 1 -
                - code [ref=e327]: allowed_actions
                - text: (schema-level masking)
                - link "Direct link to mechanism-1---allowed_actions-schema-level-masking" [ref=e328] [cursor=pointer]:
                  - /url: "#mechanism-1---allowed_actions-schema-level-masking"
                  - text: "#"
              - paragraph [ref=e329]: "The cleanest way: declare which actions of a module are exposed. Anything else is removed from the JSON schema sent to the LLM, before the LLM ever sees it."
              - code [ref=e333]:
                - generic [ref=e334]: "tools:"
                - generic [ref=e335]: "modules:"
                - generic [ref=e336]: "filesystem:"
                - generic [ref=e337]: "constraints:"
                - generic [ref=e338]: "allowed_actions: [read, glob, grep] # ← write/edit/delete invisible"
                - generic [ref=e339]: "capabilities:"
                - generic [ref=e340]: "default_policy: auto"
                - generic [ref=e341]: "max_risk_level: low"
              - paragraph [ref=e342]:
                - text: Two apps, one with full filesystem (
                - code [ref=e343]: open-bot
                - text: ), one with the mask (
                - code [ref=e344]: masked-bot
                - text: "). Same prompt sent to each:"
              - code [ref=e348]:
                - generic [ref=e349]: "> List every tool you have access to. Just a bullet list of names."
              - paragraph [ref=e350]:
                - strong [ref=e351]:
                  - code [ref=e352]: open-bot
                  - text: "reply:"
              - code [ref=e356]:
                - generic [ref=e357]: "- Read"
                - generic [ref=e358]: "- Write"
                - generic [ref=e359]: "- Edit"
                - generic [ref=e360]: "- Glob"
                - generic [ref=e361]: "- Grep"
                - generic [ref=e362]: "- background_run"
                - generic [ref=e363]: "- run_parallel"
              - paragraph [ref=e364]:
                - strong [ref=e365]:
                  - code [ref=e366]: masked-bot
                  - text: "reply:"
              - code [ref=e370]:
                - generic [ref=e371]: "- Read"
                - generic [ref=e372]: "- Glob"
                - generic [ref=e373]: "- Grep"
                - generic [ref=e374]: "- background_run"
                - generic [ref=e375]: "- run_parallel"
              - paragraph [ref=e376]:
                - code [ref=e377]: Write
                - text: and
                - code [ref=e378]: Edit
                - text: "aren't in the masked-bot's enumeration - the LLM literally doesn't know they exist. Now the provocation:"
              - code [ref=e382]:
                - generic [ref=e383]: "> Create a file called test.txt with the word 'hello' in it."
              - paragraph [ref=e384]:
                - strong [ref=e385]:
                  - code [ref=e386]: open-bot
                - text: "fires the obvious tool:"
              - code [ref=e390]:
                - generic [ref=e391]: "[tool_call] Write({\"file_path\": \"test.txt\", \"content\": \"hello\"})"
                - generic [ref=e392]: "[reply] \"Done. Created **test.txt** with the word \"hello\" in it.\""
              - paragraph [ref=e393]:
                - strong [ref=e394]:
                  - code [ref=e395]: masked-bot
                - text: fires
                - strong [ref=e396]: zero tool calls
                - text: "and replies:"
              - code [ref=e400]:
                - generic [ref=e401]: "\"I don't have a tool to create or write files. Let me check"
                - generic [ref=e402]: "what tools I have available:"
                - generic [ref=e403]: "- **Read** - reads files"
                - generic [ref=e404]: "- **Glob** - finds files by name pattern"
                - generic [ref=e405]: "- **Grep** - searches file contents"
                - generic [ref=e406]: "- ...\""
              - paragraph [ref=e407]:
                - text: The LLM understood it didn't have the capability and reported honestly. No phantom Write call, no hallucination. The mask is at the
                - strong [ref=e408]: schema
                - text: level - whatever is filtered out simply doesn't reach the LLM in the first place.
              - heading "Mechanism 2 - capabilities.deny (dispatch-level block)Direct link to mechanism-2---capabilitiesdeny-dispatch-level-block" [level=2] [ref=e409]:
                - text: Mechanism 2 -
                - code [ref=e410]: capabilities.deny
                - text: (dispatch-level block)
                - link "Direct link to mechanism-2---capabilitiesdeny-dispatch-level-block" [ref=e411] [cursor=pointer]:
