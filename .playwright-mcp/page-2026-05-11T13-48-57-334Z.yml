            - generic [ref=e289]:
              - heading "Advanced 13 - Locking down the toolset (3 mechanisms)" [level=1] [ref=e291]
              - paragraph [ref=e292]:
                - text: You almost never want every loaded module's full action set exposed to the agent. Some tools are dangerous, some are internal, some belong to a different agent's job. Digitorn gives you
                - strong [ref=e293]: three orthogonal mechanisms
                - text: "to restrict what the LLM can do, each operating at a different layer:"
              - table [ref=e294]:
                - rowgroup [ref=e295]:
                  - row "Mechanism Layer What the LLM sees What happens if it tries" [ref=e296]:
                    - columnheader "Mechanism" [ref=e297]
