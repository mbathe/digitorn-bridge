        - generic [ref=e103]:
          - paragraph [ref=e147]: "Une API REST (Representational State Transfer) est une façon d'organiser la communication entre un client (par exemple une application web ou mobile) et un serveur via le protocole HTTP. Elle expose des \"ressources\" identifiables par des URL (par ex. /utilisateurs/123) et utilise les méthodes HTTP courantes pour agir sur ces ressources : GET pour lire, POST pour créer, PUT/PATCH pour modifier, DELETE pour supprimer. Une API REST est en général \"stateless\" : chaque requête contient toutes les informations nécessaires, le serveur ne conserve pas le contexte entre les appels. Les données sont souvent échangées au format JSON. On peut l'imaginer comme un catalogue accessible par Internet où chaque article a une adresse (URL) et des actions simples possibles dessus."
