                  - text: ","
                  - code [ref=e778]: search_tools
                  - text: ","
                  - code [ref=e779]: get_tool
                  - text: ","
                  - code [ref=e780]: execute_tool
                  - text: injected. Agent walks the tree as needed. Scales to hundreds of tools.
              - paragraph [ref=e781]:
                - text: The mode is auto-detected by the compiler based on tool count, or forced via
                - code [ref=e782]: runtime.tool_injection
                - text: .
