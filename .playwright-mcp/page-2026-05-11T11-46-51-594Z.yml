                  - text: "#"
              - paragraph [ref=e766]:
                - text: The
                - code [ref=e767]: ContextBuilder
                - text: "module exposes meta-tools the agent can use to discover capabilities lazily:"
              - list [ref=e768]:
                - listitem [ref=e769]:
                  - strong [ref=e770]: direct
                  - text: "- full tool schemas injected up front. Best for small apps (< ~30 tools)."
                - listitem [ref=e771]:
                  - strong [ref=e772]: compact_direct
                  - text: "- tool names + 1-line descriptions, full schema on demand via"
                  - code [ref=e773]: get_tool
                  - text: .
                - listitem [ref=e774]:
                  - strong [ref=e775]: discovery
                  - text: "- only"
                  - code [ref=e776]: list_categories
                  - text: ","
