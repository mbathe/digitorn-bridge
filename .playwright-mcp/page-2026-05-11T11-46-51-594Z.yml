                  - link "llm_provider module" [ref=e796] [cursor=pointer]:
                    - /url: /docs/reference/modules/llm_provider
                  - text: ).
                - listitem [ref=e797]:
                  - code [ref=e798]: github_copilot
                  - text: "- uses your GitHub Copilot subscription."
              - paragraph [ref=e799]:
                - text: Models that support
                - strong [ref=e800]: native tool calling
                - text: (OpenAI, Anthropic, DeepSeek, Groq, Mistral, Together) get tools via the API
                - code [ref=e801]: tools=
                - text: parameter. Models that don't (Ollama, LM Studio, vLLM, small local models) get tool schemas injected into the system prompt; tool calls are parsed from the text output via a multi-format recovery parser.
