                  - text: "- any OpenAI-compatible"
                  - code [ref=e792]: /v1
                  - text: endpoint (OpenAI, DeepSeek, Groq, Mistral, Together, Ollama, vLLM, LM Studio, OpenRouter, Cerebras, Perplexity, Fireworks, xAI, Gemini, ...).
                - listitem [ref=e793]:
                  - code [ref=e794]: anthropic
                  - text: "- Anthropic SDK (also accepts the"
                  - code [ref=e795]: claude-code
