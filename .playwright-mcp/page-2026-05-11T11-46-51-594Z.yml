              - paragraph [ref=e760]:
                - text: The compiler walks the YAML once, validates against the eight Pydantic blocks, then bootstraps each declared module. Once running, every tool call goes through the
                - code [ref=e761]: AgentContext
                - text: ", hooks fire around it via"
                - code [ref=e762]: HookRunner
                - text: ", and"
                - code [ref=e763]: ContextBuilder
                - text: decides what tool schemas reach the LLM (direct vs discovery vs compact).
              - heading "Tool delivery - direct, compact, or discoveryDirect link to Tool delivery - direct, compact, or discovery" [level=3] [ref=e764]:
