# ────────────────────────────────────────────────────────────────────
# Smart RSS Digest - Single-agent news curator
# ────────────────────────────────────────────────────────────────────
#
# Pattern: "Conversational data fetcher + summariser"
# Use case: User asks for a news brief from a list of RSS/Atom feeds,
#           or for a topical follow-up on a specific article. The agent
#           fetches the XML, parses it, clusters articles by topic, and
#           returns a structured digest in the user's language.
#
# Flow:
#   1. User says: "Build me today's brief from these feeds: <urls>"
#      OR uses /digest with default seed feeds (memory).
#   2. Agent uses http.get on each feed URL.
#   3. Agent parses the XML inline (Claude/DeepSeek both handle Atom/RSS).
#   4. Agent clusters items by topic via LLM reasoning.
#   5. Agent produces a markdown digest:
#        ## Topic 1
#        - **headline** (source, ago)
#          one-line summary, link
#   6. User can ask follow-ups: "tell me more about X", "français svp",
#      "save these feeds for next time" (memory.remember).
#
# Brain: deepseek-chat is the default (fast + cheap + multilingual).
#        Other recommended models can be plugged via daemon defaults.
# ────────────────────────────────────────────────────────────────────

app:
  app_id: smart-rss-digest
  name: "Smart RSS Digest"
  version: "1.0.0"
  description: "Aggregates RSS feeds, clusters by topic, delivers a 5-minute brief. Conversational follow-ups."
  icon: "📰"
  color: "#ff8c42"
  category: "productivity"
  author: "Digitorn"
  tags: [rss, news, digest, summarization, multilingual, productivity]
  quick_prompts:
    - label: "Daily AI brief"
      icon: "🤖"
      message: |
        Build me today's brief from these AI feeds:
        - https://www.anthropic.com/news/rss.xml
        - https://openai.com/blog/rss.xml
        - https://www.deeplearning.ai/the-batch/feed/
        Group by topic and keep it under 10 bullets.
    - label: "Tech news brief"
      icon: "💻"
      message: |
        Build me a tech news brief from:
        - https://news.ycombinator.com/rss
        - https://www.theverge.com/rss/index.xml
        Group by category, max 8 bullets.
    - label: "Save my feeds"
      icon: "💾"
      message: "Save these feeds for next time: <paste URLs>"
    - label: "Use my saved feeds"
      icon: "🔁"
      message: "Use my saved feeds and build today's brief."

modules:
  http:
    config:
      max_response_size: 5242880    # 5 MB per feed (RSS/Atom rarely exceed)
      timeout: 20
  memory:
    config:
      auto_remember: true
      working_memory: true
  context_builder: {}

agents:
  - id: main
    role: assistant
    specialty: "RSS aggregation + topic clustering + multilingual summarisation"
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.3
      max_tokens: 4096
      context:
        max_tokens: 128000
        strategy: summarize
        keep_recent: 8
        auto_compact: true
    system_prompt: "{{prompt.system}}"

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct

skills:
  - command: "/digest"
    description: "Fetch saved feeds and build today's topic-clustered brief."
    path: "./skills/digest.md"
  - command: "/feeds"
    description: "Manage your saved feed URLs (list, add, remove)."
    path: "./skills/feeds.md"
  - command: "/dive"
    description: "Re-fetch a specific feed and dive deep on one topic."
    path: "./skills/dive.md"

features:
  voice: false
  attachments: false
  tools_panel: true

theme:
  accent: "#ff8c42"
