# ────────────────────────────────────────────────────────────────────
# Smart RSS Digest — Official Digitorn application
# ────────────────────────────────────────────────────────────────────

[package]
id = "smart-rss-digest"
name = "Smart RSS Digest"
version = "1.0.1"
description = "Aggregates RSS feeds, clusters articles by topic with an LLM, and produces a 5-minute morning brief. Multi-feed, multilingual (FR/EN), conversational follow-ups."
author = "Digitorn"
license = "Apache-2.0"
icon = "icon.png"
category = "productivity"

[package.source]
type = "official"
verified = true
publisher = "digitorn-official"

[package.compatibility]
digitorn_min = ">=1.0.0"
python_min = ">=3.12"
platforms = []

[package.requirements]
modules = ["http", "memory", "context_builder"]
recommended_models = [
  "deepseek-chat",
  "claude-haiku-4-5",
  "gpt-4o-mini",
]
external_tools = []
min_disk_mb = 0
min_memory_mb = 64

[package.credentials]
required = []
optional = ["deepseek", "anthropic", "openai"]

[package.permissions]
risk_level = "low"
network_access = true
filesystem_access = []
filesystem_scopes = []
requires_approval = []

[package.hub]
tags = ["rss", "news", "digest", "summarization", "multilingual", "productivity"]
screenshots = []
demo_video = ""

[package.release]
released_at = "2026-04-26"
release_notes = "Initial release. Single-agent multilingual RSS digester with topic clustering."
breaking = false
