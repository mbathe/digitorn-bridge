# ────────────────────────────────────────────────────────────────────
# Chess Coach — Official Digitorn application
# ────────────────────────────────────────────────────────────────────

[package]
id = "chess-coach"
name = "Chess Coach"
version = "1.0.1"
description = "Pulls your last games from Lichess, identifies recurring tactical mistakes (blunders, opening drift, endgame leaks), and drills you on the patterns to fix. Conversational, multilingual."
author = "Digitorn"
license = "Apache-2.0"
icon = "icon.png"
category = "education"

[package.source]
type = "official"
verified = true
publisher = "digitorn-official"

[package.compatibility]
digitorn_min = ">=1.0.0"
python_min = ">=3.12"
platforms = []

[package.requirements]
modules = ["http", "memory", "context_builder"]
recommended_models = [
  "deepseek-chat",
  "claude-haiku-4-5",
  "gpt-4o-mini",
]
external_tools = []
min_disk_mb = 0
min_memory_mb = 64

[package.credentials]
required = []
optional = ["deepseek", "anthropic", "openai"]

[package.permissions]
risk_level = "low"
network_access = true
filesystem_access = []
filesystem_scopes = []
requires_approval = []

[package.hub]
tags = ["chess", "coach", "lichess", "education", "tactics", "multilingual"]
screenshots = []
demo_video = ""

[package.release]
released_at = "2026-04-26"
release_notes = "Initial release. Single-agent Lichess game analyzer with multilingual coaching."
breaking = false
