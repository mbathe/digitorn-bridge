# ────────────────────────────────────────────────────────────────────
# Chess Coach - Single-agent Lichess analyser
# ────────────────────────────────────────────────────────────────────
#
# Pattern: "Conversational API consumer + pattern detector"
# Use case: User gives their Lichess username. The agent fetches the
#           last N rated games via the public Lichess API, parses the
#           PGN, identifies recurring tactical mistakes (opening drift,
#           middlegame blunders, endgame leaks), and produces a coaching
#           report with concrete drill suggestions.
#
# Lichess API used:
#   GET https://lichess.org/api/games/user/{username}?max={n}&pgnInJson=true
#       &moves=true&clocks=false&evals=true&opening=true
#       Accept: application/x-ndjson
#
# Why "low risk":
#   - Read-only API, no auth needed for public games
#   - Plain HTTP calls + LLM analysis, no shell, no filesystem
#   - User-provided username only
#
# Memory model:
#   - rss-style: store the user's lichess username under "chess.username"
#     so subsequent sessions don't have to re-ask.
#   - store recurring weakness patterns under "chess.weaknesses" so the
#     agent can drill the same mistake across sessions.
# ────────────────────────────────────────────────────────────────────

app:
  app_id: chess-coach
  name: "Chess Coach"
  version: "1.0.0"
  description: "Reviews your last 10 Lichess games, identifies recurring mistakes, drills you on the right tactics."
  icon: "♟️"
  color: "#769656"
  category: "education"
  author: "Digitorn"
  tags: [chess, coach, lichess, education, tactics, multilingual]
  quick_prompts:
    - label: "Analyse my last games"
      icon: "🔎"
      message: "Analyse mes 10 dernières parties Lichess. Mon username : "
    - label: "Recurring weaknesses"
      icon: "📉"
      message: "What are my recurring weaknesses across my recent games?"
    - label: "Daily drill"
      icon: "🎯"
      message: "Donne-moi un exercice tactique du jour basé sur mes erreurs récentes."
    - label: "Opening review"
      icon: "♞"
      message: "Review my opening choices in my last 10 games."

modules:
  http:
    config:
      max_response_size: 5242880    # 5 MB - 10 games of PGN ≈ 200 KB
      timeout: 30
  memory:
    config:
      auto_remember: true
      working_memory: true
  context_builder: {}

agents:
  - id: main
    role: assistant
    specialty: "Lichess game analysis + tactical pattern recognition + coaching"
    brain:
      provider: anthropic
      model: claude-haiku-4-5
      backend: anthropic
      config:
        api_key: "claude-code"      # uses the local ~/.claude/.credentials.json OAuth token
      temperature: 0.2
      max_tokens: 6144
      fallback:
        provider: deepseek
        model: deepseek-chat
        backend: openai_compat
        config:
          api_key: "{{env.DEEPSEEK_API_KEY}}"
          base_url: "https://api.deepseek.com/v1"
        temperature: 0.2
        max_tokens: 6144
      context:
        max_tokens: 128000
        strategy: summarize
        keep_recent: 10
        auto_compact: true
    system_prompt: "{{prompt.system}}"

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct


skills:
  - command: "/analyze"
    description: "Fetch the user's last games and produce a coaching report."
    path: "./skills/analyze.md"
  - command: "/weaknesses"
    description: "Recall stored weaknesses + suggest a focused drill."
    path: "./skills/weaknesses.md"
  - command: "/opening"
    description: "Review opening choices in recent games."
    path: "./skills/opening.md"

features:
  voice: false
  attachments: false
  tools_panel: true

theme:
  accent: "#769656"
