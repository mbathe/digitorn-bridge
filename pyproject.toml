[tool.poetry]
name = "digitorn"
version = "1.0.0"
description = "Declarative AI agent framework - build agent applications in YAML"
authors = ["Paul Mbathe <mbathepaul@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://digitorn.ai"
repository = "https://github.com/mbathe/digitorn-bridge"
documentation = "https://docs.digitorn.ai"
keywords = ["ai", "agent", "llm", "framework", "yaml", "multi-agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
packages = [{include = "digitorn", from = "packages"}]

# Files that must never appear in the wheel/sdist. Anything matched
# here is excluded by Poetry at build time. The release workflow runs
# `scripts/check-wheel-contents.py` AFTER the build to verify nothing
# slipped through, so this list and the script's FORBIDDEN list must
# stay in sync. See CONTRIBUTING.md for the threat model.
exclude = [
    # Private sibling packages (separate servers / SDKs / CLIs that
    # must stay closed-source). The build root is `packages/`, so
    # Poetry would happily slurp anything starting with "digitorn-*"
    # if we didn't say no.
    "packages/auth/**",
    "packages/digitorn-preview-sdk/**",
    "packages/digitorn_cli/**",

    # Inside the digitorn package: bundled web frontends ship their
    # source + compiled assets, NEVER node_modules / build caches.
    "packages/digitorn/builtins/*/web/node_modules",
    "packages/digitorn/builtins/*/web/.next",
    "packages/digitorn/builtins/*/web/dist",

    # Python build artifacts.
    "packages/digitorn/**/__pycache__",
    "packages/digitorn/**/*.pyc",

    # Repo-level dirs that have no business in a Python wheel.
    "tests/**",
    "tools/**",
    "scripts/**",
    "docs-site/**",
    "olds_doc/**",
    "**/node_modules/**",
    "**/.git/**",
    "**/.venv/**",
    "**/.env",
    "**/.env.*",
]

[tool.poetry.dependencies]
python = "^3.12"

# Core
tzdata = {version = ">=2024.1", markers = "sys_platform == 'win32'"}
psutil = "^6.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
structlog = "^24.0"
fastapi = "^0.115"
uvicorn = {version = ">=0.35,<1.0", extras = ["standard"]}
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
aiosqlite = "^0.20"
alembic = "^1.13"
typer = "^0.15"
rich = "^14.0"
httpx = "^0.28"
python-socketio = {version = "^5.16", extras = ["asyncio"]}
platformdirs = "^4.0"
watchfiles = "^1.0"
python-multipart = "^0.0.22"
diskcache = "^5.6.3"
prompt-toolkit = "^3.0.52"
PyYAML = "^6.0"
cryptography = ">=43.0,<48.0"

# Semantic search
fastembed = "^0.5"
qdrant-client = "^1.12"

# Cron scheduling
croniter = "^2.0"

# MCP
mcp = "^1.26"

# Auth
PyJWT = "^2.9"
bcrypt = "^5.0"

pygit2 = {version = "^1.14", optional = true}
aiohttp = "^3.9"
beautifulsoup4 = "^4.12"
html2text = "^2024.2"
# Database/infra backends (optional)
motor = {version = "^3.3", optional = true}
redis = {version = "^5.0", extras = ["hiredis"], optional = true}
ldap3 = {version = "^2.9", optional = true}
asyncpg = {version = "^0.31.0", optional = true}
psycopg = {version = "^3.3", extras = ["binary"], optional = true}
textual = "^8.1.1"

# Windows readline replacement (required for CLI on Windows)
pyreadline3 = {version = "^3.4", markers = "sys_platform == 'win32'"}

# libuv-based event loop for Windows. Replaces the default
# ProactorEventLoop whose synchronous WSASend / WSARecvInto syscalls
# stall the main loop when a TCP peer is slow or AV is scanning new
# sockets. Activated in server.py:start via
# ``windows_setup.install_winloop_policy()`` before ``uvicorn.run``.
# Windows-only by design: Linux/macOS users should install uvloop
# instead (not pinned here -- production deployment installs it).
winloop = {version = "^0.6.3", markers = "sys_platform == 'win32'"}

# Syntax highlighting (used by CLI TUI for code output)
pygments = "^2.17"

# Image processing (used by filesystem.read for image files)
Pillow = "^10.0"

# TOML parsing (for Python < 3.11 compat, also used by config loaders)
tomli = {version = "^2.0", markers = "python_version < '3.12'"}

# PDF generation (optional: pip install digitorn[pdf])
weasyprint = {version = "^64.0", optional = true}
markdown = {version = "^3.5", optional = true}

# Attachment text extractors. Used by ``core/file_extract.py`` at
# upload time so the agent can read PDFs / Office docs / RTFs /
# OpenDocument files via WsRead. Required (not optional) because
# the chat composer accepts these MIMEs by default.
pymupdf = "^1.24"
python-docx = "^1.1"
python-pptx = "^1.0"
lxml = "^5.0"
odfpy = "^1.4"
striprtf = "^0.0.27"

# Spreadsheet generation
openpyxl = "^3.1"
xlsxwriter = "^3.1"

# LLM providers
anthropic = ">=0.40"
openai = ">=1.0,<3.0"

# Token counting across providers (uses tiktoken / Anthropic local
# tokenizer / HuggingFace) — used by BaseLLMProvider.count_tokens.
litellm = ">=1.83"

# Optional modules (install via extras: pip install digitorn[browser,voice,rss])
playwright = {version = "^1.50", optional = true}
edge-tts = {version = "^7.0", optional = true}
feedparser = {version = "^6.0", optional = true}

# Optional: voice transcription (POST /api/transcribe)
faster-whisper = {version = "^1.0", optional = true}

# Optional: vector database backends
chromadb = {version = "^0.5", optional = true}
lancedb = {version = "^0.6", optional = true}
pinecone-client = {version = "^3.0", optional = true}

# Optional: search engine
elasticsearch = {version = "^8.0", optional = true}

# Optional: data science / charts
matplotlib = {version = "^3.8", optional = true}
numpy = {version = ">=1.26,<3.0", optional = true}
pyarrow = {version = ">=15.0,<22.0", optional = true}

# Optional: desktop automation / screenshots
pyautogui = {version = "^0.9", optional = true}
mss = {version = "^9.0", optional = true}

# Windows service registration (sc.exe + Event Viewer). Required on
# Windows so `digitorn service install` works out of the box.
pywin32 = {version = ">=306", markers = "sys_platform == 'win32'"}

[tool.poetry.extras]
browser = ["playwright"]
voice = ["edge-tts"]
transcribe = ["faster-whisper"]
rss = ["feedparser"]
pdf = ["weasyprint", "markdown"]
postgres = ["asyncpg", "psycopg"]
redis = ["redis"]
ldap = ["ldap3"]
mongo = ["motor"]
chromadb = ["chromadb"]
lancedb = ["lancedb"]
pinecone = ["pinecone-client"]
elasticsearch = ["elasticsearch"]
datascience = ["matplotlib", "numpy", "pyarrow"]
desktop = ["pyautogui", "mss"]
all = [
    "playwright", "edge-tts", "feedparser",
    "faster-whisper",
    "weasyprint", "markdown",
    "asyncpg", "redis", "ldap3", "motor",
    "chromadb", "lancedb", "pinecone-client", "elasticsearch",
    "matplotlib", "numpy", "pyarrow",
    "pyautogui", "mss",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"

[tool.poetry.scripts]
digitorn = "digitorn.core.server:main"
digitorn-supervisor = "digitorn.core.supervisor:main"
digitorn-worker = "digitorn.workers.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
