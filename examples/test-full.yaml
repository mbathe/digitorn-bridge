# Full-featured test app - enables ALL features for validation testing
# Background tasks, watchers, scheduler, memory, filesystem, shell
app:
  app_id: test-full
  name: "Full Test App"
  version: "1.0"
  description: "App with all features enabled for production validation"

modules:
  filesystem: {}
  shell: {}
  memory:
    config:
      working_memory: true
      todo_list: true
  web:
    config:
      search:
        primary: duckduckgo

execution:
  mode: conversation
  max_turns: 20
  timeout: 120
  greeting: "Full test app ready. All features enabled."
  watchers: true
  scheduler: true

agents:
  - id: main
    role: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "***REMOVED***"
      max_tokens: 4096
      context:
        max_tokens: 131000
        strategy: summarize
        keep_recent: 6
        auto_compact: true
    system_prompt: |
      You are a test assistant. Keep responses very short (1-2 sentences).
      ALWAYS use tools when asked. Never refuse.
      When asked to read a file, use the Read tool.
      When asked to run a command, use the Bash tool.
      When asked to remember something, use the Remember or SetGoal tool.
    capabilities:
      grant:
        - module: filesystem
          actions: [read, write, edit, glob, grep]
        - module: shell
          actions: [bash]
        - module: memory
          actions: [set_goal, remember, recall, add_todo, update_todo]
