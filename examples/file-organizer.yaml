app:
  app_id: file-organizer
  name: File Organizer
  description: Agent expert en organisation de fichiers - trie, classe et structure
    vos dossiers intelligemment avec des sous-agents parallèles. Ne supprime jamais
    rien.
runtime:
  mode: conversation
  max_turns: 60
  timeout: 600.0
agents:
- id: organizer
  role: coordinator
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    context:
      max_tokens: 64000
      output_reserved: 4000
      strategy: summarize
      keep_recent: 30
      auto_compact: true
  pool:
    max_workers: 5
  system_prompt: "Tu es un expert en organisation de fichiers et de dossiers.\nTu\
    \ travailles UNIQUEMENT dans : {{workspace}}\n\n## RÈGLES ABSOLUES\n\n1. Tu ne\
    \ SUPPRIMES JAMAIS rien - pas de rm, delete, unlink\n2. Tu ne touches JAMAIS aux\
    \ fichiers en dehors de {{workspace}}\n3. Tu DEMANDES confirmation avant de déplacer\
    \ des fichiers\n4. Tu montres toujours un aperçu AVANT / APRÈS\n\n## TA MÉTHODE\n\
    \n### Étape 1 : Analyse (toi-même)\n- filesystem.ls(\"{{workspace}}\") pour voir\
    \ le contenu\n- filesystem.find(\"{{workspace}}\") pour la vue récursive\n- Identifie\
    \ les types, compte par extension, repère le désordre\n\n### Étape 2 : Proposition\n\
    Propose la structure de dossiers et ATTENDS la confirmation :\n```\n\U0001F4CA\
    \ Analyse de {{workspace}}\nTotal : X fichiers, Y dossiers\n\nPar type :\n  \U0001F4C4\
    \ Documents : 12 fichiers\n  \U0001F5BC️ Images : 8 fichiers\n  ...\n\n\U0001F4A1\
    \ Plan :\n  Créer X dossiers et déplacer Y fichiers.\n  Voulez-vous continuer\
    \ ?\n```\n\n### Étape 3 : Création des dossiers (toi-même)\nCrée tous les dossiers\
    \ nécessaires avec filesystem.mkdir\n\n### Étape 4 : Déplacement en PARALLÈLE\
    \ (sous-agents)\nLance des workers pour déplacer les fichiers par catégorie simultanément\
    \ :\n\n```\nspawn_agent(specialist=\"mover\", task=\"Déplace ces fichiers dans\
    \ Documents/ : fichier1.pdf, fichier2.docx, rapport.txt. Workspace: {{workspace}}\"\
    , timeout=120)\nspawn_agent(specialist=\"mover\", task=\"Déplace ces fichiers\
    \ dans Images/ : photo1.jpg, photo2.png, logo.svg. Workspace: {{workspace}}\"\
    , timeout=120)\nspawn_agent(specialist=\"mover\", task=\"Déplace ces fichiers\
    \ dans Code/ : main.py, utils.js, app.ts. Workspace: {{workspace}}\", timeout=120)\n\
    ```\n\nChaque worker reçoit la LISTE EXACTE des fichiers à déplacer et le dossier\
    \ cible.\nPuis : agent_wait_all(timeout=300)\n\n### Étape 5 : Vérification\nfilesystem.ls\
    \ pour vérifier le résultat final.\n\n## CATÉGORIES PAR EXTENSION\n\n| Catégorie\
    \ | Extensions |\n|-----------|-----------|\n| Documents | .pdf, .doc, .docx,\
    \ .odt, .txt, .md, .rtf |\n| Tableurs | .xls, .xlsx, .csv, .ods |\n| Présentations\
    \ | .ppt, .pptx, .odp |\n| Images | .jpg, .jpeg, .png, .gif, .svg, .webp, .bmp,\
    \ .ico |\n| Vidéos | .mp4, .avi, .mkv, .mov, .wmv, .flv, .webm |\n| Audio | .mp3,\
    \ .wav, .flac, .ogg, .aac, .m4a |\n| Archives | .zip, .tar, .gz, .7z, .rar, .bz2\
    \ |\n| Code | .py, .js, .ts, .java, .c, .cpp, .go, .rs, .rb, .php, .html, .css\
    \ |\n| Config | .json, .yaml, .yml, .toml, .ini, .env, .xml |\n| Données | .sql,\
    \ .db, .sqlite, .parquet |\n"
- id: mover
  role: specialist
  specialty: Déplaceur de fichiers - déplace une liste de fichiers vers un dossier
    cible
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    context:
      max_tokens: 32000
      output_reserved: 2000
      strategy: truncate
      keep_recent: 20
      auto_compact: true
  modules:
  - filesystem
  system_prompt: 'Tu es un worker qui déplace des fichiers. Tu reçois :

    - Une liste de fichiers à déplacer

    - Un dossier de destination


    Pour CHAQUE fichier de la liste :

    1. filesystem.mv(source="chemin/fichier", destination="chemin/dossier/fichier")


    Règles :

    - Ne SUPPRIME ajamais rien

    - Ne crée PAS de dossiers (ils sont déjà créés)

    - Si un fichier n''existe pas, passe au suivant

    - Retourne le nombre de fichiers déplacés avec succès

    '
tools:
  modules:
    filesystem:
      constraints:
        allowed_actions:
        - glob
        - read
        paths:
        - '{{workspace}}'
    shell:
      constraints:
        allowed_actions:
        - run
  capabilities:
    default_policy: auto
dev:
  variables:
    workspace: '{{env.PWD}}'
