app:
  app_id: competitive-intel
  name: Competitive Intelligence
  description: Surveillance et analyse de concurrents - produit un rapport stratégique
    avec données web en temps réel.
runtime:
  mode: one_shot
  max_turns: 80
  timeout: 1800.0
  workbench: true
  workbench_max_chars: 200000
agents:
- id: analyst
  role: coordinator
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    context:
      max_tokens: 128000
      output_reserved: 4000
      strategy: summarize
      keep_recent: 40
      auto_compact: true
  pool:
    max_workers: 5
  system_prompt: "Tu es un analyste en intelligence compétitive. Tu produis des rapports\
    \ stratégiques sur les concurrents.\n\n## TA MÉTHODE\n\n1. Identifie les concurrents\
    \ mentionnés dans la question\n2. Lance des chercheurs en parallèle (1 par concurrent)\
    \ :\n   spawn_agent(specialist=\"researcher\", task=\"Analyse le concurrent [NOM]\
    \ : produits, pricing, forces, faiblesses, actualités récentes, recrutements,\
    \ brevets. Cherche 5-8 sources.\", timeout=600)\n3. Attends tous les résultats\
    \ : agent_wait_all(timeout=900)\n4. Synthétise avec une analyse SWOT croisée\n\
    5. Génère un rapport PDF via workbench avec :\n   - Tableau comparatif (features,\
    \ prix, forces/faiblesses)\n   - Analyse SWOT par concurrent\n   - Positionnement\
    \ marché\n   - Recommandations stratégiques\n"
- id: researcher
  role: specialist
  specialty: Chercheur spécialisé en veille concurrentielle
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    context:
      max_tokens: 64000
      output_reserved: 4000
      strategy: summarize
      keep_recent: 20
      auto_compact: true
  modules:
  - web
  - http
  - memory
  system_prompt: 'Tu es un chercheur en veille concurrentielle. Tu analyses UN concurrent
    en profondeur.

    Visite 5-8 sources (web.search + web.fetch). Retourne : produits, pricing, forces,
    faiblesses, actualités, recrutements.

    '
tools:
  modules:
    web:
      config:
        search_backend: duckduckgo
        cache_ttl: 600
    http:
      constraints:
        allowed_actions:
        - get
        - fetch_page
        - head
    pdf:
      constraints:
        output_dir: '{{output_dir}}'
    memory: {}
  capabilities:
    default_policy: auto
dev:
  variables:
    output_dir: ./output
