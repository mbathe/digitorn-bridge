app:
  app_id: thinking-chat
  name: Thinking Chat
  description: Assistant avec raisonnement visible (DeepSeek R1).
runtime:
  mode: conversation
agents:
- id: thinker
  role: assistant
  brain:
    provider: deepseek
    model: deepseek-reasoner
    backend: openai_compat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  system_prompt: 'Tu es un assistant intelligent. Tu réfléchis étape par étape avant
    de répondre.

    '
tools:
  modules:
    hello: {}
  capabilities:
    default_policy: auto
ui:
  greeting: Je suis un assistant qui réfléchit avant de répondre. Posez-moi une question
    !
