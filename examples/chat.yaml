app:
  app_id: chat-assistant
  name: Chat Assistant
  description: Interactive conversation with tool access.
runtime:
  mode: conversation
agents:
- id: assistant
  role: assistant
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  system_prompt: 'Tu es un assistant intelligent et amical. Tu réponds en français.

    Tu as accès à des outils - utilise-les quand c''est pertinent.

    '
tools:
  modules:
    hello: {}
    filesystem: {}
  capabilities:
    default_policy: auto
ui:
  greeting: Bienvenue ! Je suis ton assistant Digitorn. Que puis-je faire pour toi
    ?
