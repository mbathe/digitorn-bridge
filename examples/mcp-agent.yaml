app:
  app_id: mcp-agent
  name: MCP Agent
  description: Agent connecté à des serveurs MCP externes - expose automatiquement
    leurs tools via le context_builder.
runtime:
  mode: conversation
  max_turns: 200
  timeout: 1200.0
agents:
- id: assistant
  role: assistant
  brain:
    provider: openai
    model: gpt-4o-mini
    backend: openai_compat
    config:
      api_key: '{{env.OPENAI_API_KEY}}'
    context:
      max_tokens: 128000
      strategy: summarize
      keep_recent: 20
      auto_compact: true
  system_prompt: 'Tu es un assistant connecté à des serveurs MCP externes.

    Leurs outils sont disponibles automatiquement via la recherche.

    Utilise search_tools pour trouver les outils MCP disponibles.

    '
tools:
  modules:
    filesystem:
      constraints:
        allowed_actions:
        - read
        - glob
        - grep
        - write
    mcp:
      config:
        servers:
          filesystem:
            path: '{{workspace}}'
ui:
  greeting: 'Agent MCP prêt ! Les serveurs MCP sont connectés et leurs outils

    sont disponibles comme des outils natifs.

    Utilise search_tools ou list_categories pour découvrir les outils.

    '
dev:
  variables:
    workspace: '{{env.PWD}}'
