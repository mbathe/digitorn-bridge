app:
  app_id: gmail-agent
  name: Gmail Agent
  description: Assistant Gmail connecte via MCP - lit, cherche et envoie des emails.
runtime:
  mode: conversation
  max_turns: 20
  timeout: 120.0
agents:
- id: assistant
  role: assistant
  brain:
    provider: openrouter
    model: qwen/qwen3-235b-a22b
    backend: openai_compat
    max_tokens: 4096
    config:
      api_key: '{{secret.OPENROUTER_API_KEY}}'
      base_url: https://openrouter.ai/api/v1
    context:
      max_tokens: 90000
      output_reserved: 2000
      strategy: summarize
      keep_recent: 20
      auto_compact: true
  system_prompt: 'Tu es un assistant Gmail. Tu peux lire, chercher et envoyer des
    emails.

    Reponds en francais. Sois concis.

    '
tools:
  modules:
    mcp:
      config:
        servers:
        - gmail
