app:
  app_id: test-minimax
  name: Test Minimax
  version: '1.0'
runtime:
  mode: conversation
  max_turns: 10
  timeout: 60
agents:
- id: main
  role: assistant
  brain:
    backend: openai_compat
    model: MiniMax-Text-01
    config:
      api_key: sk-api-fz28BKDueQ23lkbj2MNLAEYLSkA1GW903n3lDKhMnZjGGWzqvJ2d0jeqAuVAzKsICMAVFVLNnEY-fDCK5L8JjgDcebfl0clsG0IgnSko1qfEg3G1xbv8DcY
      base_url: https://api.minimaxi.chat/v1
    max_tokens: 4096
  system_prompt: 'You are a test assistant. Keep responses very short.

    ALWAYS use tools when asked. Never refuse to use a tool.

    '
  capabilities:
    grant:
    - module: filesystem
      actions:
      - read
      - write
      - edit
      - glob
      - grep
    - module: shell
      actions:
      - bash
    - module: memory
      actions:
      - set_goal
      - remember
      - recall
      - add_todo
      - update_todo
tools:
  modules:
    filesystem: {}
    shell: {}
    memory:
      config:
        working_memory: true
        todo_list: true
