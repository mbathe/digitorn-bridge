app:
  app_id: approval-test
  name: Approval Test
  version: "1.0"

runtime:
  mode: conversation
  workdir_mode: auto
  max_turns: 5
  timeout: 60

agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    backend: anthropic
    config:
      api_key: claude-code
    temperature: 0
    max_tokens: 1024
  system_prompt: "You are a stub agent for the approval E2E test."

tools:
  modules:
    filesystem: {}
  capabilities:
    default_policy: approve
    max_risk_level: high
    grant: []
    approve:
    - module: filesystem
      actions: [write]

ui:
  greeting: "Approval test app - file writes require approval."
