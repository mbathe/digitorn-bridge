app:
  app_id: rag-14-docs
  name: Documentation Assistant
runtime:
  mode: conversation
  workdir: '{{workspace}}'
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
  system_prompt: 'Tu es un assistant documentation. Tu réponds aux questions

    en te basant sur les documents indexés. Cite toujours tes sources.

    '
tools:
  modules:
    filesystem:
      constraints:
        paths:
        - '{{workspace}}'
        allowed_actions:
        - read
        - glob
        - grep
    rag:
      sources:
      - type: file
        path: '{{workspace}}/docs'
        extensions:
        - .md
        - .txt
        watch: true
        recursive: true
      auto_index:
        on_start: true
      citations:
        enabled: true
ui:
  greeting: 'Documentation assistant prêt. Le dossier docs/ est indexé automatiquement.

    '
dev:
  variables:
    workspace: '{{env.PWD}}'
