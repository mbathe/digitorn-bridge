app:
  app_id: rag-09-bge-m3
  name: RAG BGE-M3 Multilingual
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      embedding_model: bge-m3
ui:
  greeting: 'RAG avec BGE-M3 - embeddings multilingues SOTA (100+ langues).

    Posez vos questions dans n''importe quelle langue.

    '
