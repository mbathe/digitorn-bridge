app:
  app_id: rag-06-bm25
  name: RAG BM25 Only
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      pipeline:
        retrieval: bm25
        final_top_k: 10
ui:
  greeting: 'Recherche par mots-clés (BM25). Idéal pour les codes d''erreur

    et les termes techniques exacts.

    '
