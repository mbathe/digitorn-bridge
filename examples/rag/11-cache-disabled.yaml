app:
  app_id: rag-11-no-cache
  name: RAG No Cache
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      cache:
        enabled: false
ui:
  greeting: 'RAG sans cache sémantique. Chaque requête passe par le pipeline complet.

    Utile quand les données changent fréquemment.

    '
