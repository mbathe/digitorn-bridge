# 11 - Cache sémantique désactivé
# Pour les cas où chaque requête doit être fraîche (données temps réel).

app:
  app_id: rag-11-no-cache
  name: "RAG No Cache"

modules:
  rag:
    cache:
      enabled: false

agents:
  - id: main
    brain:
      provider: deepseek
      backend: openai_compat
      model: deepseek-chat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1

execution:
  mode: conversation
  greeting: |
    RAG sans cache sémantique. Chaque requête passe par le pipeline complet.
    Utile quand les données changent fréquemment.
