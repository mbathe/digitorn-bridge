app:
  app_id: rag-17-chroma
  name: RAG ChromaDB
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      backend:
        type: chroma
        path: /tmp/digitorn-chroma
ui:
  greeting: 'RAG avec ChromaDB persistant.

    Les données survivent entre les sessions.

    '
