app:
  app_id: rag-05-semantic
  name: RAG Semantic Only
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      pipeline:
        retrieval: semantic
        final_top_k: 5
ui:
  greeting: 'Recherche sémantique pure - idéal pour les questions conceptuelles.

    '
