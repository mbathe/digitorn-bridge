# 05 - Recherche sémantique pure
# Désactive BM25, utilise uniquement la similarité vectorielle.

app:
  app_id: rag-05-semantic
  name: "RAG Semantic Only"

modules:
  rag:
    pipeline:
      retrieval: semantic
      final_top_k: 5

agents:
  - id: main
    brain:
      provider: deepseek
      backend: openai_compat
      model: deepseek-chat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1

execution:
  mode: conversation
  greeting: |
    Recherche sémantique pure - idéal pour les questions conceptuelles.
