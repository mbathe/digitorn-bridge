app:
  app_id: rag-13-citations
  name: RAG Verified Citations
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
  system_prompt: 'Tu es un assistant de recherche rigoureux.

    TOUJOURS citer tes sources avec [1], [2], etc.

    Si tu ne trouves pas de source, dis-le explicitement.

    '
tools:
  modules:
    rag:
      citations:
        enabled: true
        format: inline
        verify: true
ui:
  greeting: 'Assistant avec citations vérifiées. Chaque affirmation est sourcée.

    '
