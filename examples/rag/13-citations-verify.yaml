# 13 — Citations avec vérification
# Active la vérification post-génération des citations [N].
# Le système vérifie que chaque [N] référence une source réelle.

app:
  app_id: rag-13-citations
  name: "RAG Verified Citations"

modules:
  rag:
    citations:
      enabled: true
      format: inline
      verify: true

agents:
  - id: main
    brain:
      provider: deepseek
      backend: openai_compat
      model: deepseek-chat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1
    system_prompt: |
      Tu es un assistant de recherche rigoureux.
      TOUJOURS citer tes sources avec [1], [2], etc.
      Si tu ne trouves pas de source, dis-le explicitement.

execution:
  mode: conversation
  greeting: |
    Assistant avec citations vérifiées. Chaque affirmation est sourcée.
