app:
  app_id: rag-19-qdrant-persistent
  name: RAG Qdrant Persistent
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      backend:
        type: qdrant
        path: /tmp/digitorn-qdrant
        quantization: int8
ui:
  greeting: 'RAG avec Qdrant persistant + quantization int8.

    Les données survivent entre les sessions, recherche 3x plus rapide.

    '
