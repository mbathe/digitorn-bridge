app:
  app_id: rag-01-zero-config
  name: RAG Zero Config
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
    max_tokens: 4096
tools:
  modules:
    rag: {}
ui:
  greeting: 'Je suis un assistant RAG. Donne-moi des documents à indexer,

    puis pose-moi des questions.

    '
