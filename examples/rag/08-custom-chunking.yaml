# 08 - Chunking personnalisé
# Gros chunks de 1000 chars avec 100 de chevauchement, split par paragraphe.

app:
  app_id: rag-08-chunking
  name: "RAG Custom Chunking"

modules:
  rag:
    chunking:
      strategy: paragraph
      size: 1000
      overlap: 100

agents:
  - id: main
    brain:
      provider: deepseek
      backend: openai_compat
      model: deepseek-chat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1

execution:
  mode: conversation
  greeting: |
    RAG avec chunking par paragraphe (1000 chars, 100 overlap).
    Parfait pour les articles et la documentation longue.
