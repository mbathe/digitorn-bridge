app:
  app_id: rag-08-chunking
  name: RAG Custom Chunking
runtime:
  mode: conversation
agents:
- id: main
  brain:
    provider: deepseek
    backend: openai_compat
    model: deepseek-chat
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
      base_url: https://api.deepseek.com/v1
    temperature: 0.1
tools:
  modules:
    rag:
      chunking:
        strategy: paragraph
        size: 1000
        overlap: 100
ui:
  greeting: 'RAG avec chunking par paragraphe (1000 chars, 100 overlap).

    Parfait pour les articles et la documentation longue.

    '
