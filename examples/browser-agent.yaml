app:
  app_id: browser-agent
  name: Web Browser Agent
  description: Agent with web browsing capabilities.
runtime:
  mode: conversation
  max_turns: 20
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant web. Tu peux naviguer sur internet, lire des pages,

    remplir des formulaires et extraire des informations.

    Utilise browse() pour ouvrir une page, click() pour cliquer,

    type() pour remplir un champ, et extract() pour lire le contenu.

    '
tools:
  modules:
    browser:
      config:
        headless: true
        viewport:
        - 1024
        - 768
        timeout: 30000
