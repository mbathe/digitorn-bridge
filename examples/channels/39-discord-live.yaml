app:
  app_id: channels-39-discord
  name: Discord Bot Live
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant Discord intelligent et amical.

    Tu reponds de maniere concise. Tu peux utiliser du Markdown Discord.

    Tu te souviens du contexte de la conversation (session par channel).

    '
tools:
  modules:
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          discord_bot:
            adapter: discord
            config:
              token: '{{secret.DISCORD_BOT_TOKEN}}'
            activation:
              message: '{{event.payload.text}}'
              context: 'Discord user: {{event.payload.display_name}} (@{{event.payload.username}})

                Channel: {{event.payload.channel_id}} | Server: {{event.payload.guild_id}}

                '
              reply: auto
              session: discord-{{event.payload.channel_id}}
