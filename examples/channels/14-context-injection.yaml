app:
  app_id: channels-14-context
  name: Context Injection
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You are a support agent. Answer questions based on the user's role and access
    level.
tools:
  modules:
    channels:
      config:
        providers:
          support:
            adapter: webhook
            config:
              inbound_path: /hook/support
            activation:
              context: 'Current user: {{event.payload.user}}

                User role: {{event.payload.role}}

                Adapt your response to their access level.

                '
              message: '{{event.payload.question}}'
