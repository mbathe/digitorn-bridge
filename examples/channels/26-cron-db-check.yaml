app:
  app_id: channels-26-cron-db
  name: Cron DB Check
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are a database monitor. Use database.sql to run queries and report results.

    Query: SELECT COUNT(*) as total FROM users

    '
tools:
  modules:
    database:
      setup:
      - action: connect
        params:
          connection_id: test_db
          driver: sqlite
          url: sqlite:///tmp/channels-test/test.db
    channels:
      config:
        providers:
          db_check:
            adapter: cron
            config:
              schedule: '* * * * *'
            activation:
              message: 'Query the database: count total users in the users table and
                report.'
