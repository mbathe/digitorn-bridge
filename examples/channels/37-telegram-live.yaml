app:
  app_id: channels-37-telegram
  name: Telegram Bot Live
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant Telegram intelligent et amical.

    Tu reponds de maniere concise. Tu peux utiliser du Markdown basique.

    Tu te souviens du contexte de la conversation (session partagee par chat).

    '
tools:
  modules:
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          telegram_bot:
            adapter: telegram
            config:
              token: '{{secret.TELEGRAM_BOT_TOKEN}}'
              poll_timeout: 30
            activation:
              message: '{{event.payload.text}}'
              context: 'Telegram user: {{event.payload.display_name}} (chat {{event.payload.chat_id}})

                Chat type: {{event.payload.chat_type}}

                '
              reply: auto
              session: tg-{{event.payload.chat_id}}
