app:
  app_id: channels-19-route-dynamic
  name: Dynamic Route
runtime:
  mode: background
agents:
- id: tech_agent
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: Technical support. Answer IT questions. Start your response with [TECH AGENT].
- id: billing_agent
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: Billing support. Handle invoice and payment questions. Start with [BILLING
    AGENT].
- id: general_agent
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: General support. Handle miscellaneous requests. Start with [GENERAL AGENT].
tools:
  modules:
    channels:
      config:
        providers:
          support:
            adapter: webhook
            config:
              inbound_path: /hook/support
            activation:
              route:
                field: event.payload.department
                rules:
                - match: tech
                  agent: tech_agent
                - match: billing
                  agent: billing_agent
                - default: true
                  agent: general_agent
              message: '[{{event.payload.department}}] {{event.payload.question}}'
