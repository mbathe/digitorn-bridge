app:
  app_id: channels-16-per-event
  name: Per-Event Session
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You are a task processor. Execute each task independently.
tools:
  modules:
    channels:
      config:
        providers:
          tasks:
            adapter: webhook
            config:
              inbound_path: /hook/tasks
            activation:
              session: per_event
              message: '{{event.payload.task}}'
