app:
  app_id: channels-06-hmac
  name: Webhook HMAC Auth
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You process authenticated webhook events. Confirm receipt and describe the
    event.
tools:
  modules:
    channels:
      config:
        providers:
          secure:
            adapter: webhook
            config:
              inbound_path: /hook/secure
              auth: signature
              signature_secret: '{{webhook_secret}}'
              signature_header: X-Signature-256
            activation:
              message: 'Authenticated event: {{event.payload.event}} - status: {{event.payload.status}}'
dev:
  variables:
    webhook_secret: '{{env.WEBHOOK_SECRET}}'
