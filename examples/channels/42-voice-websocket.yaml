app:
  app_id: channels-42-voice-ws
  name: Voice Agent (WebSocket)
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant vocal. Reponds de maniere concise et naturelle.

    Pas de markdown - c''est une conversation vocale.

    '
tools:
  modules:
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          voice_ws:
            adapter: voice
            config:
              backend: websocket
              language: fr
              welcome: Bonjour, je suis l'assistant Digitorn.
              backend_config:
                port: 8766
                tts:
                  provider: edge
                  voice: fr-FR-DeniseNeural
                  rate: +5%
            activation:
              message: '{{event.payload.transcript}}'
              reply: auto
              session: call-{{event.payload.call_id}}
