app:
  app_id: channels-35-support
  name: IT Support Center
  description: Multi-channel IT support with routing, enrichment, and specialized
    agents
runtime:
  mode: background
agents:
- id: receptionist
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are the IT support receptionist. Start your responses with [RECEPTIONIST].

    - Greet the client by name (from context)

    - Assess the issue based on their message and open tickets

    - If the client is premium, prioritize their request

    - For simple issues, resolve directly using the procedures

    - For complex issues, acknowledge and explain next steps

    - Send important updates to the "notifications" channel

    '
- id: network_expert
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are the network specialist. Start responses with [NETWORK].

    - Diagnose VPN, DNS, firewall, and connectivity issues

    - Reference the IT procedures from context

    - Check client''s open tickets for related issues

    - Insert a new ticket record in the database when needed

    - Send resolution to "notifications"

    '
- id: software_expert
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are the software specialist. Start responses with [SOFTWARE].

    - Handle software installation, configuration, and crash issues

    - Check client''s history for recurring problems

    '
- id: monitor
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are the monitoring agent. Start responses with [MONITOR].

    - For daily checks: query the database and report ticket stats

    - For alerts: assess severity and suggest remediation

    - Always send summaries to the "notifications" channel

    '
- id: file_analyst
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are the file analyst. Start responses with [FILE].

    - Read uploaded files using filesystem.read

    - Analyze content (logs, reports, data)

    - Report findings

    '
tools:
  modules:
    filesystem:
      constraints:
        paths:
        - /tmp/channels-test/support-docs
        - /tmp/channels-test/uploads
    database:
      setup:
      - action: connect
        params:
          connection_id: support_db
          driver: sqlite
          url: sqlite:///tmp/channels-test/support.db
    memory: {}
    channels:
      config:
        default_agent: receptionist
        max_turns: 20
        timeout: 90
        secret_filter_enabled: true
        providers:
          daily_check:
            adapter: cron
            config:
              schedule: '* * * * *'
            activation:
              agent: monitor
              message: 'Daily check:

                1. Query the database for open tickets: SELECT id, title, status,
                created_at FROM tickets WHERE status=''open''

                2. Report how many open tickets exist

                3. Send a summary to the "notifications" channel

                '
          upload_watcher:
            adapter: file_watcher
            config:
              paths:
              - /tmp/channels-test/uploads/*
              poll_interval: 5
            activation:
              agent: file_analyst
              message: 'New upload: {{event.payload.filename}} ({{event.payload.size}}
                bytes). Read and analyze the file.'
          support_tickets:
            adapter: webhook
            config:
              inbound_path: /hook/support
            activation:
              filter:
              - field: event.payload.status
                equals: new
              prepare:
              - action: database.fetch_results
                params:
                  query: SELECT name, email, plan, department FROM clients WHERE id
                    = {{event.payload.client_id}}
                as: client
              - action: database.fetch_results
                params:
                  query: SELECT id, title, status FROM tickets WHERE client_id = {{event.payload.client_id}}
                    AND status = 'open'
                as: open_tickets
              - action: filesystem.read
                params:
                  path: /tmp/channels-test/support-docs/procedures.txt
                as: procedures
              route:
                field: event.payload.category
                rules:
                - match: network
                  agent: network_expert
                - match: software
                  agent: software_expert
                - default: true
                  agent: receptionist
              session: ticket-{{event.payload.client_id}}
              context: 'Client: {{client.0.name}} ({{client.0.email}})

                Plan: {{client.0.plan}} | Department: {{client.0.department}}

                Open tickets: {{open_tickets}}

                IT Procedures: {{procedures}}

                '
              message: '{{event.payload.message}}'
          monitoring:
            adapter: webhook
            config:
              inbound_path: /hook/monitoring
            activation:
              filter:
              - field: event.payload.severity
                not_equals: info
              agent: monitor
              context: 'ALERT from {{event.payload.source}}: {{event.payload.alert}}
                ({{event.payload.severity}})'
              message: 'Handle this alert immediately: {{event.payload.alert}}'
          notifications:
            adapter: log
            config:
              level: warning
              logger: digitorn.support.notifications
  capabilities:
    grant:
    - module: channels
      actions:
      - send_message
      reason: Send ticket updates and alerts to the notifications channel
    - module: channels
      actions:
      - list_providers
      reason: Discover available channel providers
    - module: channels
      actions:
      - stats
      reason: Read channel delivery statistics for monitoring reports
    - module: channels
      actions:
      - provider_history
      reason: Access provider message history for audit and diagnostics
