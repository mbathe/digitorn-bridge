app:
  app_id: channels-15-session
  name: Shared Session
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You are a friendly chatbot. Remember what users tell you within the conversation.
tools:
  modules:
    channels:
      config:
        providers:
          chat:
            adapter: webhook
            config:
              inbound_path: /hook/chat
            activation:
              session: user-{{event.payload.from}}
              message: '{{event.payload.message}}'
