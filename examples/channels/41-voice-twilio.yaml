app:
  app_id: channels-41-voice
  name: Voice Agent (Twilio)
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant telephonique. Tu parles naturellement, de maniere

    concise et claire. Pas de markdown ni de formatage - c''est une

    conversation vocale. Reponds en 1-2 phrases maximum.

    '
tools:
  modules:
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          phone:
            adapter: voice
            config:
              backend: twilio_cr
              language: fr
              welcome: Bonjour, je suis l'assistant Digitorn. Comment puis-je vous
                aider ?
              backend_config:
                port: 8765
                tts_provider: google
                stt_provider: deepgram
                voice: fr-FR-Standard-A
                interruptible: speech
            activation:
              message: '{{event.payload.transcript}}'
              context: 'Voice call from {{event.payload.caller}}.

                Direction: {{event.payload.direction}}.

                Language: {{event.payload.language}}.

                Respond naturally and concisely - this is a phone conversation.

                '
              reply: auto
              session: call-{{event.payload.call_id}}
