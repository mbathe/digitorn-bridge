app:
  app_id: channels-36-gmail
  name: Gmail Live Test
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant email intelligent. Tu reponds aux emails de maniere

    concise, professionnelle et utile. Tu signes "Digitorn Assistant".

    '
tools:
  modules:
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          gmail_inbox:
            adapter: email
            config:
              imap:
                host: imap.gmail.com
                port: 993
                user: '{{env.GMAIL_ADDRESS}}'
                password: '{{secret.GMAIL_APP_PASSWORD}}'
                folder: INBOX
              smtp:
                host: smtp.gmail.com
                port: 587
                user: '{{env.GMAIL_ADDRESS}}'
                password: '{{secret.GMAIL_APP_PASSWORD}}'
              from_address: '{{env.GMAIL_ADDRESS}}'
              poll_interval: 30
            activation:
              message: 'New email from {{event.payload.from}}:

                Subject: {{event.payload.subject}}


                {{event.payload.body}}

                '
              context: 'You received this email at {{event.timestamp}}.

                Reply concisely and helpfully. Sign as "Digitorn Assistant".

                '
              reply: auto
              session: email-{{event.payload.from}}
