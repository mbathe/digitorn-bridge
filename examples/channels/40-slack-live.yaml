app:
  app_id: channels-40-slack
  name: Slack Bot Live
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un assistant Slack intelligent et concis.

    Tu reponds dans le thread du message. Tu peux utiliser le format mrkdwn de Slack.

    Tu te souviens du contexte de la conversation (session par channel).

    '
tools:
  modules:
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          slack_bot:
            adapter: slack
            config:
              bot_token: '{{secret.SLACK_BOT_TOKEN}}'
              app_token: '{{secret.SLACK_APP_TOKEN}}'
            activation:
              message: '{{event.payload.text}}'
              context: 'Slack user: {{event.payload.user_id}}

                Channel: {{event.payload.channel_id}} ({{event.payload.channel_type}})

                '
              reply: auto
              session: slack-{{event.payload.channel_id}}
