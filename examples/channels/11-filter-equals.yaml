app:
  app_id: channels-11-filter
  name: Filter Equals
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You triage incoming support tickets. Acknowledge each new ticket and suggest
    a priority.
tools:
  modules:
    channels:
      config:
        providers:
          tickets:
            adapter: webhook
            config:
              inbound_path: /hook/tickets
            activation:
              filter:
              - field: event.payload.status
                equals: new
              message: 'New ticket: {{event.payload.title}}'
