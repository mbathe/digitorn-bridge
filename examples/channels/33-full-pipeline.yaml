app:
  app_id: channels-33-full-pipeline
  name: Full Pipeline
runtime:
  mode: background
agents:
- id: tech_agent
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Technical support agent. Start with [TECH]. Use the client context.

    After resolving, log to the audit channel.

    '
- id: billing_agent
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Billing support agent. Start with [BILLING]. Use the client context.

    '
- id: general_agent
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: General support. Start with [GENERAL].
tools:
  modules:
    database:
      setup:
      - action: connect
        params:
          connection_id: test_db
          driver: sqlite
          url: sqlite:///tmp/channels-test/test.db
    channels:
      config:
        providers:
          tickets:
            adapter: webhook
            config:
              inbound_path: /hook/tickets
            activation:
              filter:
              - field: event.payload.status
                equals: new
              prepare:
              - action: database.fetch_results
                params:
                  query: SELECT name, plan, dept FROM clients WHERE id = {{event.payload.client_id}}
                as: client
              route:
                field: client.0.dept
                rules:
                - match: tech
                  agent: tech_agent
                - match: billing
                  agent: billing_agent
                - default: true
                  agent: general_agent
              context: 'Client: {{client.0.name}} (plan: {{client.0.plan}}, dept:
                {{client.0.dept}})

                '
              message: '{{event.payload.message}}'
              session: ticket-{{event.payload.client_id}}
          audit:
            adapter: log
            config:
              level: info
              logger: digitorn.audit
  capabilities:
    grant:
    - module: channels
      actions:
      - send_message
      reason: Send audit log entries after processing support tickets
    - module: channels
      actions:
      - list_providers
      reason: Discover available channel providers
