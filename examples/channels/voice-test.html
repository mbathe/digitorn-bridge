<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitorn Voice — Full Duplex</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0a0a12; color: #f0f0f4; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #status { font-size: 14px; color: #737373; margin-bottom: 24px; }
  #mic { width: 120px; height: 120px; border-radius: 50%; border: 3px solid #333; background: #141414; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  #mic:hover { border-color: #555; }
  #mic.listening { border-color: #ef4444; background: #1a0a0a; animation: pulse 1.5s infinite; }
  #mic.speaking { border-color: #2b7fff; background: #0a0a1a; }
  #mic svg { width: 48px; height: 48px; fill: #737373; transition: fill 0.2s; }
  #mic.listening svg { fill: #ef4444; }
  #mic.speaking svg { fill: #2b7fff; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); } 50% { box-shadow: 0 0 0 20px rgba(239,68,68,0); } }
  #transcript { margin-top: 32px; max-width: 500px; text-align: center; min-height: 60px; }
  #transcript .user { color: #737373; font-size: 14px; margin-bottom: 8px; }
  #transcript .agent { color: #f0f0f4; font-size: 16px; }
  #log { position: fixed; bottom: 16px; left: 16px; right: 16px; max-height: 120px; overflow-y: auto; font-size: 11px; color: #555; font-family: monospace; }
  .mode { position: fixed; top: 16px; right: 16px; font-size: 11px; color: #2b7fff; }
</style>
</head>
<body>

<div class="mode">Full-Duplex Streaming</div>
<div id="status">Connexion...</div>

<div id="mic" onclick="toggleMic()">
  <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
</div>

<div id="transcript">
  <div class="user" id="userText"></div>
  <div class="agent" id="agentText"></div>
</div>

<div id="log"></div>

<script>
const WS_URL = 'ws://localhost:8766/voice'; // Change port to match your app
let ws = null;
let recognition = null;
let listening = false;
let callId = '';

// Full-duplex audio: play chunks as they arrive (don't wait for all)
let audioCtx = null;
let audioQueue = [];      // Queue of ArrayBuffers to play
let isPlaying = false;
let isSpeaking = false;

function log(msg) {
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setMicState(state) { document.getElementById('mic').className = state; }

function connect() {
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    log('Connected');
    setStatus('Connecte. Cliquez sur le micro pour parler.');
  };

  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      // Audio chunk arrived — queue it for immediate playback
      audioQueue.push(e.data);
      if (!isPlaying) playNext();
      return;
    }

    const data = JSON.parse(e.data);

    if (data.type === 'connected') {
      callId = data.call_id;
    }

    if (data.type === 'speak_start') {
      audioQueue = [];
      isSpeaking = true;
      setMicState('speaking');
      setStatus('Agent parle...');
      if (data.text) document.getElementById('agentText').textContent = data.text;
    }

    if (data.type === 'speak_end') {
      isSpeaking = false;
      if (data.interrupted) {
        log('Barge-in: agent interrompu');
        audioQueue = [];  // Drop remaining audio
        stopAudio();
      }
      if (!isPlaying) {
        setMicState('');
        setStatus('Cliquez sur le micro pour parler.');
      }
    }

    if (data.type === 'speak') {
      document.getElementById('agentText').textContent = data.text;
      browserSpeak(data.text);
    }
  };

  ws.onclose = () => { setStatus('Deconnecte.'); setMicState(''); };
  ws.onerror = () => { setStatus('Erreur connexion.'); };
}

async function playNext() {
  if (audioQueue.length === 0) {
    isPlaying = false;
    if (!isSpeaking) {
      setMicState('');
      setStatus('Cliquez sur le micro pour parler.');
    }
    return;
  }

  isPlaying = true;
  const buf = audioQueue.shift();

  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const audioBuffer = await audioCtx.decodeAudioData(buf.slice(0));  // slice to detach
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioCtx.destination);
    source.onended = () => playNext();
    source.start();
  } catch (err) {
    // If individual chunk can't be decoded, skip it
    log('Audio skip: ' + err.message.substring(0, 50));
    playNext();
  }
}

function stopAudio() {
  audioQueue = [];
  isPlaying = false;
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
  }
}

function bargeIn() {
  // Send interrupt to server
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'interrupt' }));
  }
  stopAudio();
  setMicState('');
}

function browserSpeak(text) {
  const synth = window.speechSynthesis;
  synth.cancel();
  setMicState('speaking');
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'fr-FR';
  const voices = synth.getVoices();
  const fr = voices.find(v => v.lang.startsWith('fr'));
  if (fr) utt.voice = fr;
  utt.onend = () => { setMicState(''); setStatus('Cliquez sur le micro pour parler.'); };
  synth.speak(utt);
}

function toggleMic() { listening ? stopListening() : startListening(); }

function startListening() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    setStatus('Speech Recognition non supporte (Chrome/Edge)');
    return;
  }

  // Barge-in: if agent is speaking, interrupt it
  if (isSpeaking || isPlaying) {
    bargeIn();
  }

  window.speechSynthesis.cancel();

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    listening = true;
    setMicState('listening');
    setStatus('Parlez...');
    document.getElementById('userText').textContent = '';
    document.getElementById('agentText').textContent = '';
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('userText').textContent = final || interim;
    if (final) {
      log('You: ' + final);
      setStatus('Reflexion...');
      setMicState('');
      ws.send(JSON.stringify({ type: 'transcript', text: final }));
    }
  };

  recognition.onerror = () => { listening = false; setMicState(''); };
  recognition.onend = () => { listening = false; };
  recognition.start();
}

function stopListening() {
  if (recognition) recognition.stop();
  listening = false;
  setMicState('');
}

speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
connect();
</script>
</body>
</html>
