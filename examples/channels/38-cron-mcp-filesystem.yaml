app:
  app_id: channels-38-cron-mcp
  name: Cron + MCP Filesystem
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'Tu es un agent de monitoring. Quand tu recois une alerte cron,

    utilise les outils MCP filesystem pour lire le contenu du dossier

    et faire un rapport concis.

    '
tools:
  modules:
    mcp:
      config:
        servers:
          filesystem:
            command: npx
            args:
            - -y
            - '@modelcontextprotocol/server-filesystem'
            - /tmp/digitorn-mcp-test
            sandbox:
              permissions:
              - '*'
    channels:
      config:
        default_agent: main
        max_turns: 10
        timeout: 60
        providers:
          check:
            adapter: cron
            config:
              schedule: '* * * * *'
              message: Periodic directory check
            activation:
              message: 'Time for your periodic check.

                Use the MCP filesystem tools to list and read files in /tmp/digitorn-mcp-test/.

                Summarize what you find in 2-3 sentences.

                '
              reply: none
