app:
  app_id: channels-05-webhook
  name: Webhook Inbound
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You process incoming webhook events. Describe each event and suggest an appropriate
    action.
tools:
  modules:
    channels:
      config:
        providers:
          events:
            adapter: webhook
            config:
              inbound_path: /hook/events
            activation:
              message: 'Webhook received: {{event.payload.action}} - {{event.payload.item}}'
