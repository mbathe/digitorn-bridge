app:
  app_id: channels-21-cron-fs
  name: Cron + Filesystem
runtime:
  mode: background
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: 'You are a directory monitor. Use filesystem.ls to list the directory

    and report how many files are present.

    '
tools:
  modules:
    filesystem:
      constraints:
        paths:
        - /tmp/channels-test/monitored
    channels:
      config:
        providers:
          scan:
            adapter: cron
            config:
              schedule: '* * * * *'
            activation:
              message: List all files in /tmp/channels-test/monitored/ and report
                the count.
