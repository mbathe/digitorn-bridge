app:
  app_id: channels-17-workbench
  name: Expose Data Workbench
runtime:
  mode: background
  workbench: true
agents:
- id: main
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      base_url: https://api.deepseek.com/v1
      api_key: '{{env.DEEPSEEK_API_KEY}}'
  role: You are a financial analyst. Read the event data and provide insights.
tools:
  modules:
    channels:
      config:
        providers:
          reports:
            adapter: webhook
            config:
              inbound_path: /hook/reports
            activation:
              expose_data: true
              message: New financial report received. Analyze the data from the workbench.
