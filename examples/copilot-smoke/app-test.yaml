app:
  app_id: copilot-smoke-test
  name: Copilot Smoke Test (deepseek probe)
  version: 0.1.0
  description: Same workspace wiring as copilot-smoke but with a deepseek brain
    so we can drive it from `digitorn dev chat` and verify the agent calls WsWrite.

runtime:
  mode: conversation
  workdir_mode: auto
  tool_injection: direct
  max_turns: 6
  timeout: 120

agents:
- id: main
  role: assistant
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: sk-6f07faba787a450cb3234dc78fc7cf21
    temperature: 0
    max_tokens: 2048
  system_prompt: |
    You are a file-writing test harness. When the user asks you to create
    a file, call WsWrite immediately with the requested path and content.
    Do not explain. Do not call any other tool. After the tool returns
    success, reply with the single word: done.

tools:
  modules:
    workspace:
      config:
        render_mode: code
        entry_file: README.md
        title: Copilot Smoke (probe)
        sync_to_disk: true
        lint: false
        instructions: |
          You have a virtual workspace. To create a file use WsWrite. To
          read/edit/delete use WsRead/WsEdit/WsDelete. The names Write,
          filesystem.write, create_file etc. are NOT available.
    preview: {}
  capabilities:
    default_policy: block
    max_risk_level: medium
    grant:
    - module: workspace
      actions:
      - write
      - read
      - edit
      - glob
      - grep
      - delete

ui:
  workspace:
    render_mode: code
    entry_file: README.md
    title: Copilot Smoke (probe)
