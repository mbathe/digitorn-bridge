[package]
id          = "copilot-smoke"
name        = "Copilot Smoke Test"
version     = "0.1.0"
description = "Minimal chat app to verify GitHub Copilot integration via api.githubcopilot.com."
author      = "Digitorn"
license     = "MIT"
category    = "general"

[package.source]
type      = "official"
verified  = true
publisher = "digitorn"

[package.compatibility]
digitorn_min = ">=1.0.0"

[package.requirements]
modules            = []
recommended_models = ["gpt-4o", "claude-3.5-sonnet"]
external_tools     = []

[package.credentials]
required = ["github_copilot"]
optional = []

[package.permissions]
risk_level         = "low"
network_access     = true
filesystem_access  = []
filesystem_scopes  = []
requires_approval  = []

[package.hub]
tags = ["copilot", "smoke-test", "llm"]

[package.release]
released_at    = "2026-05-02"
release_notes  = "First version."
breaking       = false
