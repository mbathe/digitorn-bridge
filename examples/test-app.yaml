app:
  app_id: test-app
  name: Test App
  version: '1.0'
  description: Minimal app for production testing
runtime:
  mode: conversation
  max_turns: 10
  timeout: 60
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    max_tokens: 4096
  system_prompt: 'You are a test assistant. Keep responses very short (1-2 sentences
    max).

    Use tools when explicitly asked. Always respond in plain text.

    '
  capabilities:
    grant:
    - module: filesystem
      actions:
      - read
      - write
      - edit
      - glob
      - grep
    - module: shell
      actions:
      - bash
    - module: memory
      actions:
      - set_goal
      - remember
      - recall
      - add_todo
      - update_todo
tools:
  modules:
    filesystem: {}
    shell: {}
    memory:
      config:
        working_memory: true
        todo_list: true
ui:
  greeting: Test app ready.
