app:
  app_id: memory-agent
  name: "Memory Agent"
  description: "Assistant avec mémoire persistante — knowledge graph pour stocker et retrouver des informations."

modules:
  mcp:
    config:
      servers:
        - memory

agents:
  - id: assistant
    role: assistant
    brain:
      provider: openrouter
      model: qwen/qwen3-235b-a22b
      backend: openai_compat
      max_tokens: 4096
      config:
        api_key: "{{secret.OPENROUTER_API_KEY}}"
        base_url: "https://openrouter.ai/api/v1"
      context:
        max_tokens: 90000
        output_reserved: 2000
        strategy: summarize
        keep_recent: 20
        auto_compact: true
    system_prompt: |
      Tu es un assistant avec une mémoire persistante (knowledge graph).
      Tu peux créer des entités, des relations, et retrouver des informations.
      Utilise ta mémoire pour te souvenir de ce qu'on te dit.
      Réponds en français. Sois concis.

execution:
  mode: conversation
  max_turns: 20
  timeout: 120.0
