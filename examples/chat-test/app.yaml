app:
  app_id: chat-test
  name: Chat Test
  version: "1.0"

runtime:
  mode: conversation
  workdir_mode: auto
  max_turns: 5
  timeout: 60

agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    backend: anthropic
    config:
      api_key: claude-code
    temperature: 0
    max_tokens: 1024
  system_prompt: "You are a terse echo bot. Reply concisely."

tools:
  modules: {}
  capabilities:
    default_policy: auto

ui:
  greeting: "useChat E2E test bed."
