[package]
id = "document-assistant"
name = "Document Assistant (Telegram)"
version = "1.0.0"
description = "Telegram bot that answers questions about your documents using RAG."
author = "Digitorn Builder"
license = "MIT"
homepage = ""
repository = ""
keywords = ["telegram", "rag", "documents", "assistant", "chatbot"]

[package.metadata]
category = "assistant"
icon = "{{asset.icon}}"
color = "#4A90E2"
tags = ["background", "channels", "telegram", "rag", "documents", "multi-user"]

[[permissions]]
module = "memory"
actions = ["remember", "set_goal", "task_create", "task_update"]

[[permissions]]
module = "rag"
actions = ["query", "list_knowledge_bases", "knowledge_base_stats", "multi_query"]

[[permissions]]
module = "filesystem"
actions = ["read", "write", "edit", "glob", "grep"]
config = { root_path = "./user-documents" }

[[permissions]]
module = "channels"
actions = ["send_message", "provider_history", "reply"]

[secrets]
TELEGRAM_BOT_TOKEN = { description = "Telegram Bot API token", required = true }
ANTHROPIC_API_KEY = { description = "Anthropic API key for Claude", required = true }

[env]
# Optional environment variables
RAG_EMBEDDING_MODEL = { description = "Embedding model for RAG", default = "text-embedding-3-small" }
RAG_CHUNK_SIZE = { description = "Chunk size for document processing", default = "1000" }

[build]
min_digitorn_version = "1.3.0"
python_version = ">=3.10"

[dependencies]
# No external dependencies - uses built-in modules