agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
    vision: true
    image_detail: high
  system_prompt: Say VISION_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: vision_config
  vision: true
  detail: high
app:
  app_id: btest-vis-True-high
  name: BTest vis-True-high
  version: '1.0'
