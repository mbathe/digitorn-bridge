agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
    context:
      max_tokens: 16000
      auto_compact: false
  system_prompt: Say TEST_OK
execution:
  mode: conversation
  max_turns: 5
  timeout: 25
capabilities:
  default_policy: auto
_test:
  type: context
  max_tokens: 16000
  auto_compact: false
app:
  app_id: btest-ctx-16000-noac
  name: BTest ctx-16000-noac
  version: '1.0'
