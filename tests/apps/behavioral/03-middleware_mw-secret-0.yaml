app:
  middleware:
  - mask_secrets:
      patterns:
      - password
      - api_key
  app_id: btest-mw-secret-0
  name: BTest mw-secret-0
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Repeat the user message exactly as you received it.
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: secret_mask
  test_message: my password=SuperSecret123
  expect_not_in_response: SuperSecret123
