agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'Say exactly: SHELL_HOOK_OK'
execution:
  mode: conversation
  max_turns: 3
  timeout: 25
hooks:
- id: shell-1
  'on': turn_start
  condition:
    type: always
  action:
    type: shell
    params:
      command: echo HOOK_SHELL_FIRED
      inject_result: true
capabilities:
  default_policy: auto
_test:
  type: hook_shell
  expect: shell hook fires without crash
app:
  app_id: btest-hook-shell-1
  name: BTest hook-shell-1
  version: '1.0'
