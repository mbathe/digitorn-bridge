agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
    vision: false
    image_detail: low
  system_prompt: Say VISION_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: vision_config
  vision: false
  detail: low
app:
  app_id: btest-vis-False-low
  name: BTest vis-False-low
  version: '1.0'
