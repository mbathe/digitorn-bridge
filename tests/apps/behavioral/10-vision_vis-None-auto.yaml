agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
    image_detail: auto
  system_prompt: Say VISION_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: vision_config
  vision: null
  detail: auto
app:
  app_id: btest-vis-None-auto
  name: BTest vis-None-auto
  version: '1.0'
