modules:
  filesystem: {}
  memory: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Read README.md and remember it
execution:
  mode: conversation
  max_turns: 5
  timeout: 25
capabilities:
  default_policy: auto
  grant: []
_test:
  type: module_combo
  modules:
  - filesystem
  - memory
  policy: auto
app:
  app_id: btest-mod-5-au
  name: BTest mod-5-au
  version: '1.0'
