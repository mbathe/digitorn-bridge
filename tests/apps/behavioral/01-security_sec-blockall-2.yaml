agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'Say exactly: NO_TOOLS_AVAILABLE. Do not try to use any tools.'
execution:
  mode: conversation
  max_turns: 3
  timeout: 15
capabilities:
  default_policy: block
_test:
  type: no_tools
  expect: agent responds with text only, no tool calls
app:
  app_id: btest-sec-blockall-2
  name: BTest sec-blockall-2
  version: '1.0'
