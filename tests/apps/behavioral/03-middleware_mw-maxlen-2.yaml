app:
  middleware:
  - response_filter:
      max_length: 500
  app_id: btest-mw-maxlen-2
  name: BTest mw-maxlen-2
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Write a very long response with at least 1000 characters about the
    history of computing.
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: response_maxlen
  max_length: 500
