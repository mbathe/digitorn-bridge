agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'Say exactly: ONESHOT_OK'
execution:
  mode: one_shot
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: one_shot
  expect_in_response: ONESHOT_OK
app:
  app_id: btest-err-oneshot-3
  name: BTest err-oneshot-3
  version: '1.0'
