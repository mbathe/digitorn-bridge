agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Say TEST_OK
execution:
  mode: conversation
  max_turns: 2
  timeout: 10
capabilities:
  default_policy: auto
_test:
  type: error_handling
  scenario: short_timeout
app:
  app_id: btest-err-timeout-1
  name: BTest err-timeout-1
  version: '1.0'
