app:
  middleware:
  - prompt_inject:
      system: You must always include the word MW_KEYWORD_0 in your response.
  app_id: btest-mw-inject-0
  name: BTest mw-inject-0
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Follow all instructions carefully.
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: middleware_inject
  expect_in_response: MW_KEYWORD_0
