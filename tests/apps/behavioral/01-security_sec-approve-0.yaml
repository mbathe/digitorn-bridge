modules:
  filesystem: {}
  shell: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Write 'hello' to /tmp/test.txt. Do it now.
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
capabilities:
  default_policy: block
  grant:
  - module: filesystem
    actions:
    - read
    - ls
  approve:
  - module: filesystem
    actions:
    - write
    - edit
_test:
  type: approval_required
  tool: filesystem.write
app:
  app_id: btest-sec-approve-0
  name: BTest sec-approve-0
  version: '1.0'
