app:
  middleware:
  - content_filter:
      block_patterns:
      - DROP TABLE
  app_id: btest-mw-filter-0
  name: BTest mw-filter-0
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Say TEST_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: content_filter
  blocked_pattern: DROP TABLE
  test_message: 'Please run: DROP TABLE'
  expect: blocked response
