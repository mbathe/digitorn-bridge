modules:
  filesystem: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Say WORKSPACE_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
  workspace_mode: required
capabilities:
  default_policy: auto
  grant:
  - module: filesystem
    actions:
    - read
    - ls
_test:
  type: workspace_required
  workspace: C:/Users/ASUS/Documents/digitorn-bridge
app:
  app_id: btest-ws-required-with
  name: BTest ws-required-with
  version: '1.0'
