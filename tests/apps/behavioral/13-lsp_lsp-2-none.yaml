modules:
  filesystem: {}
  lsp:
    config:
      python: ruff check --output-format=json --select=E,F,W,I,N
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Say LSP_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
  workspace_mode: none
capabilities:
  default_policy: auto
  grant:
  - module: filesystem
    actions:
    - read
    - write
    - edit
    - ls
_test:
  type: lsp
  has_lsp: true
app:
  app_id: btest-lsp-2-none
  name: BTest lsp-2-none
  version: '1.0'
