app:
  middleware:
  - prompt_inject:
      system: Always say COMBO_OK_1
  - content_filter:
      block_patterns:
      - BLOCK_ME
  - response_filter:
      max_length: 500
  app_id: btest-mw-combo-1
  name: BTest mw-combo-1
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Follow instructions.
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
capabilities:
  default_policy: auto
_test:
  type: middleware_combo
  expect_in_response: COMBO_OK_1
