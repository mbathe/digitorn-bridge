agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'Say exactly: TURN_OK'
execution:
  mode: conversation
  max_turns: 5
  timeout: 25
hooks:
- id: turn-check
  'on': turn_end
  condition:
    type: turn_count
    params:
      threshold: 1
  action:
    type: log
    params:
      message: Turn threshold reached
capabilities:
  default_policy: auto
_test:
  type: hook_fires
  expect: hook fires on turn >= 1
app:
  app_id: btest-hook-turncount-2
  name: BTest hook-turncount-2
  version: '1.0'
