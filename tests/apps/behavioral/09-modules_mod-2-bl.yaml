modules:
  memory: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Set goal to MODULE_GOAL
execution:
  mode: conversation
  max_turns: 5
  timeout: 25
capabilities:
  default_policy: block
  grant:
  - module: memory
    actions:
    - set_goal
    - remember
_test:
  type: module_combo
  modules:
  - memory
  policy: block
app:
  app_id: btest-mod-2-bl
  name: BTest mod-2-bl
  version: '1.0'
