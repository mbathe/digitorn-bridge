modules:
  filesystem: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: List files in current dir
execution:
  mode: conversation
  max_turns: 5
  timeout: 25
capabilities:
  default_policy: block
  grant:
  - module: filesystem
    actions:
    - read
    - ls
_test:
  type: module_combo
  modules:
  - filesystem
  policy: block
app:
  app_id: btest-mod-0-bl
  name: BTest mod-0-bl
  version: '1.0'
