modules:
  filesystem: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: List the files in the workspace root directory.
execution:
  mode: conversation
  max_turns: 5
  timeout: 25
  workspace_mode: fixed
  workspace: C:/Users/ASUS/Documents/digitorn-bridge
capabilities:
  default_policy: auto
  grant:
  - module: filesystem
    actions:
    - read
    - ls
_test:
  type: workspace_fixed
  expect: agent sees files from the fixed workspace
app:
  app_id: btest-ws-fixed
  name: BTest ws-fixed
  version: '1.0'
