agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: Say NOTIFY_OK
execution:
  mode: conversation
  max_turns: 3
  timeout: 20
hooks:
- id: notify-test
  'on': turn_start
  condition:
    type: always
  action:
    type: notify
    params:
      title: Test
      message: Hook notification
      level: info
capabilities:
  default_policy: auto
_test:
  type: hook_notify
app:
  app_id: btest-hook-notify-1
  name: BTest hook-notify-1
  version: '1.0'
