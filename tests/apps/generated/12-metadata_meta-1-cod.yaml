app:
  app_id: test-meta-1-cod
  name: Meta meta-1-cod
  version: '1.0'
  category: coding
  icon: code
  color: '#FF0000'
  quick_prompts:
  - label: Test
    icon: T
    message: Test prompt
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
capabilities:
  default_policy: auto
