app:
  app_id: test-ws-3-0
  name: Workspace ws-3-0
  version: '1.0'
modules: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
  workspace_mode: fixed
  workspace: C:/Users/ASUS/Documents/digitorn-bridge
capabilities:
  default_policy: auto
