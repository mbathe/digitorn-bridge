app:
  app_id: test-mw-0-conv
  name: Middleware mw-0-conv
  version: '1.0'
  middleware:
  - prompt_inject:
      system: Always say MIDDLEWARE_OK at the start.
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
capabilities:
  default_policy: auto
