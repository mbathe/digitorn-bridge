app:
  app_id: test-ws-0-2
  name: Workspace ws-0-2
  version: '1.0'
modules:
  filesystem: {}
  shell: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
  workspace_mode: none
capabilities:
  default_policy: auto
