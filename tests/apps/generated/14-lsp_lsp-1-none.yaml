app:
  app_id: test-lsp-1-none
  name: LSP lsp-1-none
  version: '1.0'
modules:
  filesystem: {}
  lsp:
    config:
      python: ruff check --output-format=json
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
  workspace_mode: none
capabilities:
  default_policy: auto
  grant:
  - module: filesystem
    actions:
    - read
    - write
    - edit
    - ls
