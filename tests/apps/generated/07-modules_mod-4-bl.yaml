app:
  app_id: test-mod-4-bl
  name: Modules mod-4-bl
  version: '1.0'
modules:
  web: {}
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
capabilities:
  default_policy: block
  grant:
  - module: web
    actions:
    - search
    - fetch
