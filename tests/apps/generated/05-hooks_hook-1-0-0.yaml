app:
  app_id: test-hook-1-0-0
  name: Hook hook-1-0-0
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
hooks:
- id: test-hook
  'on': turn_end
  condition:
    type: always
  action:
    type: inject_message
    params:
      content: HOOK_FIRED
      role: system
capabilities:
  default_policy: auto
