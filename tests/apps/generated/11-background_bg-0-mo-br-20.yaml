app:
  app_id: test-bg-0-mo-br-20
  name: Background bg-0-mo-br-20
  version: '1.0'
agents:
- id: main
  role: worker
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: You are a background worker. Say BG_OK.
execution:
  mode: background
  max_turns: 5
  timeout: 30
  session_mode: mono
  max_concurrent_activations: 20
  triggers:
  - id: test-cron
    type: cron
    schedule: 0 0 31 2 *
    message: Test cron
capabilities:
  default_policy: auto
