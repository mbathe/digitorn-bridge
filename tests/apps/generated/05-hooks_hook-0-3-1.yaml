app:
  app_id: test-hook-0-3-1
  name: Hook hook-0-3-1
  version: '1.0'
agents:
- id: main
  role: assistant
  brain:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    config:
      api_key: claude-code
    temperature: 0.0
    max_tokens: 256
  system_prompt: 'You are a test agent. Always respond with exactly: TEST_OK followed
    by the app_id.'
execution:
  mode: conversation
  max_turns: 5
  timeout: 30
hooks:
- id: test-hook
  'on': turn_start
  condition:
    type: tool_calls
    params:
      threshold: 1
  action:
    type: log
    params:
      message: Hook test fired turn={turn}
capabilities:
  default_policy: auto
