app:
  app_id: ft-36-error-invalid-params
  name: "Error: Invalid Setup Params"

modules:
  database:
    setup:
      - action: connect
        params:
          driver: sqlite

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"

execution:
  mode: one_shot
