app:
  app_id: ft-run-11-discovery
  name: "Discovery Mode Test"
modules:
  filesystem: {}
  database:
    setup:
      - action: connect
        params:
          connection_id: test
          driver: sqlite
          database: ":memory:"
  shell:
    constraints:
      allowed_actions: [run, which]
  http:
    constraints:
      allowed_actions: [get, head]
agents:
  - id: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      context:
        max_tokens: 16000
    system_prompt: |
      Use search_tools to find tools related to "reading files".
      Then use get_tool on the first result to see its schema.
      Finally use execute_tool to read the file "pyproject.toml" (first 10 lines).
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
capabilities:
  default_policy: auto
