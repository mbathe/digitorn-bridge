app:
  app_id: ft-50-hidden-actions
  name: "Hidden Actions Test"

modules:
  filesystem: {}

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: |
      Search for all filesystem tools.
      You should see read, ls, find, grep but NOT rm, write, edit.

execution:
  mode: one_shot
  workspace: "{{env.PWD}}"

capabilities:
  default_policy: auto
  grant:
    - module: filesystem
      actions: [read, glob, grep]
  hidden_actions:
    - module: filesystem
      actions: [write, edit]
