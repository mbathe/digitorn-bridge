app:
  app_id: ft-63-generation-params
  name: "Generation Params Test"

agents:
  - id: creative
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
      temperature: 1.5
      max_tokens: 100
      top_p: 0.9
    system_prompt: "Write a creative one-sentence story about a cat."

  - id: precise
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
      temperature: 0.0
      max_tokens: 50
    system_prompt: "Reply with exactly: 42"

execution:
  mode: one_shot
  entry_agent: creative
