app:
  app_id: biz-38-cashflow
  name: "Cash Flow Forecast"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: cashflow, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Cash flow forecasting. Create tables for receivables, payables, recurring_revenue, one_time_items, forecast. Compute: 13-week cash forecast, DSO, DPO, working capital needs.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
