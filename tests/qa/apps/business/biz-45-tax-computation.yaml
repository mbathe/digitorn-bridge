app:
  app_id: biz-45-tax
  name: "Tax Computation"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: tax, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Corporate tax computation engine. Create tables for income, deductions, credits, rates, calculations. Compute: taxable income, effective rate, deferred tax, R&D credits.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
