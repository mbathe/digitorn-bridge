app:
  app_id: biz-49-consol
  name: "Multi-Entity Consolidation"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: consol, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Multi-entity financial consolidation. Create tables for entities, trial_balances, eliminations, consolidated. Process: intercompany eliminations, currency translation, minority interest.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
