app:
  app_id: biz-47-loan
  name: "Loan Underwriting"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: loan, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Loan underwriting pipeline. Create tables for applications, credit_data, collateral, decisions. Rules: DTI ratio, LTV, employment verification, risk-based pricing.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
