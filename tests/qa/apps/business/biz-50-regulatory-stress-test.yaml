app:
  app_id: biz-50-stress
  name: "Regulatory Stress Test"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: stress, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Regulatory stress test (simplified). Create tables for portfolio, scenarios, stressed_values, capital_impact. Model: 3 scenarios (base, adverse, severe), compute capital adequacy under each.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
