app:
  app_id: biz-32-revenue_rec
  name: "Revenue Recognition"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: revenue_rec, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Revenue recognition analysis with ASC 606 multi-element arrangements. Create tables for contracts, performance_obligations, transaction_prices. Allocate standalone selling prices, compute recognized vs deferred revenue by quarter.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
