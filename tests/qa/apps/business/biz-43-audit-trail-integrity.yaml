app:
  app_id: biz-43-audit_trail
  name: "Audit Trail Integrity"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: audit_trail, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Audit trail integrity checker. Create tables for audit_events, expected_sequences, integrity_checks. Detect: gaps in sequence numbers, timestamp anomalies, unauthorized access patterns.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
