app:
  app_id: biz-36-procurement
  name: "Procurement Optimizer"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: procurement, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Procurement spend analytics. Create tables for purchase_orders, suppliers, contracts, savings_opportunities. Identify: maverick spend, duplicate purchases, volume discounts, contract compliance.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
