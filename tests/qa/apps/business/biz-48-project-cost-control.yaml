app:
  app_id: biz-48-cost_ctrl
  name: "Project Cost Control"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: cost_ctrl, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Project cost control. Create tables for work_packages, budget_lines, actuals, earned_value. Compute: CPI, SPI, EAC, ETC, variance at completion.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
