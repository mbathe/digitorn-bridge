app:
  app_id: biz-33-aml
  name: "Anti-Money Laundering"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: aml, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      AML transaction monitoring. Create tables for accounts, transactions, watchlists, alerts. Run screening rules: structuring detection, rapid movement, high-risk countries, PEP matches. Report suspicious activity.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
