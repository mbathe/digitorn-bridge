app:
  app_id: biz-39-risk_reg
  name: "Risk Register"
modules:
  database:
    setup:
      - action: connect
        params: { connection_id: risk_reg, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep, write]
agents:
  - id: agent
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Enterprise risk register. Create tables for risks, controls, assessments, action_plans. Compute: inherent risk, residual risk, control effectiveness, risk heat map data.
      Return a detailed JSON report with all computed metrics.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 20
  timeout: 150
  output:
    type: json
capabilities:
  default_policy: auto
