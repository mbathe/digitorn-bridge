app:
  app_id: ft-25-direct-mode
  name: "Direct Tool Injection Test"

modules:
  hello: {}

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: |
      Use say_hello to greet "Paul".
      You should see the tool directly in your tool list, not via search_tools.

execution:
  mode: one_shot

capabilities:
  default_policy: auto
