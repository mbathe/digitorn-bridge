app:
  app_id: ft-run-15-direct-in-disc
  name: "Direct Modules in Discovery Mode"
modules:
  filesystem: {}
  database:
    setup:
      - action: connect
        params:
          connection_id: test
          driver: sqlite
          database: ":memory:"
  shell:
    constraints:
      allowed_actions: [run, which]
  http:
    constraints:
      allowed_actions: [get, head]
agents:
  - id: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      context:
        max_tokens: 16000
    system_prompt: |
      Read the file "pyproject.toml" using filesystem.read (it should be available directly).
      Just show the first 5 lines.
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  direct_modules: [filesystem]
capabilities:
  default_policy: auto
