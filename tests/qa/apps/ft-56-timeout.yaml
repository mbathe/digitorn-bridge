app:
  app_id: ft-56-timeout
  name: "Timeout Test"

modules:
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep]

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: |
      Read every Python file in the project. This should take a while.

execution:
  mode: one_shot
  max_turns: 100
  timeout: 10
  workspace: "{{env.PWD}}"

capabilities:
  default_policy: auto
