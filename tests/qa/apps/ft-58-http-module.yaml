app:
  app_id: ft-58-http-module
  name: "HTTP Module Test"

modules:
  http:
    constraints:
      allowed_actions: [get, head, json_api]

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: |
      Use http.get to fetch https://httpbin.org/get
      Report the response status and headers.

execution:
  mode: one_shot

capabilities:
  default_policy: auto
