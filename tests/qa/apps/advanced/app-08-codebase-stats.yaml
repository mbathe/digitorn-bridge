app:
  app_id: adv-08-stats
  name: "Codebase Statistics Dashboard"
modules:
  shell:
    constraints:
      allowed_actions: [run]
  filesystem:
    constraints:
      allowed_actions: [glob, grep]
  database:
    setup:
      - action: connect
        params:
          connection_id: stats
          driver: sqlite
          database: ":memory:"
    constraints:
      allowed_actions: [execute_query, fetch_results]
agents:
  - id: stats
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Build a complete codebase statistics dashboard:
      1. Create tables: 'file_types' (ext TEXT, count INT, total_lines INT), 'modules' (name TEXT, files INT, lines INT)
      2. Use run_parallel for these 6 shell commands:
         a) find . -name "*.py" -not -path "./.venv/*" | wc -l
         b) find . -name "*.yaml" -not -path "./.venv/*" | wc -l
         c) find . -name "*.md" -not -path "./.venv/*" | wc -l
         d) find packages/digitorn -name "*.py" -exec wc -l {} + | tail -1
         e) find tests -name "*.py" -exec wc -l {} + | tail -1
         f) find docs -name "*.md" -exec wc -l {} + | tail -1
      3. Insert all stats into database
      4. Compute: total files, total lines, test-to-source ratio, avg file size
      5. Return JSON dashboard
execution:
  mode: one_shot
  workspace: "{{env.PWD}}"
  max_turns: 12
  timeout: 90
  output:
    type: json
capabilities:
  default_policy: auto
