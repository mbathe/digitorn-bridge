app:
  app_id: adv-40-remember
  name: "Conversation Memory Persistence"
modules:
  filesystem:
    constraints:
      allowed_actions: [read, glob]
  database:
    setup:
      - action: connect
        params: { connection_id: mem, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results]
agents:
  - id: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      context:
        max_tokens: 5000
        strategy: summarize
        keep_recent: 2
        compression_trigger: 0.4
        summary_max_tokens: 200
        auto_compact: true
    system_prompt: |
      You must remember facts across the conversation even after context compaction.
      Store important facts in the database as a backup: table 'facts' (id INTEGER PRIMARY KEY, fact TEXT).
execution:
  mode: conversation
  greeting: "Memory test. Tell me facts, I'll store them, then test recall after compaction."
  workspace: "{{env.PWD}}"
  max_turns: 8
  timeout: 30
capabilities:
  default_policy: auto
