app:
  app_id: adv-26-conv-stress
  name: "Conversation Stress Test"
modules:
  filesystem:
    constraints:
      allowed_actions: [read, glob, grep]
  database:
    setup:
      - action: connect
        params: { connection_id: stress, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results, list_tables]
  shell:
    constraints:
      allowed_actions: [run]
agents:
  - id: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      context:
        max_tokens: 8000
        strategy: summarize
        keep_recent: 3
        compression_trigger: 0.5
        summary_max_tokens: 300
        auto_compact: true
    system_prompt: "You are concise. Remember all facts across the conversation."
execution:
  mode: conversation
  greeting: "Stress test - 8K context, heavy tool usage."
  workspace: "{{env.PWD}}"
  max_turns: 10
  timeout: 30
capabilities:
  default_policy: auto
