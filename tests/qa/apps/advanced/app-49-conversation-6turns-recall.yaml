app:
  app_id: adv-49-recall
  name: "6-Turn Recall Test"
modules:
  filesystem:
    constraints:
      allowed_actions: [read, glob]
  database:
    setup:
      - action: connect
        params: { connection_id: recall, driver: sqlite, database: ":memory:" }
    constraints:
      allowed_actions: [execute_query, fetch_results]
agents:
  - id: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      context:
        max_tokens: 5000
        strategy: summarize
        keep_recent: 2
        compression_trigger: 0.35
        summary_max_tokens: 200
        auto_compact: true
    system_prompt: "Remember all facts. Store critical facts in database table 'memory' (key TEXT, value TEXT)."
execution:
  mode: conversation
  greeting: "Recall test. I'll read files, store facts, and test recall after compaction."
  workspace: "{{env.PWD}}"
  max_turns: 8
  timeout: 30
capabilities:
  default_policy: auto
