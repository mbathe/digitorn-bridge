app:
  app_id: ft-26-discovery-mode
  name: "Discovery Mode Test"

modules:
  filesystem: {}
  database:
    setup:
      - action: connect
        params:
          connection_id: test
          driver: sqlite
          database: ":memory:"
  shell:
    constraints:
      allowed_actions: [run, which, env]
  http:
    constraints:
      allowed_actions: [get, head]

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
      context:
        max_tokens: 16000
    system_prompt: |
      Use search_tools to find tools related to "reading files".
      Then use get_tool to see the full schema of the first result.
      Finally use execute_tool to read README.md.

execution:
  mode: one_shot
  workspace: "{{env.PWD}}"

capabilities:
  default_policy: auto
