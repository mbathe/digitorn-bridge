app:
  app_id: ft-05-hello-module
  name: "Hello Module Test"

modules:
  hello: {}

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: "Use say_hello to greet the user by name."

execution:
  mode: one_shot

capabilities:
  default_policy: auto
