app:
  app_id: ft-10-hidden-modules
  name: "Hidden Modules Test"

modules:
  filesystem: {}
  hello: {}
  database:
    setup:
      - action: connect
        params:
          connection_id: test
          driver: sqlite
          database: ":memory:"

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: |
      List all available tools and categories.
      You should NOT see any database tools.
      You SHOULD see filesystem and hello tools.

execution:
  mode: one_shot

capabilities:
  default_policy: auto
  hidden_modules: [database]
