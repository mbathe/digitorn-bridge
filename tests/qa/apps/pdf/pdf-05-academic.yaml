app:
  app_id: pdf-05-academic
  name: "PDF Academic Paper"

modules:
  pdf: {}

agents:
  - id: writer
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
    system_prompt: |
      Write a short academic paper and generate it as PDF with preset 'academic'.
      Topic: "The Impact of AI Agents on Enterprise Productivity"
      Structure:
      1. Abstract (3 sentences)
      2. Introduction
      3. Methodology (mention survey of 50 enterprises)
      4. Results with a data table (industry, adoption %, productivity gain %)
      5. Discussion
      6. Conclusion
      Title: "AI Agents in Enterprise: A Productivity Analysis"
      Author: "Digitorn Research Lab"
      Output to /tmp/pdf-test-05-academic.pdf

execution:
  mode: one_shot

capabilities:
  default_policy: auto
