app:
  app_id: ft-61-git-module
  name: "Git Module Test"

modules:
  git:
    constraints:
      allowed_actions: [status, diff, log, blame, branch_list]

agents:
  - id: a
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      backend: anthropic
      config:
        api_key: "{{env.ANTHROPIC_API_KEY}}"
    system_prompt: |
      1. Show git status
      2. Show the last 5 commits
      3. List all branches
      Summarize the project's git state.

execution:
  mode: one_shot
  workspace: "{{env.PWD}}"

capabilities:
  default_policy: auto
