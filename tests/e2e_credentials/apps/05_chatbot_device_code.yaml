app:
  app_id: e2e-cred-05-device
  name: "E2E #05 - device_code chatbot"
  description: "DeepSeek brain bound via a device_code-typed credential."
  category: "test"

modules:
  memory:
    config:
      working_memory: true
  context_builder: {}

agents:
  - id: main
    role: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      credential:
        ref: e2e_device_token
        scope: per_user
        provider: deepseek
      config:
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.2
      max_tokens: 256
    system_prompt: |
      You are a testing assistant. Reply concisely.

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct
  direct_modules: [memory]
  greeting: "Device-code test bot ready."
  max_turns: 10

capabilities:
  default_policy: auto
  grant:
    - module: memory
      actions: [set_goal, remember]
