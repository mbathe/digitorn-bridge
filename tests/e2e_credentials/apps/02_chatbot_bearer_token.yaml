app:
  app_id: e2e-cred-02-bearer
  name: "E2E #02 - Bearer token chatbot"
  description: "Same DeepSeek brain but bound via a bearer_token-typed credential."
  category: "test"

modules:
  memory:
    config:
      working_memory: true
  context_builder: {}

agents:
  - id: main
    role: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      credential:
        ref: e2e_deepseek_bearer
        scope: per_user
        provider: deepseek
      config:
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.2
      max_tokens: 256
    system_prompt: |
      You are a precise testing assistant. Reply VERY shortly (1 sentence max).
      When asked for a memorised fact from earlier turns, recall it accurately.

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct
  direct_modules: [memory]
  greeting: "Hi - bearer auth test bot ready."
  max_turns: 10

capabilities:
  default_policy: auto
  grant:
    - module: memory
      actions: [set_goal, remember]
