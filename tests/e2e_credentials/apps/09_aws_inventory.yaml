app:
  app_id: e2e-cred-09-aws
  name: "E2E #09 - AWS Inventory"
  description: "Real agent listing S3 buckets via mock AWS endpoint with vault aws_access_key."
  category: "test"

modules:
  memory:
    config:
      working_memory: true
  context_builder: {}
  http:
    config: {}
    constraints:
      allowed_hosts:
        - "127.0.0.1"
    credential:
      ref: e2e_aws_test
      scope: per_user

agents:
  - id: main
    role: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      credential:
        ref: e2e_deepseek_test
        scope: per_user
        provider: deepseek
      config:
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.0
      max_tokens: 300
    system_prompt: |
      You are an AWS inventory assistant. To list S3 buckets, GET
      http://127.0.0.1:9990/aws/s3/list-buckets. The AWS auth headers
      are auto-injected — do NOT add headers manually.
      Reply concisely with the bucket names.

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct
  direct_modules: [memory, http]
  greeting: "AWS bot ready."
  max_turns: 4

capabilities:
  default_policy: auto
  grant:
    - module: memory
      actions: [set_goal, remember]
    - module: http
      actions: [get]
