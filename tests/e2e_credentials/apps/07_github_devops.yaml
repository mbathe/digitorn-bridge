app:
  app_id: e2e-cred-07-github
  name: "E2E #07 - GitHub DevOps Assistant"
  description: "Real agent calling (mock) GitHub API via http with bearer_token PAT."
  category: "test"

modules:
  memory:
    config:
      working_memory: true
  context_builder: {}
  http:
    config: {}
    constraints:
      allowed_hosts:
        - "127.0.0.1"
    credential:
      ref: e2e_github_pat
      scope: per_user
      provider: github_pat

agents:
  - id: main
    role: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      credential:
        ref: e2e_deepseek_test
        scope: per_user
        provider: deepseek
      config:
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.0
      max_tokens: 600
    system_prompt: |
      You are a GitHub DevOps assistant connected to the GitHub REST API.
      The GitHub base URL is http://127.0.0.1:9990/github.
      Authentication is automatic - DO NOT add headers manually.

      AVAILABLE TOOLS:
      - http.get(url) - GET a URL.
      - memory.remember(key, value) - persist a fact.

      WORKFLOW:
      - For "/user" info: GET http://127.0.0.1:9990/github/user.
      - For listing repos: GET http://127.0.0.1:9990/github/user/repos.
      - Reply concisely with one line per repo and the language.

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct
  direct_modules: [memory, http]
  greeting: "GitHub bot ready."
  max_turns: 6

capabilities:
  default_policy: auto
  grant:
    - module: memory
      actions: [set_goal, remember]
    - module: http
      actions: [get]
