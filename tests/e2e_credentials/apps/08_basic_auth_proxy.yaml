app:
  app_id: e2e-cred-08-basic
  name: "E2E #08 - Basic Auth Proxy"
  description: "Real agent calls a service behind HTTP Basic auth via vault basic_auth credential."
  category: "test"

modules:
  memory:
    config:
      working_memory: true
  context_builder: {}
  http:
    config: {}
    constraints:
      allowed_hosts:
        - "127.0.0.1"
    credential:
      ref: e2e_basic_creds
      scope: per_user
      # No `provider:` constraint - this is an internal service not in the catalog.

agents:
  - id: main
    role: assistant
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      credential:
        ref: e2e_deepseek_test
        scope: per_user
        provider: deepseek
      config:
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.0
      max_tokens: 200
    system_prompt: |
      You are a service-status assistant. To check the proxy's status,
      GET http://127.0.0.1:9990/proxy/me. Authentication is auto-injected.
      Reply with the JSON `message` field from the response, nothing else.

execution:
  mode: conversation
  workspace_mode: none
  tool_injection: direct
  direct_modules: [memory, http]
  greeting: "Status bot ready."
  max_turns: 4

capabilities:
  default_policy: auto
  grant:
    - module: memory
      actions: [set_goal, remember]
    - module: http
      actions: [get]
