app:
  app_id: e2e-06-memory
  name: "Memory Agent"
modules:
  memory:
    config:
      working_memory: true
      todo_list: true
agents:
  - id: main
    brain:
      provider: deepseek
      model: deepseek-chat
      config:
        api_key: "DEEPSEEK_KEY"
    system_prompt: "You track goals, plans, and tasks. Use memory tools actively."
execution:
  mode: conversation
  max_turns: 15
  timeout: 120
