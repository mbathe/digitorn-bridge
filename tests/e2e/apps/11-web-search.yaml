app:
  app_id: e2e-11-web
  name: "Web Searcher"
modules:
  web: {}
agents:
  - id: main
    brain:
      provider: deepseek
      model: deepseek-chat
      config:
        api_key: "DEEPSEEK_KEY"
    system_prompt: "You search the web and report findings."
execution:
  mode: conversation
  max_turns: 10
  timeout: 120
capabilities:
  grant:
    - module: web
