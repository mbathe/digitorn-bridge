app:
  app_id: e2e-10-http
  name: "HTTP Agent"
modules:
  http: {}
agents:
  - id: main
    brain:
      provider: deepseek
      model: deepseek-chat
      config:
        api_key: "DEEPSEEK_KEY"
    system_prompt: "You make HTTP requests and report results."
execution:
  mode: conversation
  max_turns: 10
  timeout: 120
capabilities:
  grant:
    - module: http
      actions: [get, head, fetch_page, json_api]
