app:
  app_id: bhv-test-10
  name: "Test 10: dev profile (full)"

modules:
  filesystem: {}
  shell: {}
  memory:
    config:
      working_memory: true
      todo_list: true

behavior:
  profile: dev
  classify_turns: true
  rules:
    max_blind_reads: 2
    changes_before_test_reminder: 2

agents:
  - id: main
    role: coordinator
    brain:
      provider: ollama
      model: llama3.1-8b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 512
    system_prompt: |
      You are a coding assistant. Workspace: {WORKSPACE}
      Be concise.

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [filesystem, shell, memory]
  max_turns: 10
  timeout: 300

capabilities:
  default_policy: auto
  max_risk_level: high
  grant:
    - module: filesystem
      actions: [read, write, edit, grep, glob]
    - module: shell
      actions: [bash]
    - module: memory
      actions: [set_goal, remember, task_create, task_update]
