app:
  app_id: fs-tester
  name: "Filesystem Tester"
  version: "1.0.0"

modules:
  filesystem: {}

agents:
  - id: main
    role: coordinator
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      temperature: 0.0
      max_tokens: 2048
    system_prompt: |
      You are a filesystem test agent. Workspace: {WORKSPACE}
      Execute the user's filesystem request EXACTLY as asked.
      Use the exact tool and parameters the user specifies.

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [filesystem]
  max_turns: 8
  timeout: 180

capabilities:
  default_policy: auto
  max_risk_level: high
  grant:
    - module: filesystem
      actions: [read, write, edit, grep, glob]
