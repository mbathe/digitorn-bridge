app:
  app_id: sec-F-subagent
  name: "Advanced Security F - sub-agent per-action granular restriction"
  description: "Coordinator: full. Specialist 'reader': only filesystem.read."

modules:
  filesystem: {}
  shell: {}
  memory:
    config:
      working_memory: true

agents:
  - id: main
    role: coordinator
    brain:
      provider: ollama
      model: qwen25-7b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 1024
    system_prompt: |
      You coordinate. Spawn a `reader` specialist when you need to inspect files.
      Workspace: {WORKSPACE}

  - id: reader
    role: specialist
    specialty: "Reads files and only reads files."
    modules:
      - filesystem: [read]          # granular: only `read`, no glob/grep/write/edit
    brain:
      provider: ollama
      model: qwen25-7b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 512
    system_prompt: |
      You are a read-only file inspector. Only call `Read`.

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [filesystem, shell, memory]
  max_turns: 10
  timeout: 180

capabilities:
  default_policy: auto
  max_risk_level: high
