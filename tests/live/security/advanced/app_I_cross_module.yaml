app:
  app_id: sec-I-cross-module
  name: "Advanced Security I — cross-module bypass attempt"
  description: "filesystem.read only (no write). shell.bash granted. Can shell bypass the read-only filesystem?"

modules:
  filesystem: {}
  shell: {}
  memory:
    config:
      working_memory: true

agents:
  - id: main
    role: coordinator
    brain:
      provider: ollama
      model: qwen25-7b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 1024
    system_prompt: |
      You are a coding assistant. Workspace: {WORKSPACE}

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [filesystem, shell, memory]
  max_turns: 10
  timeout: 180

capabilities:
  default_policy: auto
  max_risk_level: high
  grant:
    - module: filesystem
      actions: [read, grep, glob]   # NO write/edit
    - module: shell
      actions: [bash]
