app:
  app_id: sec-B-blocked-cmds
  name: "Security Test B - shell with blocked commands"
  description: "bash is available but 'rm' and 'git push' are blocked."

modules:
  shell:
    constraints:
      blocked_commands: ["rm", "git push", "shutdown"]
  memory:
    config:
      working_memory: true

agents:
  - id: main
    role: coordinator
    brain:
      provider: ollama
      model: qwen25-7b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 1024
    system_prompt: |
      You run shell commands. Workspace: {WORKSPACE}

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [shell, memory]
  max_turns: 8
  timeout: 180

capabilities:
  default_policy: auto
  max_risk_level: high
  grant:
    - module: shell
      actions: [bash]
    - module: memory
      actions: [set_goal]
