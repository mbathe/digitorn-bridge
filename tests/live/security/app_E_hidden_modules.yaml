app:
  app_id: sec-E-hidden-modules
  name: "Security Test E - hidden_modules"
  description: "filesystem module is hidden entirely. Only memory visible."

modules:
  filesystem: {}
  memory:
    config:
      working_memory: true

agents:
  - id: main
    role: coordinator
    brain:
      provider: ollama
      model: qwen25-7b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 1024
    system_prompt: |
      You are restricted. Workspace: {WORKSPACE}

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [memory]
  max_turns: 8
  timeout: 180

capabilities:
  default_policy: auto
  max_risk_level: high
  hidden_modules: [filesystem]
  grant:
    - module: memory
      actions: [set_goal]
