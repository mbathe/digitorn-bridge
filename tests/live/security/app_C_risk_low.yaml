app:
  app_id: sec-C-risk-low
  name: "Security Test C - max_risk_level=low"
  description: "High-risk actions (shell.bash, filesystem.write/edit) must be blocked."

modules:
  filesystem: {}
  shell: {}
  memory:
    config:
      working_memory: true

agents:
  - id: main
    role: coordinator
    brain:
      provider: ollama
      model: qwen25-7b-gpu
      backend: openai_compat
      config:
        base_url: "http://localhost:11434/v1"
        api_key: "ollama"
      temperature: 0.1
      max_tokens: 1024
    system_prompt: |
      You are an assistant. Workspace: {WORKSPACE}

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [filesystem, shell, memory]
  max_turns: 8
  timeout: 180

capabilities:
  default_policy: auto
  max_risk_level: low
  # NOTE: No explicit grants - only low-risk actions auto-allowed.
