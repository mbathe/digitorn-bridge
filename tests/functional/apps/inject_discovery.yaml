# Tool injection mode: discovery - only meta-tools, agent searches for tools
app:
  app_id: test-inject-discovery
  name: "Test Inject Discovery"
  version: "1.0"

modules:
  filesystem: {}
  shell: {}
  memory: {}

agents:
  - id: main
    role: worker
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      config:
        api_key: "claude-code"
      temperature: 0.0
      max_tokens: 2048
    system_prompt: |
      You are a test agent in DISCOVERY tool injection mode.
      You do NOT have direct access to all tools.
      Use search_tools to find tools, get_tool to see their schema,
      and execute_tool to run them.

execution:
  mode: conversation
  tool_injection: discovery
  max_turns: 30
  timeout: 120
  workspace_mode: auto

capabilities:
  default_policy: auto
  grant:
    - module: filesystem
    - module: shell
    - module: memory
