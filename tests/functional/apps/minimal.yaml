# Minimal app — tests basic deploy, chat, session lifecycle
app:
  app_id: test-minimal
  name: "Test Minimal"
  version: "1.0"

modules:
  memory: {}

agents:
  - id: main
    role: worker
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      temperature: 0.0
      max_tokens: 256

    system_prompt: |
      You are a minimal test agent. Always reply with exactly: "PONG" when the user says "PING".
      For any other message, reply with a brief helpful response.

execution:
  mode: conversation
  max_turns: 10
  timeout: 60
  workspace_mode: none
