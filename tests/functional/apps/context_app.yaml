# Context management app - tests context compaction, auto_compact, context pressure
app:
  app_id: test-context
  name: "Test Context"
  version: "1.0"

modules:
  memory: {}

agents:
  - id: main
    role: worker
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      config:
        api_key: "claude-code"
      temperature: 0.0
      max_tokens: 256
      context:
        max_tokens: 3000
        strategy: summarize
        keep_recent: 2
        compression_trigger: 0.4
        auto_compact: true
        summary_max_tokens: 256

    system_prompt: |
      You are a context test agent. Answer questions briefly.

execution:
  mode: conversation
  max_turns: 30
  timeout: 120
  workspace_mode: none

capabilities:
  default_policy: auto
  grant:
    - module: memory
