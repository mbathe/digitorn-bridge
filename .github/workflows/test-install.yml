name: Test installers

# Runs the install scripts on Linux, macOS, and Windows. Catches
# breakage before a release, not after. Triggered on:
#   - pushes that touch the installer scripts or the package metadata
#   - manual runs from the Actions tab
#
# The runners cannot register a real system service (no admin
# session on Linux, no logged-in user on macOS for launchctl). The
# matrix therefore tests only the install + tool-availability path;
# the service install is exercised in nightly VM tests.

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "pyproject.toml"
      - ".github/workflows/test-install.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - "pyproject.toml"
      - ".github/workflows/test-install.yml"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────
      # Run the installer
      # ──────────────────────────────────────────────────────────
      - name: Install (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Skip the UAC self-elevation block on CI: the runner is
          # already admin and Start-Process -Verb RunAs would just
          # hang waiting for a user prompt that never appears.
          $env:DIGITORN_INSTALL_SKIP_ELEVATE = "1"
          .\scripts\install.ps1

      # ──────────────────────────────────────────────────────────
      # Verify the CLI ended up on PATH and basics work
      # ──────────────────────────────────────────────────────────
      - name: digitorn version (Unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          digitorn version

      - name: digitorn version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          digitorn version

      # `digitorn doctor` runs a non-destructive environment check;
      # exit code is informational, never failing the build.
      - name: digitorn doctor (Unix)
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          digitorn doctor || true

      - name: digitorn doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          digitorn doctor
        continue-on-error: true
