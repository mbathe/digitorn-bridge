name: Deploy auth-service to Fly

# Push the central digitorn-auth service to Fly.io. Triggers only on
# changes that can affect the running service: package source, Dockerfile,
# fly.toml, or alembic migrations. Doc-only edits skip the deploy.
on:
  push:
    branches: [main]
    paths:
      - 'packages/auth/src/**'
      - 'packages/auth/alembic/**'
      - 'packages/auth/Dockerfile'
      - 'packages/auth/fly.toml'
      - 'packages/auth/pyproject.toml'
      - '.github/workflows/deploy-auth.yml'
  workflow_dispatch:  # manual button in the Actions tab

# Serialize deploys - never two at once on the same Fly app.
concurrency:
  group: deploy-auth-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy digitorn-auth
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Sanity - FLY_API_TOKEN is set
        env:
          TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is missing - set it in repo settings"
            exit 1
          fi

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        working-directory: packages/auth
        run: flyctl deploy --remote-only --strategy rolling

      - name: Public health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 https://auth.digitorn.ai/health \
                | grep -q '"ok":true'; then
              echo "OK auth.digitorn.ai healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::auth.digitorn.ai/health did not come back healthy"
          exit 1

      - name: JWKS reachable
        run: |
          curl -fsS --max-time 5 \
            https://auth.digitorn.ai/.well-known/jwks.json \
            | grep -q '"kty":"RSA"' \
            || (echo "::error::JWKS endpoint broken"; exit 1)
          echo "OK JWKS endpoint serving RS256 keys"
