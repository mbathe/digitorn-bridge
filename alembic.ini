[alembic]
script_location = packages/digitorn/core/migrations
prepend_sys_path = packages
version_path_separator = os
# The URL below is a placeholder. env.py replaces it at runtime with
# Settings.load().database.url - so the live Neon URL configured for
# the daemon is what migrations actually target.
sqlalchemy.url = driver://placeholder/replaced_at_runtime

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
