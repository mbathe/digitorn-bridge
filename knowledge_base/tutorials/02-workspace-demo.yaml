app:
  app_id: tutorial-workspace-demo
  name: "Tutorial — workspace demo"
  description: "Minimal app that exposes the workspace module so HTTP workspace routes return 2xx."

modules:
  workspace:
    config:
      render_mode: markdown
      entry_file: notes.md
      title: "Tutorial notes"
      lint: false
      auto_approve: false

agents:
  - id: main
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      config:
        api_key: claude-code
      temperature: 0.2
      max_tokens: 1024
    system_prompt: "You can write/read files via WsWrite/WsRead."

execution:
  mode: conversation
  entry_agent: main
  greeting: "Hi — I can edit notes.md for you."

capabilities:
  default_policy: auto
  max_risk_level: low
  grant:
    - module: workspace
      actions: [write, read, edit, glob, grep, delete]
