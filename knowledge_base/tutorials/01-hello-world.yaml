app:
  app_id: tutorial-hello-world
  name: "Tutorial 01 — Hello World"
  description: "The smallest Digitorn app that deploys and chats."

agents:
  - id: main
    brain:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      config:
        api_key: claude-code
      temperature: 0.2
      max_tokens: 1024
    system_prompt: |
      You are a friendly assistant. When the user says hi, reply with a short greeting.

execution:
  mode: conversation
  entry_agent: main
  greeting: "Hi! Say hello and I'll respond."

capabilities:
  default_policy: auto
  max_risk_level: low
  grant: []
