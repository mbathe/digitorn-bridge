services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: digitorn-hub-postgres
    environment:
      POSTGRES_USER: digitorn
      POSTGRES_PASSWORD: digitorn
      POSTGRES_DB: digitorn_hub
    ports:
      - "5433:5432"
    volumes:
      - hub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitorn -d digitorn_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: digitorn-hub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hub_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb -p local/digitorn-packages || true) &&
      mc anonymous set download local/digitorn-packages
      "

volumes:
  hub_pg_data:
  hub_minio_data:
