[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitorn-hub"
version = "0.1.0"
description = "Hub server for publishing, searching and installing Digitorn applications"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Digitorn"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "PyJWT>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "aioboto3>=13.0",
    "fastembed>=0.5",
    "structlog>=24.0",
    "tomli>=2.0",
    "httpx>=0.28",
    "email-validator>=2.2",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[project.scripts]
digitorn-hub = "digitorn_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
