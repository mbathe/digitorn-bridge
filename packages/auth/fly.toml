# fly.toml app configuration file generated for digitorn-auth on 2026-04-30T18:22:13+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'digitorn-auth'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  release_command = 'alembic upgrade head'

[env]
  # Tokens never expire naturally. Logout invalidates them via the
  # revocation list (RevokedToken table + /auth/revocations feed
  # consumed by daemons every 30s).
  DIGITORN_AUTH_ACCESS_TOKEN_TTL = '0'
  DIGITORN_AUTH_REFRESH_TOKEN_TTL = '0'
  DIGITORN_AUTH_DEVICE_TOKEN_ROLLING_REFRESH_THRESHOLD = '2592000'
  DIGITORN_AUTH_DEVICE_TOKEN_TTL = '7776000'
  DIGITORN_AUTH_JWT_ALGORITHM = 'RS256'
  DIGITORN_AUTH_JWT_KEY_ID = 'auth-2026-04'
  DIGITORN_AUTH_JWT_PRIVATE_KEY_PATH = '/home/auth/.digitorn/auth-private.pem'
  DIGITORN_AUTH_JWT_PUBLIC_KEY_PATH = '/home/auth/.digitorn/auth-public.pem'
  DIGITORN_AUTH_LOG_LEVEL = 'INFO'
  DIGITORN_AUTH_PORT = '8001'

[[mounts]]
  source = 'auth_keys'
  destination = '/home/auth/.digitorn'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
