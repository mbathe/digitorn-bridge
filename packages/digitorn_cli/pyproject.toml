[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitorn-cli"
version = "1.0.0"
description = "Terminal client for the Digitorn daemon"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=14.0",
    "textual>=1.0",
    "httpx>=0.28",
]

[project.scripts]
digitorn-cli = "digitorn_cli.__main__:main"
