[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "digitorn-gateway"
version = "0.1.0"
description = "Digitorn LLM gateway - OpenAI-compatible router for the digitorn meta credential. Uses LiteLLM as a library; routing, auth, quota and tracking are owned by this service."
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Digitorn"}]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.50",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.28",
    "structlog>=24.0",
    "PyYAML>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "orjson>=3.10",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[project.scripts]
digitorn-gateway = "digitorn_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
