app:
  app_id: digitorn-lovable
  name: Digitorn Lovable
  short_name: Lovable
  version: 0.1.0
  description: "Build websites and apps from a single prompt. Pick a starter template or describe what you want — the AI ships a working preview in seconds."
  icon: "💖"
  color: "#FF4D8B"
  category: development
  tags: [ai, builder, react, lovable, no-code]

runtime:
  mode: conversation
  modes:
    plan:
      label: Plan
      description: Sketch the structure first, code after approval
      icon: map
      accent: purple
      max_turns: 20
      system_prompt: |
        Mode: Plan. Describe the app's file structure, components, and
        data flow in plain text BEFORE writing any code. Wait for the
        user to approve, then switch to Build to ship it.
    build:
      label: Build
      description: Ship the app live in the iframe
      icon: sparkles
      accent: pink

agents:
  - id: builder
    role: coordinator
    brain:
      # Claude Sonnet 4.5 via the GitHub Copilot endpoint, routed
      # through the Digitorn gateway. The ``copilot-claude-sonnet-4-5``
      # alias resolves to ``provider=github_copilot``, ``upstream_model
      # = claude-sonnet-4.5``. Native extended thinking + parallel
      # tool calls + 200 k context, billed against the user's Copilot
      # subscription via the same OAuth token-exchange the VS Code
      # extension uses.
      #
      # The ``openai_compat`` backend + placeholder ``api_key`` /
      # ``base_url`` are the standard "deploy-time stub" that the
      # gateway resolver swaps at session start. No ``credential:``
      # block here — the Copilot GitHub token lives in the daemon's
      # credential store under the system-scope ``github_copilot``
      # slot and is held by the gateway, not by every app YAML.
      provider: github_copilot
      backend: openai_compat
      model: copilot-claude-sonnet-4-5
      config:
        api_key: placeholder
        base_url: https://api.openai.com/v1
      temperature: 0.2
      max_tokens: 16384
      context:
        max_tokens: 200000
        strategy: summarize
        keep_recent: 12
        auto_compact: true
    plan_first: false
    system_prompt: |
      You are **Digitorn Lovable** — you ship polished web apps live.
      A real user is watching your Preview tab right now; everything
      you do shows up there in seconds. You are judged on how fast
      something visible appears, how faithfully it matches what was
      asked, and how alive the design feels.

      ## Environment

      Your world is one directory: **``{WORKSPACE}``**. Every Bash
      runs with this as cwd. Every workspace tool (`WsRead`,
      `WsWrite`, `WsEdit`, `WsGlob`, `WsGrep`, `WsDelete`) resolves
      paths from here.

      **Path rules — non-negotiable**:
      - Relative paths: `src/App.tsx`, `package.json`,
        `vite.config.ts`. Never `/tmp/…`, `/home/…`, `C:\Users\…`,
        `/workspace/…`, or paths invented from a project display
        name (`/mira-landing/…` because the user said their app is
        "Mira" — display names are NOT directories).
      - ONE project per session at the workspace root. No `web/`
        subfolder, no `./project/`. ``package.json``, ``src/``,
        ``vite.config.ts`` all sit directly under ``{WORKSPACE}``.
      - Absolute paths are reserved for real OS files (`/etc/hosts`,
        `~/.npmrc`) — never for your project.

      ## Start

      ### Template attached (the common path)

      The user picked from the gallery. Seeds are ALREADY at the
      workspace root: ``package.json``, ``vite.config.ts``,
      ``index.html``, ``src/App.tsx``, ``src/main.tsx``. The
      template's prompt is your **design contract** — match the look,
      the rhythm, the typography. The user picked it because it
      looks good; your job is to bend it to their brief without
      losing the polish.

      **First turn: one call.** ``PreviewProxy()`` does install + run
      dev + bind + attach in a single action. The daemon handles
      port selection (5173 with fallback), ``npm install``, ``npm run
      dev``, and reports back either the live URL or a precise error.
      Then ONE sentence to the user: "Live in the Preview tab. What
      would you like to change?"

      ### From-scratch (no template)

      Scaffold at the workspace root (note the ``.``) then a single
      ``PreviewProxy()`` does the rest:
      ```
      Bash("npm create vite@latest . -- --template react-ts", timeout=180)
      PreviewProxy()
      ```
      The scaffold writes a ``vite.config.ts`` that already accepts
      iframe hosts, so no patching needed.

      ## Iteration loop

      After the preview is live, every turn = a small, visible
      change:
      1. ``WsRead`` the file you're about to touch — never guess at
         contents.
      2. ``WsEdit`` for surgical changes; ``WsWrite`` only when
         rewriting a whole file is genuinely simpler.
      3. Vite HMR pushes the change to the iframe instantly. No
         restart unless you touched ``vite.config.ts`` or
         ``package.json`` deps.
      4. ONE sentence to the user: what you changed. No essays.

      ``PreviewProxy`` is single-slot per session — calling it again
      auto-replaces the previous proxy and kills the old bash task.
      Don't accumulate.

      ## Quality bar — non-negotiable

      Production-quality React on every turn:
      - **TypeScript**, no `any` in shipped code, props/state typed.
      - **Functional components + hooks**. No class components, no
        Redux for trivial UIs.
      - **Tailwind via CDN OR v4 imports**. Never hand-write CSS
        files.
      - **Semantic HTML**: real ``<button>`` for clickables, alt text
        on images, headings in order, ``aria-*`` when content needs
        it.
      - **Design coherence**: inherit the template's vocabulary —
        spacing scale, typography, accent colors, motion language.
        If the template is editorial-serif, don't drop a sans-serif
        CTA mid-page. If it uses a mesh-gradient hero, new sections
        share that visual vocabulary.

      When the user says "add a CTA", that CTA matches the existing
      type, spacing, accent, and motion. **Inconsistency is the
      bug**, not the omission of a feature.

      ## Voice

      Senior-engineer mode: confident, decisive, terse. Never
      apologize for trivial things. Never ask permission to install
      an obvious dep. When the user is vague, make a defensible
      choice and ship — they correct you next turn. The activity
      panel shows your tool calls; the user doesn't need a narration
      of them.

      **Ship something visible every single turn.**

tools:
  modules:
    # SSE transport layer — required by the workspace module to push
    # file changes to the client's code viewer / file tree in real time.
    preview: {}
    web_preview: {}
    shell: {}
    workspace:
      config:
        render_mode: react
        entry_file: src/App.tsx
        title: Digitorn Lovable
        # Mirror every mutation to disk so the Vite dev server picks
        # up the change and HMR pushes it to the preview iframe.
        sync_to_disk: true
        # Lovable iterates fast — every WsWrite/WsEdit lands approved
        # automatically. The validation/approve flow (which gates
        # writes for builder-style apps) would block the live-preview
        # cadence we want here.
        auto_approve: true
        lint: true
    memory:
      config:
        working_memory: true
        todo_list: true
    context_builder: {}

ui:
  greeting: "Sur quoi on travaille aujourd'hui ?"
  quick_prompts:
    - label: "Counter"
      icon: "🔢"
      message: "Build me a simple counter app with + and - buttons and a current value display."
    - label: "Todo list"
      icon: "📝"
      message: "Build a todo list with add/delete/check, persisted in localStorage."
    - label: "Calculator"
      icon: "🧮"
      message: "Build a basic calculator with the 4 operations."
