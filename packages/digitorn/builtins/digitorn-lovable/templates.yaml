# Starter templates exposed by Digitorn Lovable.
#
# Each entry declares:
#   - preview_path: pre-built static asset served by the daemon at
#       /api/apps/digitorn-lovable/template-assets/<preview_path>
#     and loaded by the chat client's template-preview iframe.
#   - seed_dir: a complete bootable project copied into the user's
#     workspace when the template is applied. The agent runs
#     `npm install && npm run dev && PreviewProxy(5173)` and iterates.
#   - system_prompt: one-turn system addendum injected at the moment
#     the user sends a message with the template attached.
#
# To add a template:
#   1. Drop the bootable project under `templates/<id>/files/`
#   2. Build it once and copy the output to `templates/<id>/dist/`
#   3. Add the entry below.

templates:
  - id: landing-ai-saas
    name: "AI SaaS landing"
    description: "Mesh-gradient hero, features, stats, testimonial, pricing, FAQ. Premium dark."
    preview_path: "templates/landing-ai-saas/dist/index.html"
    seed_dir: "templates/landing-ai-saas/files/"
    system_prompt: |
      You are working from the AI SaaS landing template. The user has
      a starter project already scaffolded in the workspace (Vite +
      React + TS, Tailwind via CDN) with a polished landing page in
      ``src/App.tsx``. Keep the premium dark aesthetic, the mesh
      gradient hero, the multi-section layout (hero, features, stats,
      testimonial, pricing 3-tier, FAQ, footer). The Monthly/Yearly
      toggle and FAQ accordion are already interactive — preserve them.

      First turn:
        1. ``Bash("npm install", timeout=300)`` (foreground)
        2. ``Bash("npm run dev -- --host 0.0.0.0 --port 5173", run_in_background=true)``
        3. ``PreviewProxy(port=5173, bash_task_id=<id>)``

      Then iterate on ``src/App.tsx`` with Write/Edit — Vite HMR pushes
      every change live to the user's Preview tab.

  - id: app-dashboard
    name: "Analytics dashboard"
    description: "Sidebar, search, KPIs with sparklines, area chart, activity feed, customers table."
    preview_path: "templates/app-dashboard/dist/index.html"
    seed_dir: "templates/app-dashboard/files/"
    system_prompt: |
      You are working from the Analytics dashboard template. Starter
      project: Vite + React + TS + Tailwind CDN. ``src/App.tsx`` ships
      a sidebar nav, search input, 4 KPIs with inline sparklines, a
      main area chart, an activity feed, and a customers table.
      Sidebar nav, range tabs, search, and the table sort headers are
      interactive — keep them working.

      First turn:
        1. ``Bash("npm install", timeout=300)`` (foreground)
        2. ``Bash("npm run dev -- --host 0.0.0.0 --port 5173", run_in_background=true)``
        3. ``PreviewProxy(port=5173, bash_task_id=<id>)``

      Then rename KPIs / customers / metrics to match the user's
      product. Iterate on ``src/App.tsx`` with Write/Edit; HMR pushes
      changes live.

