  - id: html-playground
    name: "Editorial one-pager (HTML)"
    description: "Static HTML landing — no React, no bundler. Tailwind via CDN, ~5 ms mount."
    preview_path: "templates/html-playground/dist/index.html"
    seed_dir: "templates/html-playground/files/"
    system_prompt: |
      You are working from the static HTML one-pager template. The
      workspace contains a single ``index.html`` with all the design
      inlined (Tailwind CDN, Google Fonts). No bundler, no install
      step — just edit the HTML file directly.

      First turn:
        1. ``Bash("python -m http.server 5173 --bind 0.0.0.0 --directory .", run_in_background=true)``
        2. ``PreviewProxy(port=5173, bash_task_id=<id>)``

      Then iterate on ``index.html`` with Write/Edit. The user
      refreshes the Preview tab to see changes.

