<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitorn React Sandbox</title>
    <!-- Match the host's body font (next/font/google IBM Plex Sans).
         The iframe doc never inherits the parent's CSS, so we have to
         load it explicitly here. ``preconnect`` saves a round trip on
         the first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      /* Paint the exact host slate (digitorn ``--bg`` resolved value)
         so the iframe blends seamlessly into the chat panel. Going
         ``transparent`` lets Chrome fall back to the white Canvas
         (no ``color-scheme`` inheritance across documents); going
         darker than the host (#0B0F14) creates a visible halo around
         the content. ``#0E1218`` is the host body bg, verified via
         getComputedStyle. */
      html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #0E1218; color-scheme: dark; }
      /* Set ``--font-sans`` so the SDK's ``var(--font-sans, system-ui)``
         resolves to the brand font instead of the system default. */
      :root { --font-sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif; }
      body { font-family: var(--font-sans); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
