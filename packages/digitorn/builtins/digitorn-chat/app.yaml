app:
  app_id: digitorn-chat
  name: Digitorn Chat
  short_name: Chat
  version: 2.0.0
  description: ChatGPT-equivalent assistant. Ask anything, analyze files, search the
    web, write drafts. No file writes, no code execution.
  icon: 💬
  color: '#4f8cff'
  category: general
  author: Digitorn
  tags:
  - chat
  - assistant
  - general
  - chatgpt-equivalent
  quick_prompts:
  - label: Explain something
    icon: 💡
    message: 'Explique-moi simplement :'
  - label: Search the web
    icon: 🔍
    message: 'Cherche sur le web les dernières infos sur :'
  - label: Help me write
    icon: ✍️
    message: 'Aide-moi à rédiger '
  - label: Brainstorm ideas
    icon: 🧠
    message: 'Donne-moi 10 idées créatives pour :'
  - label: Translate
    icon: 🌐
    message: 'Traduis en anglais :'
  # Attachment types the composer's "+" menu exposes. ``image`` routes
  # to the vision LLM; ``document`` is extracted as text before the
  # model sees it. Use ``"*"`` to enable every supported type.
  attachments:
  - image
  - document
  # Pure ``tool`` mode: the agent NEVER sees content inline. The
  # user message carries only a manifest. The agent MUST call
  # WsRead("attachments/<name>") to read the file. Flip back to
  # ``direct`` if you want the legacy behaviour where the text is
  # prepended to the user message and no tool call is needed.
  attachments_mode: tool
runtime:
  mode: conversation
  workdir_mode: none
  tool_injection: direct
  direct_modules:
  - web
  max_turns: 50
  timeout: 1800
agents:
- id: main
  role: assistant
  brain:
    # ``gpt-5-mini`` via the Digitorn gateway: ~400 k input /
    # ~16 k output, native tool-calling discipline, included in
    # the Pro+ premium-request budget. The gateway resolver
    # (``gateway_resolver.py``) swaps this brain for a gateway-
    # bound ``OpenAICompatProvider`` at session start for every
    # authenticated user; the ``api_key`` + ``base_url`` below
    # are placeholders ignored on the gateway path and only used
    # by the bootstrap to instantiate an initial provider. No
    # ``credential:`` block - that field would only matter for
    # BYOK-ON users, which is not the default for a chat app
    # routed through the shared Digitorn pool.
    provider: openai
    backend: openai_compat
    model: gpt-5-mini
    config:
      api_key: placeholder
      base_url: https://api.openai.com/v1
    temperature: 0.7
    max_tokens: 16384
    context:
      max_tokens: 400000
      strategy: summarize
      keep_recent: 10
      auto_compact: true
    # Local Ollama Qwen 7B fallback. Triggered on 402 / quota /
    # gateway-unreachable errors so the chat keeps working even
    # when the user's gateway budget is empty or the gateway is
    # offline. Local provider, never proxied (KEEP-deployed).
    fallback:
      provider: ollama
      model: qwen25-7b-gpu:latest
      backend: openai_compat
      config:
        base_url: http://localhost:11434/v1
        api_key: ollama
        num_ctx: 131072
      temperature: 0.7
      max_tokens: 4096
  system_prompt: '{{prompt.system}}'
tools:
  modules:
    memory:
      config:
        auto_remember: true
        working_memory: true
    web:
      config:
        search_backend: duckduckgo
    context_builder: {}
    # `preview` is a hard dep of `workspace`. It owns the per-session
    # channel state that the SDK iframe and the agent's WsRead share.
    preview: {}
    # `workspace` exposes WsRead / WsGlob / WsGrep to the agent. The
    # `agent_root` lock confines the agent's view to ``attachments/``
    # so it can't accidentally read app-private state. ``auto_approve``
    # is on because attachments land pre-approved (they're user-
    # uploaded content, not agent writes that need review).
    workspace:
      config:
        render_mode: markdown
        title: "Chat attachments"
        sync_to_disk: false
        agent_root: "attachments"
        auto_approve: true
        lint: false
  capabilities:
    default_policy: auto
    grant:
    - module: memory
      actions:
      - set_goal
      - remember
    - module: web
      actions:
      - search
      - fetch
      - extract
    - module: context_builder
      actions:
      - ask_user
    # WsRead only. The agent receives the exact attachment paths in
    # the manifest, so it has no business globbing or grepping the
    # workspace - that just leaks app-private state and adds noisy
    # tool calls to the chat. No write / edit / delete either.
    - module: workspace
      actions:
      - read
security:
  # Behavior coach disabled: no per-turn classifier brain, no
  # secondary LLM call. The main agent handles instructions
  # directly without a coach injecting directives. Kept the
  # profile reference so the rule engine still applies the base
  # ``chat`` profile (read-before-edit, no fabricated URLs, etc.)
  # without the classifier overhead.
  behavior:
    profile: '{{behavior.chat}}'
    classify_turns: false
    rule_definitions:
    - id: no_fabricated_urls
      description: Never invent URLs in responses
      trigger: '*'
      when: on_text
      action: warn
      condition:
        text_matches: https?://(?!(?:duckduckgo|google|bing|wikipedia|github|stackoverflow))[a-z0-9.-]+/
      message: 'Be careful: only cite URLs you actually fetched. Never invent them.'
ui:
  greeting: 'Bonjour ! Je suis Digitorn Chat. Je peux t''aider à comprendre, rédiger,
    chercher, traduire, raisonner. Que puis-je faire pour toi ?

    '
  tool_calls:
    inject_intent: true
    hide_details: true
    strict_mode: true
    intent_phrases:
      source: auto
      llm:
        gateway_model: gpt-4o-mini
        timeout_seconds: 4
      static:
        phases:
          analyzing:
            - "Analyzing your request..."
            - "Understanding what you need..."
          thinking:
            - "Thinking..."
            - "Reasoning through this..."
          tool_streaming:
            - "Working on it..."
            - "Processing..."
          between_tools:
            - "Reviewing results..."
            - "Planning next step..."
          finalizing:
            - "Wrapping up the response..."
            - "Composing the final answer..."

dev:
  # Lets end users author their own skills via the composer's
  # ``/use_skill`` palette + ``.md`` file picker. Stored per-user
  # in the daemon's ``user_skills`` table; injected as a turn-scoped
  # ``role: system`` directive when the user sends
  # ``/use_skill <name> <prompt>``. See
  # docs/reference/runtime/user-skills.md for the full mechanic.
  allow_user_skills: true
