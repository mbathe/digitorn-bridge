app:
  app_id: copilot-smoke
  name: Copilot Smoke Test
  short_name: Copilot
  version: 0.3.0
  description: Minimal chat app to verify GitHub Copilot integration via api.githubcopilot.com.
  icon: 🤖
  color: '#24292e'
  category: general
  author: Digitorn
  tags:
  - copilot
  - smoke-test
  - llm
  quick_prompts:
  - label: Identify model
    icon: 🔍
    message: 'Which exact model are you? Reply in one short sentence with the version string.'
  - label: Code sample
    icon: 💻
    message: 'Write a Python function that returns the nth Fibonacci number using memoization. Just the code, no explanation.'
  - label: Reasoning
    icon: 🧠
    message: 'A bat and a ball cost $1.10. The bat costs $1 more than the ball. How much does the ball cost? Show your reasoning step by step.'
  - label: Shell smoke
    icon: 🖥️
    message: 'Run `git status` in the workspace via Bash. Then run `ls -la` and tell me how many files are at the top level.'
  - label: Static landing page
    icon: 🌐
    message: 'Build me a single-file landing page (one HTML file with inline CSS) for a fictional product called Lumen. Then make it visible in the preview tab.'
  - label: Vite app live
    icon: ⚡
    message: 'Scaffold a tiny Vite + React app in a subfolder, install dependencies, start the dev server, and wire it up so I can see it live in the preview tab.'

runtime:
  mode: conversation
  # ``required`` forces the user to pick a workspace directory before
  # the first turn. Bash and the workspace tools both need a valid
  # cwd; ``auto`` would silently spawn a per-session scratch dir,
  # which makes shell smoke tests less useful (they should run in
  # whatever repo the user picks). Switch back to ``auto`` if you
  # want a frictionless probe with no folder picker.
  workdir_mode: required
  tool_injection: direct
  max_turns: 20
  timeout: 600

agents:
- id: main
  role: assistant
  brain:
    provider: github_copilot
    backend: github_copilot
    # gpt-5-mini : ~400k input tokens / ~16k output, included in the
    # Pro+ premium-request budget. Way bigger context than the
    # 128k of gpt-4o-mini, useful when the smoke test exercises long
    # workspace files or chained shell output.
    model: gpt-5-mini
    credential:
      ref: gh_copilot_main
      scope: per_user
      provider: github_copilot
    config:
      # Placeholder. The real api_key is hot-injected from the user
      # vault credential `gh_copilot_main` at session start. Without
      # a config block here the bootstrap skips provider creation,
      # and the session-time injector has nothing to override.
      api_key: '{{env.GH_COPILOT_TOKEN}}'
      base_url: https://api.githubcopilot.com
    temperature: 0.7
    max_tokens: 16384
    context:
      max_tokens: 400000
      strategy: summarize
      keep_recent: 10
      auto_compact: true
  system_prompt: |
    You are a helpful assistant running through the GitHub Copilot endpoint
    api.githubcopilot.com. Reply concisely. When asked your identity, name the
    underlying model honestly (e.g. "gpt-5-mini via Copilot").

    File operations: this app exposes a virtual workspace. To create, read or
    modify files you MUST call the workspace tools by their exact names:
    `WsWrite` (create/overwrite), `WsRead`, `WsEdit` (surgical replace),
    `WsGlob`, `WsGrep`, `WsDelete`. The names `Write`, `filesystem.write`,
    `create_file`, etc. are NOT available in this app — they will fail with
    "Tool not found". Always prefix with `Ws` when touching files.

    Shell commands: use `Bash` (single tool, multiple modes). Sync default
    waits for completion; pass `run_in_background=true` for long-running
    jobs (returns a `task_id` you can later check with `Bash(task_id=...)`
    or kill with `Bash(task_id=..., kill=true)`). Set `description` to a
    short human label so the user sees intent in the Tasks panel
    (e.g. `Bash(command='pytest -xvs', description='Run tests',
    run_in_background=true)`). Always check `exit_code` and read `stderr`
    on non-zero.

tools:
  # Same pattern as packages/digitorn/builtins/digitorn-builder/app.yaml:
  # the workspace module is declared with a config + instructions block,
  # and capabilities use ``default_policy: block`` with EXPLICIT grant.
  # ``auto`` would technically expose every action too, but the canonical
  # pattern in the builtins is the explicit form - LLMs occasionally
  # ignore tools when no grant is visible in the prompt context.
  modules:
    workspace:
      config:
        render_mode: code
        entry_file: README.md
        title: Copilot Smoke
        sync_to_disk: true
        lint: true
        instructions: |
          You have access to a virtual workspace where every file you write
          streams live to the user's IDE panel. The tools are:
            - WsWrite : create or overwrite a file
            - WsRead  : read a file
            - WsEdit  : surgical text replacement in a file
            - WsGlob  : find files by pattern
            - WsGrep  : search file contents by regex
            - WsDelete: remove a file
          Always use these names. Do NOT use Write / filesystem.write /
          create_file - they are not available in this app and will fail.
    preview: {}
    # Bash for shell smoke (git, build tools, scripts). The module's
    # default config keeps a 300 s sync timeout and the standard
    # forbidden-command guard - good enough for a smoke probe.
    shell: {}
    # Session-scoped iframe preview attachments. The agent spawns a
    # dev server (or `python -m http.server` for a built dist) via
    # Bash, then registers the port with PreviewProxy.
    # No system_prompt guidance is provided on purpose: this app
    # is the test bed for whether the module's own tool prompts
    # are self-explanatory.
    web_preview: {}
  capabilities:
    default_policy: block
    # ``high`` is required to grant ``shell.bash`` (declared at
    # risk_level=high in the module manifest). Workspace ops are
    # ``medium`` and ``web_preview`` actions are ``low``, both
    # remain allowed under this ceiling.
    max_risk_level: high
    grant:
    - module: workspace
      actions:
      - write
      - read
      - edit
      - glob
      - grep
      - delete
    - module: shell
      actions:
      - bash
    - module: web_preview
      actions:
      - proxy
      - detach
      - list

ui:
  # ── Workspace pane (renderer + layout) ────────────────────────
  # Lovable-style: workspace dominant on the right, opens
  # automatically the first time the agent writes a file or runs
  # a tool that emits workbench events.
  workspace:
    render_mode: code
    entry_file: README.md
    title: Copilot Smoke
    position: right
    width_pct: 65
    auto_open_on_first_tool: true

  # ── Chat layout / behaviour (Phase 0 demo) ────────────────────
  # Each flag below maps to a Phase-0 wired feature in both Flutter
  # and the web client. Flip any value, redeploy, refresh - the
  # chat surface adapts without a rebuild.
  layout: lovable                     # high-level preset
  density: compact                    # tighter bubble spacing

  thinking:
    visible: true                     # show the Thoughts blocks
    collapsed_default: true           # but mount them collapsed

  tool_calls:
    collapsed_default: true           # tool chips closed at first
    show_silent: false                # hide Memory / Agent plumbing

  composer:
    file_upload: true                 # paperclip on (drag-drop files)
    voice: false                      # mic off (smoke test, no audio)
    slash_commands: true              # / palette enabled
    quick_prompts_visible: true       # chips above the empty composer

  visual:
    accent: '#10b981'                 # emerald accent overrides app.color
    bubble_style: card
    user_bubble_alignment: right

  greeting: |
    Salut ! Je tourne sur GitHub Copilot via api.githubcopilot.com. Pose-moi
    n'importe quoi pour vérifier que l'intégration marche. Les quick-prompts
    en haut testent identité, code et raisonnement.

  # ── Phase-1 slots demo ─────────────────────────────────────────
  # Only the ``footer_right`` slot is wired - it overrides the
  # default model chip in StatusLine with a YAML-driven inline
  # widget. The ``header`` slot is intentionally NOT used: the
  # floating top-right pill it produced ("Copilot Smoke / Phase 1
  # slot demo") competed with the empty-state hero and did not
  # add information the user couldn't already get from the app
  # tile, so it was removed.
  slots:
    footer_right:
      kind: inline
      ref: smoke_footer

  widgets:
    inline:
      smoke_footer:
        tree:
          type: row
          children:
            - { type: text, text: 'gpt-5-mini · system scope' }
