app:
  app_id: copilot-smoke
  name: Copilot Smoke Test
  short_name: Copilot
  version: 0.4.0
  description: Full-capability smoke test on Claude Sonnet 4.5 via Copilot. Exercises
    thinking, multi-step tool chains, shell, workspace writes, web search, web preview.
  icon: 🤖
  color: '#24292e'
  category: general
  author: Digitorn
  tags:
  - copilot
  - smoke-test
  - thinking
  - tool-use
  quick_prompts:
  - label: Identify model
    icon: 🔍
    message: 'Which exact model are you? Reply in one short sentence with the version string.'
  - label: Multi-step reasoning
    icon: 🧠
    message: 'Trois trains partent de gares différentes à 8h, 8h15 et 8h40. Ils convergent
      vers la même gare centrale et arrivent simultanément à 11h12. Sachant que le premier
      roule à 90 km/h, le second à 105 km/h et le troisième à 130 km/h, calcule la distance
      de chaque gare de départ. Montre ton raisonnement étape par étape.'
  - label: Tool chain
    icon: ⛓️
    message: 'Crée un fichier ``hello.py`` qui imprime la suite de Fibonacci jusqu''à 50.
      Ensuite, exécute-le via Bash et montre-moi la sortie. Si ça plante, corrige le fichier
      et relance.'
  - label: Shell + grep
    icon: 🖥️
    message: 'Combien de fichiers ``.py`` ce repo contient-il (récursif depuis la racine)
      ? Réponds avec la commande exécutée et le compte.'
  - label: Vite app live
    icon: ⚡
    message: 'Scaffold un mini Vite + React app dans un sous-dossier, installe les deps,
      lance le dev server, et expose-le dans l''onglet preview.'
  - label: Web search
    icon: 🌐
    message: 'Cherche sur le web les 3 dernières news Anthropic et résume-les en 3 puces.'

runtime:
  mode: conversation
  # ``required`` forces the user to pick a workspace directory before
  # the first turn. Bash and the workspace tools both need a valid
  # cwd; ``auto`` would silently spawn a per-session scratch dir,
  # which makes shell smoke tests less useful (they should run in
  # whatever repo the user picks). Switch back to ``auto`` if you
  # want a frictionless probe with no folder picker.
  workdir_mode: required
  tool_injection: direct
  max_turns: 20
  timeout: 600

agents:
- id: main
  role: assistant
  brain:
    # Claude Sonnet 4.5 via the GitHub Copilot endpoint, routed
    # through the Digitorn gateway. The ``copilot-claude-sonnet-4-5``
    # alias resolves to ``provider=github_copilot``, ``upstream_model
    # = claude-sonnet-4.5`` (see ``gateway/bootstrap_seed.py`` +
    # ``gateway_models`` table). Native extended thinking + parallel
    # tool calls + 200 k context, billed against the user's Copilot
    # subscription via the same OAuth token-exchange the VS Code
    # extension uses.
    #
    # The ``openai_compat`` backend + placeholder ``api_key`` /
    # ``base_url`` are the standard "deploy-time stub" that the
    # gateway resolver swaps at session start (same pattern as
    # ``digitorn-chat``). No ``credential:`` block here -- the Copilot
    # GitHub token lives in the daemon's credential store under the
    # system-scope ``github_copilot`` slot and is held by the gateway,
    # not by every app YAML.
    provider: github_copilot
    backend: openai_compat
    model: copilot-claude-sonnet-4-5
    config:
      api_key: placeholder
      base_url: https://api.openai.com/v1
    temperature: 0.7
    max_tokens: 16384
    context:
      max_tokens: 200000
      strategy: summarize
      keep_recent: 10
      auto_compact: true
  system_prompt: |
    You are a smoke-test assistant running Claude Sonnet 4.5 via the
    GitHub Copilot endpoint (routed through the Digitorn gateway). Use
    the full
    range of your capabilities: think out loud for hard problems, chain
    tool calls aggressively, run shell commands when relevant, write
    files when asked, fetch the web when the user asks for current
    information.

    Identity: when asked which model you are, answer honestly -- "Claude
    Sonnet 4.5 via Copilot" -- not the gateway alias.

    File operations: this app exposes a virtual workspace. To create,
    read or modify files you MUST call the workspace tools by their
    exact names: `WsWrite` (create/overwrite), `WsRead`, `WsEdit`
    (surgical replace), `WsGlob`, `WsGrep`, `WsDelete`. Generic
    names (`Write`, `filesystem.write`, `create_file`, ...) are not
    bound in this app -- always prefix with `Ws`.

    Shell commands: use `Bash` (single tool, multiple modes). Sync
    default waits for completion; pass `run_in_background=true` for
    long-running jobs (returns a `task_id` you can later check with
    `Bash(task_id=...)` or kill with `Bash(task_id=..., kill=true)`).
    Set `description` to a short human label so the user sees intent
    in the Tasks panel. Always check `exit_code` and read `stderr` on
    non-zero.

    Web preview: when you spawn a dev server (Vite, Next, etc.) via
    Bash, register its port with the `web_preview.proxy` tool so the
    iframe in the workspace panel shows the running app. Pass the
    proxy result back to the user as a clickable artefact.

    Web search: when the user asks for current / recent information,
    use the `web` module's search/fetch tools instead of guessing from
    your training cutoff.

    Thinking budget: for non-trivial problems (multi-step math, code
    debugging, planning a chain of tool calls), use extended thinking.
    The user has opted in to seeing your reasoning in a collapsible
    block.

tools:
  # Same pattern as packages/digitorn/builtins/digitorn-builder/app.yaml:
  # the workspace module is declared with a config + instructions block,
  # and capabilities use ``default_policy: block`` with EXPLICIT grant.
  # ``auto`` would technically expose every action too, but the canonical
  # pattern in the builtins is the explicit form - LLMs occasionally
  # ignore tools when no grant is visible in the prompt context.
  modules:
    workspace:
      config:
        render_mode: code
        entry_file: README.md
        title: Copilot Smoke
        sync_to_disk: true
        lint: true
        instructions: |
          You have access to a virtual workspace where every file you write
          streams live to the user's IDE panel. The tools are:
            - WsWrite : create or overwrite a file
            - WsRead  : read a file
            - WsEdit  : surgical text replacement in a file
            - WsGlob  : find files by pattern
            - WsGrep  : search file contents by regex
            - WsDelete: remove a file
          Always use these names. Do NOT use Write / filesystem.write /
          create_file - they are not available in this app and will fail.
    preview: {}
    # Bash for shell smoke (git, build tools, scripts). The module's
    # default config keeps a 300 s sync timeout and the standard
    # forbidden-command guard - good enough for a smoke probe.
    shell: {}
    # Session-scoped iframe preview attachments. The agent spawns a
    # dev server (or `python -m http.server` for a built dist) via
    # Bash, then registers the port with PreviewProxy.
    # No system_prompt guidance is provided on purpose: this app
    # is the test bed for whether the module's own tool prompts
    # are self-explanatory.
    web_preview: {}
    # Web search + fetch. DuckDuckGo backend is the default; no
    # credentials needed. Exposes ``web.search`` and ``web.fetch``.
    web:
      config:
        search_backend: duckduckgo
  capabilities:
    default_policy: block
    # ``high`` is required to grant ``shell.bash`` (declared at
    # risk_level=high in the module manifest). Workspace ops are
    # ``medium`` and ``web_preview`` actions are ``low``, both
    # remain allowed under this ceiling.
    max_risk_level: high
    grant:
    - module: workspace
      actions:
      - write
      - read
      - edit
      - glob
      - grep
      - delete
    - module: shell
      actions:
      - bash
    - module: web_preview
      actions:
      - proxy
      - detach
    - module: web
      actions:
      - search
      - fetch

ui:
  # ── Workspace pane (renderer + layout) ────────────────────────
  # Lovable-style: workspace dominant on the right, opens
  # automatically the first time the agent writes a file or runs
  # a tool that emits workbench events.
  workspace:
    render_mode: code
    entry_file: README.md
    title: Copilot Smoke
    position: right
    width_pct: 65
    auto_open_on_first_tool: true

  # ── Chat layout / behaviour (Phase 0 demo) ────────────────────
  # Each flag below maps to a Phase-0 wired feature in both Flutter
  # and the web client. Flip any value, redeploy, refresh - the
  # chat surface adapts without a rebuild.
  layout: lovable                     # high-level preset
  density: compact                    # tighter bubble spacing

  thinking:
    visible: true                     # show the Thoughts blocks
    collapsed_default: true           # but mount them collapsed

  tool_calls:
    collapsed_default: true           # tool chips closed at first
    show_silent: false                # hide Memory / Agent plumbing
    inject_intent: true               # Lovable-style live progress line:
                                      # every tool call gets a required
                                      # ``intent`` first-property (verb
                                      # phrase like "Analyzing requirements").
                                      # The frontend aggregates them into a
                                      # single live line instead of showing
                                      # individual tool rows.

  composer:
    file_upload: true                 # paperclip on (drag-drop files)
    voice: false                      # mic off (smoke test, no audio)
    slash_commands: true              # / palette enabled
    quick_prompts_visible: true       # chips above the empty composer

  visual:
    accent: '#10b981'                 # emerald accent overrides app.color
    bubble_style: card
    user_bubble_alignment: right

  greeting: |
    Salut ! Je tourne sur GitHub Copilot via api.githubcopilot.com. Pose-moi
    n'importe quoi pour vérifier que l'intégration marche. Les quick-prompts
    en haut testent identité, code et raisonnement.

  # ── Phase-1 slots demo ─────────────────────────────────────────
  # Only the ``footer_right`` slot is wired - it overrides the
  # default model chip in StatusLine with a YAML-driven inline
  # widget. The ``header`` slot is intentionally NOT used: the
  # floating top-right pill it produced ("Copilot Smoke / Phase 1
  # slot demo") competed with the empty-state hero and did not
  # add information the user couldn't already get from the app
  # tile, so it was removed.
  slots:
    footer_right:
      kind: inline
      ref: smoke_footer

  widgets:
    inline:
      smoke_footer:
        tree:
          type: row
          children:
            - { type: text, text: 'Claude Sonnet 4.5 · Copilot via gateway' }
