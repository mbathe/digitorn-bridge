# Copilot Smoke Test — built-in test harness
#
# Auto-deployed by ``bootstrap_builtins`` at every daemon start at
# scope=system, so it shows up in the apps listing for every user.
# Used as the canonical test bed for new modules — currently exercised
# to verify ``web_preview`` tool prompts are self-explanatory (the
# agent must figure out PreviewProxy / PreviewStatic from the tool
# definitions alone, no system_prompt hints).

[package]
id = "copilot-smoke"
name = "Copilot Smoke Test"
version = "0.2.0"
description = "Minimal chat app to verify GitHub Copilot integration via api.githubcopilot.com — also doubles as a test bed for new modules."
author = "Digitorn"
license = "MIT"
category = "general"

[package.source]
type = "official"
verified = true
publisher = "digitorn"

[package.compatibility]
digitorn_min = ">=1.0.0"

[package.requirements]
modules = ["workspace", "preview", "shell", "web_preview"]
recommended_models = ["gpt-5-mini", "claude-sonnet-4-5"]
external_tools = []

[package.credentials]
required = ["github_copilot"]
optional = []

[package.permissions]
risk_level = "low"
network_access = true
filesystem_access = []
filesystem_scopes = []
requires_approval = []

[package.hub]
tags = ["copilot", "smoke-test", "llm", "preview"]

[package.release]
released_at = "2026-05-03"
release_notes = "Added web_preview module + 2 quick prompts (static landing page + Vite app live) to test session-scoped iframe attachments."
breaking = false
