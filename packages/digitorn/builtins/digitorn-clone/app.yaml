# Digitorn Clone — Claude Opus clone
#
# Architecture:
#   DeepSeek-R1 (thinking)      — main brain for coordinator + specialists
#   DeepSeek-chat (V3)          — Supreme Coach (classifier, runs every turn)
#   Behavior profile "clone"    — extends `dev` with durcir thresholds
#   10 declarative rule_definitions — runtime enforcement
#   5 specialists (worker/explore/plan/verification + coordinator)
#
# The Supreme Coach is prompted as an RLHF-replacement — it injects
# per-turn directives that compensate DeepSeek-R1's gaps vs Claude Opus:
# verbosity, uncertainty, tone, ambiguity, context, proactive, verification.

app:
  app_id: digitorn-clone
  name: "Digitorn Clone"
  version: "1.0.0"
  description: "Claude Opus clone — DeepSeek-R1 + Supreme Coach (DeepSeek-chat) + behavior engine."
  icon: "🧠"
  color: "#6366F1"
  category: "coding"
  author: "Digitorn"
  tags: [coding, multi-agent, behavior, coach, deepseek, claude-clone]
  quick_prompts:
    - label: "Fix a bug"
      icon: "🐛"
      message: "Find and fix this bug:"
    - label: "Add feature"
      icon: "✨"
      message: "Implement this feature:"
    - label: "Explain code"
      icon: "📖"
      message: "Explain how this code works:"
    - label: "Refactor"
      icon: "♻️"
      message: "Refactor this for clarity:"
    - label: "Review"
      icon: "🔍"
      message: "Review this code:"

# ─────────────────────────────────────────────────────────────────────
# MODULES
# ─────────────────────────────────────────────────────────────────────

modules:
  filesystem: {}

  shell: {}

  lsp:
    config:
      python: "ruff check --output-format=json --select=E,F,W,I,N,UP,B,A,C4,SIM,RUF"

  memory:
    config:
      working_memory: true
      todo_list: true
      runtime:
        goal_guardian: true

  web:
    config:
      search_backend: duckduckgo

# ─────────────────────────────────────────────────────────────────────
# AGENTS — coordinator + 4 specialists (same pattern as Claude Code)
# All run on DeepSeek-R1 (deepseek-reasoner) for native thinking.
# ─────────────────────────────────────────────────────────────────────

agents:

  - id: main
    role: coordinator
    brain:
      provider: deepseek
      model: deepseek-reasoner
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1
      max_tokens: 8192
      context:
        max_tokens: 64000
        strategy: summarize
        keep_recent: 8
        auto_compact: true
    plan_first: false
    system_prompt: "{{prompt.system}}"
    pool:
      max_workers: 5

  - id: worker
    role: specialist
    specialty: "General-purpose implementation — research, code, test, commit"
    brain:
      provider: deepseek
      model: deepseek-reasoner
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1
      max_tokens: 8192
      context:
        max_tokens: 64000
        strategy: summarize
        keep_recent: 6
        auto_compact: true
    system_prompt: "{{prompt.worker}}"

  - id: explore
    role: specialist
    specialty: "Fast read-only codebase exploration"
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.0
      max_tokens: 4096
    system_prompt: "{{prompt.explore}}"
    modules:
      - {filesystem: [read, grep, glob]}
      - {shell: [bash]}
      - {memory: [remember]}

  - id: plan
    role: specialist
    specialty: "Architecture and implementation planning. Read-only."
    brain:
      provider: deepseek
      model: deepseek-reasoner
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.1
      max_tokens: 8192
    system_prompt: "{{prompt.plan}}"
    modules:
      - {filesystem: [read, grep, glob]}
      - {shell: [bash]}
      - {memory: [remember]}

  - id: verification
    role: specialist
    specialty: "Adversarial testing — tries to break implementations"
    brain:
      provider: deepseek
      model: deepseek-reasoner
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.0
      max_tokens: 8192
      context:
        max_tokens: 64000
        strategy: summarize
        keep_recent: 6
        auto_compact: true
    system_prompt: "{{prompt.verification}}"
    modules:
      - {filesystem: [read, grep, glob]}
      - {shell: [bash]}
      - {memory: [remember]}
      - {web: [search, fetch]}

# ─────────────────────────────────────────────────────────────────────
# EXECUTION
# ─────────────────────────────────────────────────────────────────────

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: direct
  direct_modules: [filesystem, shell, memory, web]
  greeting: |
    Ready. What are we working on?
  workspace: ""
  project_memory: auto
  max_turns: 200
  timeout: 3600
  hooks: []

# ─────────────────────────────────────────────────────────────────────
# CAPABILITIES
# ─────────────────────────────────────────────────────────────────────

capabilities:
  default_policy: block
  max_risk_level: high
  grant:
    - module: filesystem
      actions: [read, write, edit, grep, glob]
    - module: shell
      actions: [bash]
    - module: memory
      actions: [set_goal, remember, task_create, task_update]
    - module: web
      actions: [search, fetch, extract, download]
    - module: lsp
      actions: [diagnostics, check, notify_change]
    - module: agent_spawn
      actions: [agent]
    - module: context_builder
      actions: [ask_user]

# ─────────────────────────────────────────────────────────────────────
# BEHAVIOR — Supreme Coach + declarative rules + state tracking
# ─────────────────────────────────────────────────────────────────────

behavior:
  profile: "{{behavior.clone}}"

  classify_turns: true

  # Dedicated fast brain for the Supreme Coach — runs every turn.
  # Default: deepseek-chat (V3, cheap, consistent stack).
  # Alternative for max showcase: claude-haiku-4-5 (Anthropic RLHF baked in).
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    config:
      api_key: "{{env.DEEPSEEK_API_KEY}}"
      base_url: "https://api.deepseek.com/v1"
    temperature: 0.2
    max_tokens: 2048

  classifier:
    frequency: every_turn
    skip_followups: true
    timeout: 25

    # Supreme Coach prompt — 350+ lines of per-turn coaching
    system_prompt: "{{prompt.supreme_coach}}"

    context:
      tool_inventory: true
      session_state: true
      workspace_info: true
      recent_history: true
      history_depth: 12

    complexity_levels:
      - name: trivial
        when: "Question or 1 action, obvious answer"
        behavior: "Answer in 1 sentence. 1-2 tool calls max. NO TaskCreate."
      - name: simple
        when: "Single file edit with clear target"
        behavior: "Read → Edit → verify by reading back → run test if exists."
      - name: moderate
        when: "Multi-file change within one module (3-5 files)"
        behavior: "Grep/Glob to locate → state plan in text → implement → test between phases."
      - name: complex
        when: "Cross-cutting or 5+ files or multiple subsystems"
        behavior: "Explore via sub-agents first → detailed plan → AskUser approval → TaskCreate per phase → implement → verify."
      - name: critical
        when: "Destructive, migrations, security, production"
        behavior: "ALWAYS AskUser first. Explain risks. Get explicit approval. Plan rollback."

    approaches:
      - name: direct
        label: "Execute directly"
        when: "Trivial/simple, clear path"
        behavior: "Tool calls directly. Minimal text. No plan needed."
      - name: explore_first
        label: "Explore then act"
        when: "Needs context before acting"
        behavior: "Glob/Grep for structure, Read 1-3 key files, then act."
      - name: plan_and_confirm
        label: "Plan then confirm"
        when: "3+ files or multiple valid approaches"
        behavior: "Numbered plan, list files, AskUser to confirm, THEN act."
      - name: delegate
        label: "Delegate to sub-agents"
        when: "5+ files or 2+ independent parts"
        behavior: "Launch parallel Agent(explore/worker), synthesize results."
      - name: research_first
        label: "Research first"
        when: "Unknown API, unfamiliar framework, ambiguous spec"
        behavior: "WebSearch or docs lookup BEFORE coding."

    risk_levels:
      - name: none
        when: "Read-only, questions, exploration"
      - name: low
        when: "Small edits, new files, safe commands"
      - name: medium
        when: "Multi-file edits, dependency changes, config mods"
        behavior: "State what's changing and why, in one sentence."
      - name: high
        when: "Deletions, migrations, force pushes, production configs"
        behavior: "MUST AskUser first with exact target. Explain what could go wrong."

    max_directives: 5
    directive_prefix: "[SUPREME COACH — {complexity} complexity, {risk} risk, approach: {approach_label}]"
    high_risk_threshold: medium
    high_risk_warning: "Risk level: {risk}. Confirm destructive or irreversible actions with the user via AskUser before proceeding."
    directive_footer: |
      Follow these directives. They compensate DeepSeek-R1's known gaps vs Claude Opus.
      Violations are detected in real-time by the behavior engine.

  # ───────────────────────────────────────────────────────────────
  # Declarative rule definitions — enforced at runtime
  # ───────────────────────────────────────────────────────────────
  rule_definitions:

    - id: read_before_edit
      description: "Always Read a file before Edit"
      trigger: [edit, filesystem.edit]
      when: pre_tool
      action: warn
      condition:
        target_not_in_set: read_files
      message: "You have not Read '{target}' in this session. Read it first — you need the exact current content for Edit."

    - id: block_destructive
      description: "Block irreversible operations"
      trigger: [bash, shell.bash]
      when: pre_tool
      action: block
      condition:
        param_matches:
          param: command
          pattern: "(rm\\s+-rf|git\\s+reset\\s+--hard|git\\s+push\\s+(--force|-f\\b)|drop\\s+table|truncate\\s+table|git\\s+clean\\s+-fd)"
      message: "BLOCKED: Destructive command '{param:command}'. Use AskUser(question='Confirm...', choices=['Yes','No']) with the exact target before proceeding."

    - id: use_tools_not_bash
      description: "Use Read/Edit/Grep/Glob instead of bash cat/sed/find"
      trigger: [bash, shell.bash]
      when: pre_tool
      action: warn
      condition:
        param_matches:
          param: command
          pattern: "\\b(cat|head|tail|sed\\s+-|awk|less|more)\\s"
      message: "Don't use Bash '{param:command}' for file operations. Use Read/Edit — they are tracked and support fuzzy matching."

    - id: no_blind_ls_find
      description: "Use Glob instead of bash ls/find/tree"
      trigger: [bash, shell.bash]
      when: pre_tool
      action: warn
      condition:
        param_matches:
          param: command
          pattern: "(ls\\s+-[lRa]|find\\s+\\.\\s|tree\\b)"
      message: "Use Glob('**/*.py') instead of '{param:command}' — structured output, tracked, single round-trip."

    - id: search_before_bulk_reads
      description: "Grep before reading 3+ files"
      trigger: [read, filesystem.read]
      when: pre_tool
      action: warn
      condition:
        all:
          - target_not_in_set: read_files
          - counter_gte:
              name: reads_since_search
              value: 3
      message: "You read {counter:reads_since_search} files without searching. Use Grep('pattern') to locate, then Read the specific section."

    - id: test_after_edits
      description: "Run tests after 2+ changes"
      trigger: [edit, write, filesystem.edit, filesystem.write]
      when: post_tool
      action: remind
      condition:
        counter_gte:
          name: changes_since_test
          value: 2
      message: "You made {counter:changes_since_test} changes since last test run. Run pytest / npm test / cargo test NOW to catch regressions."

    - id: verify_after_edit
      description: "Read the modified section after Edit"
      trigger: [edit, filesystem.edit]
      when: post_tool
      action: remind
      condition: {}
      message: "You edited '{target}'. Read back the modified section to verify the change is correct."

    - id: plan_before_tools
      description: "State the plan in text before tool calls"
      trigger: "*"
      when: pre_tool
      action: warn
      condition:
        all:
          - first_tool_this_turn: true
          - no_text_before_tools: true
      message: "State what you're about to do in one sentence before calling tools. The user sees your text, not your tool params."

    - id: no_speculation_without_reading
      description: "Don't speculate about code you haven't read"
      trigger: "*"
      when: on_text
      action: warn
      condition:
        text_matches: "\\b(probably|might be|I think|maybe|likely)\\s+(the|a|an|this|it|function|class|file|method|returns|does)"
      message: "You're speculating. Read the actual code with Read/Grep before making factual claims."

    - id: break_tool_repetition
      description: "Stop repeating the same tool 6+ times"
      trigger: "*"
      when: pre_tool
      action: warn
      condition:
        consecutive_gte: 6
      message: "You called '{tool}' {consecutive_same_tool} times in a row. Step back — parallelize, delegate, or switch approach."

    - id: no_unverified_done
      description: "Don't claim done/fixed/complete without recent test run"
      trigger: "*"
      when: on_text
      action: warn
      condition:
        all:
          - text_matches: "\\b(done|fixed|complete|working now|should work|task complete|all set|looks good)\\b"
          - counter_gte:
              name: changes_since_test
              value: 1
      message: "You're claiming success but made {counter:changes_since_test} changes without running tests. Run the test command NOW, or state explicitly 'no verification possible' before declaring done."

    - id: always_lint_check
      description: "Flag lint errors in edit/write results"
      trigger: [edit, write, filesystem.edit, filesystem.write]
      when: post_tool
      action: warn
      condition:
        result_has_lint_errors: true
      message: "Lint errors detected in your last change. Fix them before moving on — don't accumulate technical debt."

    - id: delegate_on_bulk_reads
      description: "Delegate to explore agent after 5+ reads"
      trigger: [read, filesystem.read]
      when: post_tool
      action: remind
      condition:
        counter_gte:
          name: reads_since_search
          value: 5
      message: "You're reading many files sequentially. Delegate bulk exploration to Agent(specialist='explore', prompt='<detailed>') to protect your context."

  # ───────────────────────────────────────────────────────────────
  # State tracking — what the rules observe
  # ───────────────────────────────────────────────────────────────
  state_tracking:
    sets:
      read_files:
        add_on: [read, filesystem.read]
        target: file_path
        aliases: [path, filepath]
      edited_files:
        add_on: [edit, filesystem.edit]
        target: file_path
        aliases: [path]
      written_files:
        add_on: [write, filesystem.write]
        target: file_path
        aliases: [path]
      searched_patterns:
        add_on: [grep, glob, filesystem.grep, filesystem.glob]
        target: pattern
    counters:
      reads_since_search:
        increment_on: [read, filesystem.read]
        reset_on: [grep, glob, filesystem.grep, filesystem.glob]
      changes_since_test:
        increment_on: [edit, write, filesystem.edit, filesystem.write]
        reset_on: []
        reset_when:
          tool: bash,shell.bash
          param: command
          matches: "\\b(pytest|py\\.test|npm\\s+test|npx\\s+jest|cargo\\s+test|go\\s+test|make\\s+test|python\\s+-m\\s+pytest|node\\s+--test|vitest|mocha|rspec|phpunit)\\b"
    flags:
      has_explored:
        set_on: [grep, glob, filesystem.grep, filesystem.glob]
      has_tested:
        set_on: [bash, shell.bash]
