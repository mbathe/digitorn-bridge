# Digitorn Clone — Claude Opus clone
#
# Ultra-powerful coding assistant emulating Claude Code / Claude Opus
# via DeepSeek-R1 (executor) + DeepSeek-chat (Supreme Coach / classifier).
# The Supreme Coach compensates DeepSeek's gaps vs Opus on every turn.

[package]
id = "digitorn-clone"
name = "Digitorn Clone"
version = "1.0.0"
description = "Claude Opus clone — DeepSeek-R1 + Supreme Coach classifier + 12 declarative behavior rules."
author = "Digitorn"
license = "MIT"
category = "developer-tools"

[package.source]
type = "official"
verified = true
publisher = "digitorn"

[package.compatibility]
digitorn_min = ">=1.0.0"

[package.requirements]
modules = ["filesystem", "shell", "lsp", "memory", "web", "agent_spawn", "context_builder", "behavior"]
recommended_models = ["deepseek-reasoner", "deepseek-chat"]
external_tools = ["git"]

[package.credentials]
required = ["deepseek"]
optional = []

[package.permissions]
risk_level = "high"
network_access = true
filesystem_access = ["read", "write"]
filesystem_scopes = ["workspace"]
requires_approval = ["filesystem.write", "filesystem.edit", "shell.bash"]

[package.hub]
tags = ["coding", "multi-agent", "behavior", "coach", "deepseek", "claude-clone", "official"]

[package.release]
released_at = "2026-04-20"
release_notes = "Initial release — DeepSeek-R1 executor + Supreme Coach classifier, 12 rules, 5 specialists."
breaking = false
