app:
  app_id: digitorn-builder
  name: Digitorn App Builder
  version: 1.0.0
  description: Conversational agent that helps you build Digitorn apps from natural
    language.
  icon: 🛠️
  color: '#6366F1'
  category: developer-tools
  author: Digitorn
  tags:
  - builder
  - conversational
  - rag
  - code-generation
  - multi-agent-author
  quick_prompts:
  - label: From scratch
    icon: ✨
    message: I want to build an app that
  - label: From a template
    icon: 📋
    message: Show me the available templates
  - label: Resume my last draft
    icon: 📂
    message: Show me my drafts
  - label: Just explore
    icon: 🔍
    message: What can Digitorn do?
runtime:
  mode: conversation
  entry_agent: builder
  max_turns: 200
  timeout: 3600
  hooks:
  - id: compile_on_app_yaml_write
    'on': tool_end
    condition:
      type: all_of
      conditions:
      - type: tool_name
        match:
        - workspace.write
        - workspace.edit
      - type: not
        condition:
          type: tool_failed
    action:
      type: compile_yaml
      only_path: app.yaml
      inject_result: true
agents:
- id: builder
  role: coordinator
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    credential:
      ref: deepseek_main
      scope: per_user
      provider: deepseek
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    temperature: 0.6
    max_tokens: 8192
    context:
      max_tokens: 200000
      strategy: summarize
      keep_recent: 12
      auto_compact: true
    fallback:
      provider: anthropic
      model: claude-sonnet-4-6
      config:
        api_key: claude-code
      temperature: 0.6
      max_tokens: 8192
  plan_first: false
  system_prompt: '{{prompt.coordinator}}'
- id: architect
  role: specialist
  specialty: Turn a Spec into a compilable Digitorn app.yaml
  brain:
    provider: deepseek
    model: deepseek-reasoner
    backend: openai_compat
    credential:
      ref: deepseek_main
      scope: per_user
      provider: deepseek
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    temperature: 0.6
    max_tokens: 8192
    context:
      max_tokens: 200000
      strategy: summarize
      keep_recent: 6
      auto_compact: true
    fallback:
      provider: anthropic
      model: claude-sonnet-4-6
      config:
        api_key: claude-code
      temperature: 0.6
      max_tokens: 8192
  plan_first: false
  system_prompt: '{{prompt.architect}}'
  modules:
  - dev_tools:
    - app
  - workspace:
    - read
  - rag:
    - query
    - multi_query
    - list_knowledge_bases
- id: compiler
  role: specialist
  specialty: Compile YAML and fix schema errors until clean
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    credential:
      ref: deepseek_main
      scope: per_user
      provider: deepseek
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    temperature: 0.2
    max_tokens: 8192
    context:
      max_tokens: 128000
      strategy: summarize
      keep_recent: 8
      auto_compact: true
    fallback:
      provider: anthropic
      model: claude-haiku-4-5
      config:
        api_key: claude-code
      temperature: 0.2
      max_tokens: 8192
  plan_first: false
  system_prompt: '{{prompt.compiler}}'
  modules:
  - dev_tools:
    - app
  - workspace:
    - write
    - read
    - edit
  - rag:
    - query
    - multi_query
    - list_knowledge_bases
- id: tester
  role: specialist
  specialty: Deploy + smoke-test a compiled Digitorn app
  brain:
    provider: deepseek
    model: deepseek-chat
    backend: openai_compat
    credential:
      ref: deepseek_main
      scope: per_user
      provider: deepseek
    config:
      api_key: '{{env.DEEPSEEK_API_KEY}}'
    temperature: 0.3
    max_tokens: 4096
    context:
      max_tokens: 64000
      strategy: truncate
      keep_recent: 6
      auto_compact: true
    fallback:
      provider: anthropic
      model: claude-haiku-4-5
      config:
        api_key: claude-code
      temperature: 0.3
      max_tokens: 4096
  plan_first: false
  system_prompt: '{{prompt.tester}}'
  modules:
  - dev_tools:
    - app
    - chat
    - run
tools:
  modules:
    rag:
      config:
        backend:
          type: qdrant
          path: ./.digitorn/knowledge_base/.qdrant
    http:
      config:
        timeout: 30
      constraints:
        allowed_hosts:
        - localhost
        - 127.0.0.1
    memory:
      config:
        working_memory: true
        todo_list: true
        runtime:
          goal_guardian: true
    context_builder: {}
    preview: {}
    web_preview: {}
    shell: {}
    dev_tools: {}
    agent_spawn: {}
    workspace:
      config:
        render_mode: builder
        entry_file: app.yaml
        title: Digitorn App Builder
        sync_to_disk: true
        instructions: 'You are building a Digitorn app.yaml. Write the YAML being
          built

          to "app.yaml" - the client renders the architecture graph live

          from the YAML structure (modules, agents, triggers, capabilities).


          ── HOW THE LIVE PREVIEW WORKS ───────────────────────────────


          The client has an n8n-style canvas that AUTOMATICALLY derives

          the graph from your app.yaml. You do NOT need to create graph

          nodes/edges manually. Just write app.yaml and the client

          renders: triggers → app → agents → modules with edges based

          on capabilities.grant.


          Click on any node in the canvas to see its full config.


          ── FILES YOU WRITE ──────────────────────────────────────────


          app.yaml is the ONLY file you write. The client parses it and

          renders the architecture graph. Every time you write or edit

          app.yaml, the graph updates.


          Pipeline progress (interview → architect → compile → test) is

          tracked via TaskCreate / TaskUpdate - the client reads tasks

          from the memory panel. No state files, no JSON blobs on disk.


          ── RULES ────────────────────────────────────────────────────


          - ALWAYS write app.yaml - it drives the entire preview

          - Use workspace.edit for surgical changes to app.yaml

          - Use workspace.write for full rewrites

          - Track pipeline phases with TaskCreate/TaskUpdate, not files

          '
  capabilities:
    default_policy: block
    max_risk_level: medium
    grant:
    - module: rag
      actions:
      - query
      - multi_query
      - list_knowledge_bases
      - knowledge_base_stats
    - module: http
      actions:
      - get
      - post
      - json_api
    - module: memory
      actions:
      - set_goal
      - remember
      - task_create
      - task_update
    - module: context_builder
      actions:
      - ask_user
      - use_skill
    - module: workspace
      actions:
      - write
      - read
      - edit
      - glob
      - grep
      - delete
    - module: shell
      actions:
      - bash
    - module: dev_tools
      actions:
      - app
      - chat
      - run
    - module: agent_spawn
      actions:
      - agent
ui:
  greeting: '👋 Hi! I''m the Digitorn App Builder.


    I help you design, validate, and deploy Digitorn apps from a

    plain-English description - no need to know the YAML schema by

    heart.


    Tell me what you want your app to do, in one sentence. I''ll ask

    a few clarifying questions, propose a working YAML, validate it

    against the live daemon, and save it as a draft you can deploy

    when you''re ready.

    '
  workspace:
    render_mode: builder
    entry_file: app.yaml
    title: Digitorn App Builder
