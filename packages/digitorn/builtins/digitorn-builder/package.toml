# Digitorn Builder — Build Digitorn apps from natural language
#
# A conversational meta-app that helps users design, validate, and
# deploy Digitorn apps without writing YAML by hand. Powered by the
# 3-collection RAG (concepts / modules / examples), the discovery
# API, and the build-draft store.

[package]
id = "digitorn-builder"
name = "Digitorn App Builder"
version = "1.0.0"
description = "Conversational agent that helps you build Digitorn apps from a natural-language description."
author = "Digitorn"
license = "MIT"
icon = "icon.png"
category = "developer-tools"

[package.source]
type = "official"
verified = true
publisher = "digitorn"

[package.compatibility]
digitorn_min = ">=1.0.0"

[package.requirements]
modules = ["rag", "http", "memory", "filesystem", "context_builder"]
recommended_models = ["claude-sonnet-4-5", "claude-opus-4-6"]

[package.credentials]
required = []
optional = []

[package.permissions]
risk_level = "medium"
network_access = true
filesystem_access = ["read", "write"]
filesystem_scopes = ["workspace"]
requires_approval = []

[package.hub]
tags = ["builder", "developer", "rag", "code-generation", "official"]

[package.release]
released_at = "2026-04-13"
release_notes = "Initial built-in release."
breaking = false
