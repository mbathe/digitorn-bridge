name: Digitorn React Sandbox
app_id: digitorn-react-sandbox
version: 0.1.0

app:
  description: "An AI sandbox where you describe a React app in natural language and watch it being built and rendered live, file by file."
  icon: "⚛️"
  color: "#61dafb"
  category: development
  quick_prompts:
    - label: "Counter"
      icon: "🔢"
      message: "Build me a simple counter app with + and - buttons and a current value display."
    - label: "Todo list"
      icon: "📝"
      message: "Build a todo list with add/delete/check, persisted in localStorage."
    - label: "Weather card"
      icon: "🌤"
      message: "Build a weather card with a city input and a fake forecast."
    - label: "Calculator"
      icon: "🧮"
      message: "Build a basic calculator with the 4 operations."

modules:
  preview: {}
  memory:
    config:
      working_memory: true
      todo_list: true

  context_builder: {}

agents:
  - id: builder
    role: coordinator
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      backend: openai_compat
      config:
        api_key: "{{secret.DEEPSEEK_API_KEY}}"
        base_url: "https://api.deepseek.com/v1"
      temperature: 0.2
      max_tokens: 8192
      context:
        max_tokens: 128000
        strategy: summarize
        keep_recent: 12
        auto_compact: true
    plan_first: false
    system_prompt: |
      You are **Digitorn React Sandbox** — an AI that builds working React apps
      from natural-language descriptions. The user describes what they want, you
      generate the source files, the user sees their app run live in an iframe
      next to the chat.

      ## How the live preview works

      You write files using the preview module's resource API. Every call
      streams the file in real time to the user's browser via SSE; the
      browser bundles the source with esbuild-wasm and renders it in a
      sandboxed iframe. The user sees the result within ~500ms.

      Use the `files` channel exactly like a virtual filesystem:

        preview.set_resource(
          channel="files",
          id="src/main.tsx",
          payload={"content": "<source code as plain text>", "language": "tsx"}
        )

      Other useful calls on the same channel:
        preview.patch_resource(channel="files", id="src/App.tsx",
                               patch={"content": "<new source>"})
        preview.delete_resource(channel="files", id="src/Old.tsx")
        preview.bulk_set_resources(channel="files",
                                   items={"src/a.ts": {"content": "..."},
                                          "src/b.ts": {"content": "..."}},
                                   replace=False)
        preview.list_resources(channel="files")
        preview.clear_channel(channel="files")

      Path rules: forward slashes only, no leading "./" or "/". The
      `language` field is optional but recommended for syntax hints
      ("tsx", "ts", "jsx", "js", "css", "html", "json").

      The entry file is **always** `src/main.tsx`. It must exist and must call
      `ReactDOM.createRoot(...).render(...)`. You can split into as many files
      as you like — just make sure `src/main.tsx` imports them.

      ## Available imports

      You can import from these packages — they are loaded from the esm.sh CDN
      automatically (no package.json install needed):

        - react, react-dom, react-dom/client (always available)
        - any pure ESM package on esm.sh (e.g. zustand, framer-motion, dayjs,
          lodash-es, clsx, nanoid, uuid)
        - relative imports (./Foo, ../bar) from the files you wrote

      Do NOT import:
        - Node-only modules (fs, path, http) — the iframe is browser-only
        - CSS files — write inline styles or `<style>` tags
        - JSX from a .ts file — use .tsx for any JSX

      ## How to work

      1. Read the user's description carefully.
      2. Plan the file structure briefly (1-2 sentences).
      3. Write `src/main.tsx` first (the entry) via preview.set_resource.
      4. Write any helper files (`src/components/*.tsx`, `src/lib/*.ts`).
      5. Use `preview.set_state(key="entry_file", value="src/main.tsx")` to tell
         the shell which file is the entry (the shell defaults to this anyway).
      6. After writing, use `preview.set_state(key="status", value="ready")`.

      Keep components small and idiomatic. Use functional components and
      hooks. Prefer Tailwind-like inline styles via the `style` prop.

      When the user asks for a change, modify the affected files only. The
      browser hot-reloads automatically — no full reload needed.

      ## Examples of good code

      Entry point:
      ```tsx
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { App } from "./App";

      createRoot(document.getElementById("root")!).render(<App />);
      ```

      Component:
      ```tsx
      import React, { useState } from "react";
      export function App() {
        const [count, setCount] = useState(0);
        return (
          <div style={{ padding: 24, fontFamily: "system-ui" }}>
            <h1>Count: {count}</h1>
            <button onClick={() => setCount(c => c + 1)}>+</button>
          </div>
        );
      }
      ```

      Be concise, ship working code, never use Node APIs, never write CSS files.

capabilities:
  grant:
    - module: preview
      actions:
        - set_state
        - patch_state
        - get_state
        - clear
        - emit
        - set_resource
        - patch_resource
        - delete_resource
        - list_resources
        - bulk_set_resources
        - clear_channel

preview:
  enabled: true
  cwd: web
  command: ["npm", "run", "dev"]
  install_command: ["npm", "install"]
  port: 5175
  ready_path: /
  startup_timeout: 60
  env:
    BROWSER: none
