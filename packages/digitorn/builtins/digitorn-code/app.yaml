app:
  app_id: digitorn-code
  name: Digitorn Code
  short_name: Code
  version: 6.0.0
  description: Claude Code replica - DeepSeek-V4-Pro + Supreme Coach + 5 specialists.
    Production coding on any project.
  icon: 💻
  color: '#10B981'
  category: coding
  author: Digitorn
  tags:
  - coding
  - multi-agent
  - claude-code
  - deepseek-v4
  - coach
  - behavior
  quick_prompts:
  - label: Fix a bug
    icon: 🐛
    message: 'Find and fix this bug:'
  - label: Add a feature
    icon: ✨
    message: 'Implement the following feature:'
  - label: Review code
    icon: 🔍
    message: Review this codebase for issues and improvements
  - label: Write tests
    icon: 🧪
    message: Analyze the project and write missing tests
  - label: Refactor
    icon: ♻️
    message: 'Refactor for clarity:'
  - label: Explain architecture
    icon: 📖
    message: Explain how this codebase works, starting with the architecture
runtime:
  mode: conversation
  workdir_mode: required
  tool_injection: direct
  direct_modules:
  - filesystem
  - shell
  - memory
  - web
  - lsp
  workdir: ''
  project_memory: auto
  max_turns: 200
  timeout: 3600
  modes:
    ask:
      label: Ask
      description: Read-only Q&A, no writes
      icon: lightbulb
      accent: cyan
      max_turns: 8
      workspace_mode: none
      system_prompt: |
        Mode: Ask. Answer the user's question directly. Do NOT write or edit
        files, do NOT run shell commands. Read-only investigation only.
      tool_grants:
      - module: filesystem
        actions: [read, glob, grep]
      - module: lsp
        actions: [diagnostics, symbols]
      - module: web
        actions: [search, fetch]
      - module: memory
        actions: [recall, todo_list]
      behavior_profile: assistant
    plan:
      label: Plan
      description: Design first, edit only after the user approves
      icon: map
      accent: purple
      max_turns: 30
      system_prompt: |
        Mode: Plan. Read the codebase, then propose a step-by-step plan in
        plain text BEFORE touching any file. Do not write code until the
        user explicitly approves the plan.
      behavior_profile: coding
    auto:
      label: Auto
      description: Full-autonomy coding loop
      icon: sparkles
      accent: green
  hooks: []
agents:
- id: main
  role: coordinator
  brain:
    # github_copilot / gpt-5-mini relay (same proven config as
    # digitorn-scribe). The placeholder api_key is hot-swapped at
    # session start by the gateway resolver against the user's Copilot
    # creds. Tested working in the user's local setup.
    provider: github_copilot
    backend: github_copilot
    model: gpt-5-mini
    config:
      api_key: placeholder
    temperature: 0.3
    max_tokens: 8192
    context:
      max_tokens: 131072
      strategy: summarize
      keep_recent: 10
      auto_compact: true
  plan_first: false
  system_prompt: '{{prompt.system}}'
  pool:
    max_workers: 5
- id: worker
  role: specialist
  specialty: Implementation - research, code, test, commit
  brain:
    # github_copilot relay (same proven config as the main agent).
    # Placeholder api_key is hot-swapped at session start by the
    # gateway resolver against the user's Copilot creds.
    provider: github_copilot
    backend: github_copilot
    model: gpt-5-mini
    config:
      api_key: placeholder
    temperature: 0.3
    max_tokens: 8192
    context:
      max_tokens: 131072
      strategy: summarize
      keep_recent: 10
      auto_compact: true
  system_prompt: '{{prompt.worker}}'
- id: explore
  role: specialist
  specialty: Fast read-only codebase exploration
  brain:
    provider: github_copilot
    backend: github_copilot
    model: gpt-5-mini
    config:
      api_key: placeholder
    temperature: 0.0
    max_tokens: 4096
    context:
      max_tokens: 131072
      strategy: summarize
      keep_recent: 8
      auto_compact: true
  system_prompt: '{{prompt.explore}}'
  modules:
  - filesystem:
    - read
    - grep
    - glob
  - shell:
    - bash
  - memory:
    - remember
- id: plan
  role: specialist
  specialty: Architecture and implementation planning. Read-only.
  brain:
    provider: github_copilot
    backend: github_copilot
    model: gpt-5-mini
    config:
      api_key: placeholder
    temperature: 0.1
    max_tokens: 8192
    context:
      max_tokens: 131072
      strategy: summarize
      keep_recent: 10
      auto_compact: true
  system_prompt: '{{prompt.plan}}'
  modules:
  - filesystem:
    - read
    - grep
    - glob
  - shell:
    - bash
  - memory:
    - remember
- id: verification
  role: specialist
  specialty: Adversarial testing - tries to break implementations
  brain:
    provider: github_copilot
    backend: github_copilot
    model: gpt-5-mini
    config:
      api_key: placeholder
    temperature: 0.0
    max_tokens: 8192
    context:
      max_tokens: 131072
      strategy: summarize
      keep_recent: 8
      auto_compact: true
  system_prompt: '{{prompt.verification}}'
  modules:
  - filesystem:
    - read
    - grep
    - glob
  - shell:
    - bash
  - memory:
    - remember
  - web:
    - search
    - fetch
tools:
  modules:
    filesystem: {}
    shell: {}
    lsp:
      config:
        python: ruff check --output-format=json --select=E,F,W,I,N,UP,B,A,C4,SIM,RUF
    memory:
      config:
        working_memory: true
        todo_list: true
        runtime:
          goal_guardian: true
    web:
      config:
        search_backend: duckduckgo
  capabilities:
    default_policy: block
    max_risk_level: high
    grant:
    - module: filesystem
      actions:
      - read
      - grep
      - glob
      - write
      - edit
    - module: shell
      actions:
      - bash
    - module: memory
      actions:
      - set_goal
      - remember
      - task_create
      - task_update
    - module: web
      actions:
      - search
      - fetch
      - extract
      - download
    - module: lsp
      actions:
      - diagnostics
      - check
      - notify_change
    - module: agent_spawn
      actions:
      - agent
    - module: context_builder
      actions:
      - ask_user
security:
  behavior:
    profile: '{{behavior.code}}'
    classify_turns: true
    brain:
      # github_copilot relay for the per-turn classifier (small,
      # frequent call -- keep the brain uniform with the rest of the
      # app so creds + quota are shared).
      provider: github_copilot
      backend: github_copilot
      model: gpt-5-mini
      config:
        api_key: placeholder
      temperature: 0.2
      max_tokens: 2048
    classifier:
      frequency: every_turn
      skip_followups: true
      timeout: 25
      system_prompt: '{{prompt.code_coach}}'
      context:
        tool_inventory: true
        session_state: true
        workspace_info: true
        recent_history: true
        history_depth: 12
      complexity_levels:
      - name: trivial
        when: Question or 1 action, obvious answer
        behavior: Answer in 1 sentence. 1-2 tool calls max. NO TaskCreate.
      - name: simple
        when: Single file edit with clear target
        behavior: Read → Edit → verify. No planning overhead.
      - name: moderate
        when: Multi-file change within one module (3-5 files)
        behavior: Glob/Grep to locate → state plan in text → implement → test.
      - name: complex
        when: Cross-cutting or 5+ files or multiple subsystems
        behavior: Explore via sub-agents first → detailed plan → AskUser → TaskCreate
          per phase → fan-out workers → verify.
      - name: critical
        when: Destructive, migrations, security, production
        behavior: ALWAYS AskUser first. Plan rollback. Get explicit approval.
      approaches:
      - name: direct
        label: Execute directly
        when: Trivial/simple, clear path
        behavior: Tool calls directly. Minimal text.
      - name: explore_first
        label: Explore then act
        when: Needs context before acting
        behavior: Glob/Grep for structure, Read 1-3 key files, then act.
      - name: plan_and_confirm
        label: Plan then confirm
        when: 3+ files or multiple valid approaches
        behavior: Numbered plan in text, AskUser to validate, THEN TaskCreate per
          phase.
      - name: delegate
        label: Delegate to sub-agents
        when: 5+ files or 2+ independent parts
        behavior: Fan-out Agent(explore/worker) in ONE message. Synthesize results.
      - name: research_first
        label: Research first
        when: Unknown API, unfamiliar framework, ambiguous spec
        behavior: WebSearch or WebFetch docs BEFORE coding.
      risk_levels:
      - name: none
        when: Read-only, questions, exploration
      - name: low
        when: Small edits, new files, safe commands
      - name: medium
        when: Multi-file edits, dependency changes, config mods
        behavior: State what's changing and why, in one sentence.
      - name: high
        when: Deletions, migrations, force pushes, production configs
        behavior: MUST AskUser with exact target. Explain what could go wrong.
      max_directives: 5
      directive_prefix: '[SUPREME COACH - {complexity} complexity, {risk} risk, approach:
        {approach_label}]'
      high_risk_threshold: medium
      high_risk_warning: 'Risk: {risk}. AskUser before destructive / irreversible
        actions.'
      directive_footer: 'Follow these directives. They calibrate DeepSeek-V4 to match
        Claude Code discipline on EVERY turn.

        Runtime behavior rules will block actual violations - the directives set the
        strategic tone.

        '
    rule_definitions:
    - id: read_before_edit
      description: Always Read a file before Edit
      trigger:
      - edit
      - filesystem.edit
      when: pre_tool
      action: warn
      condition:
        target_not_in_set: read_files
      message: You have not Read '{target}' in this session. Read it first - you need
        the exact current content for Edit.
    - id: block_destructive
      description: Block irreversible operations
      trigger:
      - bash
      - shell.bash
      when: pre_tool
      action: block
      condition:
        param_matches:
          param: command
          pattern: (rm\s+-rf|git\s+reset\s+--hard|git\s+push\s+(--force|-f\b)|drop\s+table|truncate\s+table|git\s+clean\s+-fd)
      message: 'BLOCKED: Destructive command ''{param:command}''. Use AskUser(question=''Confirm...'',
        choices=[''Yes'',''No'']) with the exact target before proceeding.'
    - id: use_tools_not_bash
      description: Use Read/Edit/Grep/Glob instead of bash cat/sed/find
      trigger:
      - bash
      - shell.bash
      when: pre_tool
      action: warn
      condition:
        param_matches:
          param: command
          pattern: \b(cat|head|tail|sed\s+-|awk|less|more)\s
      message: Don't use Bash '{param:command}' for file operations. Use Read/Edit
        - they are tracked and support fuzzy matching.
    - id: no_blind_ls_find
      description: Use Glob instead of bash ls/find/tree
      trigger:
      - bash
      - shell.bash
      when: pre_tool
      action: warn
      condition:
        param_matches:
          param: command
          pattern: (ls\s+-[lRa]|find\s+\.\s|tree\b)
      message: Use Glob('**/*.py') instead of '{param:command}' - structured output,
        tracked, single round-trip.
    - id: search_before_bulk_reads
      description: Grep before reading 3+ files
      trigger:
      - read
      - filesystem.read
      when: pre_tool
      action: warn
      condition:
        all:
        - target_not_in_set: read_files
        - counter_gte:
            name: reads_since_search
            value: 3
      message: You read {counter:reads_since_search} files without searching. Use
        Grep('pattern') to locate, then Read the specific section.
    - id: test_after_edits
      description: Run tests after 2+ changes
      trigger:
      - edit
      - write
      - filesystem.edit
      - filesystem.write
      when: post_tool
      action: remind
      condition:
        counter_gte:
          name: changes_since_test
          value: 2
      message: You made {counter:changes_since_test} changes since last test run.
        Run the project test command NOW to catch regressions.
    - id: verify_after_edit
      description: Read the modified section after Edit
      trigger:
      - edit
      - filesystem.edit
      when: post_tool
      action: remind
      condition: {}
      message: You edited '{target}'. Read back the modified section to verify the
        change is correct.
    - id: plan_before_tools
      description: State the plan in text before tool calls
      trigger: '*'
      when: pre_tool
      action: warn
      condition:
        all:
        - first_tool_this_turn: true
        - no_text_before_tools: true
      message: State what you're about to do in one sentence before calling tools.
        The user sees your text, not your tool params.
    - id: no_speculation_without_reading
      description: Don't speculate about code you haven't read
      trigger: '*'
      when: on_text
      action: warn
      condition:
        text_matches: \b(probably|might be|I think|maybe|likely)\s+(the|a|an|this|it|function|class|file|method|returns|does)
      message: You're speculating. Read the actual code with Read/Grep before making
        factual claims.
    - id: break_tool_repetition
      description: Stop repeating the same tool 6+ times
      trigger: '*'
      when: pre_tool
      action: warn
      condition:
        consecutive_gte: 6
      message: You called '{tool}' {consecutive_same_tool} times in a row. Step back
        - parallelize, delegate, or switch approach.
    - id: no_unverified_done
      description: Don't claim done/fixed/complete without recent test run
      trigger: '*'
      when: on_text
      action: warn
      condition:
        all:
        - text_matches: \b(done|fixed|complete|working now|should work|task complete|all
            set|looks good)\b
        - counter_gte:
            name: changes_since_test
            value: 1
      message: You're claiming success but made {counter:changes_since_test} changes
        without running tests. Run the test command NOW, or state explicitly 'no verification
        possible' before declaring done.
    - id: always_lint_check
      description: Flag lint errors in edit/write results
      trigger:
      - edit
      - write
      - filesystem.edit
      - filesystem.write
      when: post_tool
      action: warn
      condition:
        result_has_lint_errors: true
      message: Lint errors detected in your last change. Fix them before moving on
        - don't accumulate technical debt.
    - id: delegate_on_bulk_reads
      description: Delegate to explore agent after 5+ reads
      trigger:
      - read
      - filesystem.read
      when: post_tool
      action: remind
      condition:
        counter_gte:
          name: reads_since_search
          value: 5
      message: You're reading many files sequentially. Delegate bulk exploration to
        Agent(specialist='explore', prompt='<detailed>') to protect your context.
    state_tracking:
      sets:
        read_files:
          add_on:
          - read
          - filesystem.read
          target: file_path
          aliases:
          - path
          - filepath
        edited_files:
          add_on:
          - edit
          - filesystem.edit
          target: file_path
          aliases:
          - path
        written_files:
          add_on:
          - write
          - filesystem.write
          target: file_path
          aliases:
          - path
        searched_patterns:
          add_on:
          - grep
          - glob
          - filesystem.grep
          - filesystem.glob
          target: pattern
      counters:
        reads_since_search:
          increment_on:
          - read
          - filesystem.read
          reset_on:
          - grep
          - glob
          - filesystem.grep
          - filesystem.glob
        changes_since_test:
          increment_on:
          - edit
          - write
          - filesystem.edit
          - filesystem.write
          reset_on: []
          reset_when:
            tool: bash,shell.bash
            param: command
            matches: \b(pytest|py\.test|npm\s+test|npx\s+jest|cargo\s+test|go\s+test|make\s+test|python\s+-m\s+pytest|node\s+--test|vitest|mocha|rspec|phpunit)\b
      flags:
        has_explored:
          set_on:
          - grep
          - glob
          - filesystem.grep
          - filesystem.glob
        has_tested:
          set_on:
          - bash
          - shell.bash
ui:
  greeting: 'Ready. What are we working on?

    '
  workspace:
    render_mode: code
    entry_file: README.md
    title: Your Project
    auto_open_on_first_tool: true
  # Coordinator app — fan-out delegated to Explore / Plan / etc.
  # Surfaces the Activity pane so the user can watch the
  # specialists run in real time and cancel any of them. Generic
  # by design: any new specialist declared in ``agents:`` will
  # appear by name (no hardcoded list).
  activity:
    enabled: true
    title: Activity
    show_running: true
    show_recent: true
    show_stats: true
    show_bg_tasks: true
    max_recent: 50
    auto_open_on_spawn: false
dev:
  skills:
  - command: /commit
    description: Smart git commit
    path: ./skills/commit.md
  - command: /review
    description: Code review
    path: ./skills/review.md
  - command: /pr
    description: Create pull request
    path: ./skills/pr.md
  - command: /test
    description: Detect and run tests
    path: ./skills/test.md
  - command: /init
    description: Detect project stack
    path: ./skills/init.md
  - command: /debug
    description: Systematic debugging
    path: ./skills/debug.md
  - command: /simplify
    description: Review changed code for reuse, quality, efficiency
    path: ./skills/simplify.md
  - command: /refactor
    description: Safe refactoring with test verification
    path: ./skills/refactor.md
