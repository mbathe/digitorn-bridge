# digitorn-code TEST variant — auto-approve everything for dev testing.
# Same as digitorn-code but with default_policy: auto (no approval popups).

app:
  app_id: digitorn-code-test
  name: "Digitorn Code (Test)"
  version: "5.0.0"
  description: "Auto-approve variant for dev CLI testing."
  icon: "🧪"
  color: "#10B981"
  category: "coding"
  author: "Digitorn"
  tags: [coding, test]

modules:
  filesystem: {}
  shell: {}
  memory:
    config:
      working_memory: true
      todo_list: true

agents:
  - id: main
    role: coordinator
    brain:
      provider: deepseek
      model: deepseek-chat
      backend: openai_compat
      config:
        api_key: "{{env.DEEPSEEK_API_KEY}}"
      temperature: 0.1
      max_tokens: 8192
      context:
        max_tokens: 128000
        strategy: summarize
        keep_recent: 6
        auto_compact: true
    plan_first: false
    system_prompt: |
      You are a coding assistant. Workspace: {WORKSPACE}

      Use dedicated tools — NEVER Bash for file operations:
      - Read files: Read (not cat/head)
      - Search content: Grep (not grep/rg)
      - Find files: Glob (not find/ls)
      - Edit files: Edit (not sed)
      - Create files: Write (not echo)

      Be concise. Go straight to the point.
    pool:
      max_workers: 3

execution:
  mode: conversation
  workspace_mode: required
  tool_injection: discovery
  direct_modules: [filesystem, shell, memory]
  greeting: "Ready."
  max_turns: 50
  timeout: 3600

# AUTO-APPROVE everything — no approval popups
capabilities:
  default_policy: auto
  max_risk_level: high
  grant:
    - module: filesystem
      actions: [read, write, edit, grep, glob]
    - module: shell
      actions: [bash]
    - module: memory
      actions: [set_goal, remember, task_create, task_update]
    - module: context_builder
      actions: [ask_user]
