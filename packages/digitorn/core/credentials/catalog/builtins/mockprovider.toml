[provider]
name         = "mockprovider"
display_name = "Mock OAuth Provider"
handler_type = "oauth2"
icon         = "key"
category     = "oauth"
description  = "Local mock OAuth provider. Auto-approves at /authorize so the full Connect flow can be exercised end-to-end without a real provider account. Wired to tests/mock_oauth_server.py on port 9998."
homepage     = "http://127.0.0.1:9998"

[oauth]
auth_url     = "http://127.0.0.1:9998/authorize"
token_url    = "http://127.0.0.1:9998/token"
scopes       = ["mock_read", "mock_write"]
