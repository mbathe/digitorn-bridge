[provider]
name         = "azure_openai"
display_name = "Azure OpenAI"
handler_type = "azure_ad"
icon         = "azure"
category     = "llm"
description  = "Azure OpenAI Service via Entra ID app registration."
homepage     = "https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/OpenAI"

[[fields]]
name = "tenant_id"
help = "Azure AD tenant GUID hosting the OpenAI resource."

[[fields]]
name = "client_id"
help = "App registration client (application) ID."

[[fields]]
name = "client_secret"
help = "Generated under App registration -> Certificates & secrets."

[verify]
endpoint      = ""  # azure_ad handler tests via the OAuth token endpoint, not a service endpoint
method        = "POST"
auth_template = ""
success_codes = [200]
