[provider]
name         = "github_copilot"
display_name = "GitHub Copilot"
handler_type = "api_key"
icon         = "github"
category     = "llm"
description  = "Use your GitHub Copilot subscription as an LLM (gpt-4o, claude-3.5-sonnet, gemini, o-series). Stores your GitHub token; the daemon exchanges it for a 30-min Copilot session token on every call and refreshes transparently."
homepage     = "https://github.com/settings/copilot"

[[fields]]
name        = "api_key"
label       = "GitHub token"
type        = "secret"
required    = true
placeholder = "gho_... (gh auth token) or ghp_... (PAT)"
help        = "Run `gh auth login` then `gh auth token`. Or create a Personal Access Token. The token is exchanged for a Copilot session token before each request - your subscription is charged the same as the official VS Code extension."

# Verify the token is a valid GitHub identity. The Copilot endpoint
# itself wants Editor-Version/Plugin-Version headers the api_key
# handler can't add, so we ping /user instead - if the token is a
# valid GitHub PAT/OAuth token it returns 200 with the username.
# A separate live probe (not yet wired here) could call the actual
# Copilot token-exchange to confirm Copilot SKU is active.
[verify]
endpoint       = "https://api.github.com/user"
method         = "GET"
auth_template  = "Authorization: token {{field.api_key}}"
success_codes  = [200]
