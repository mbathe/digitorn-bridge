[provider]
name         = "deepseek"
display_name = "DeepSeek"
handler_type = "api_key"
icon         = "deepseek"
category     = "llm"
description  = "DeepSeek V3, V4, R1 reasoning models (OpenAI-compatible API)."
homepage     = "https://platform.deepseek.com/api_keys"

[[fields]]
name         = "api_key"
label        = "DeepSeek API key"
help         = "Generate at https://platform.deepseek.com/api_keys"
placeholder  = "sk-..."
prefix_check = "sk-"

[verify]
endpoint       = "https://api.deepseek.com/models"
method         = "GET"
auth_template  = "Authorization: Bearer {api_key}"
success_codes  = [200]
