[provider]
name         = "slack_oauth"
display_name = "Slack (OAuth)"
handler_type = "oauth2"
icon         = "slack"
category     = "oauth"
description  = "Sign in with Slack as a user. Bot tokens go via slack_bot."
homepage     = "https://api.slack.com/apps"

[oauth]
auth_url     = "https://slack.com/oauth/v2/authorize"
token_url    = "https://slack.com/api/oauth.v2.access"
userinfo_url = "https://slack.com/api/users.identity"
scopes       = ["users.profile:read", "channels:read", "chat:write"]
