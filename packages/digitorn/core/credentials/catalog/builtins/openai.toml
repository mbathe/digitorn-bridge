[provider]
name         = "openai"
display_name = "OpenAI"
handler_type = "api_key"
icon         = "openai"
category     = "llm"
description  = "OpenAI GPT, embeddings, audio, vision."
homepage     = "https://platform.openai.com/api-keys"

[[fields]]
name         = "api_key"
label        = "OpenAI API key"
help         = "Generate at https://platform.openai.com/api-keys"
placeholder  = "sk-proj-..."
prefix_check = "sk-"

[verify]
endpoint       = "https://api.openai.com/v1/models"
method         = "GET"
auth_template  = "Authorization: Bearer {api_key}"
success_codes  = [200]
