[provider]
name         = "anthropic"
display_name = "Anthropic"
handler_type = "api_key"
icon         = "anthropic"
category     = "llm"
description  = "Claude family of models (Opus, Sonnet, Haiku)."
homepage     = "https://console.anthropic.com/settings/keys"

[[fields]]
name         = "api_key"
label        = "Anthropic API key"
help         = "Generate at https://console.anthropic.com/settings/keys"
placeholder  = "sk-ant-..."
prefix_check = "sk-ant-"

[verify]
endpoint      = "https://api.anthropic.com/v1/messages"
method        = "POST"
# Anthropic uses x-api-key header rather than Bearer.
auth_template = "x-api-key: {api_key}"
# We send a 1-token "ping" message to validate the key. The body
# template uses standard Python format placeholders.
body_template = '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"ping"}]}'
success_codes = [200, 400]
# 400 is treated as success because Anthropic returns it for this
# minimal payload while still validating the key authentication step.
