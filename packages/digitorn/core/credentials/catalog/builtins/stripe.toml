[provider]
name         = "stripe"
display_name = "Stripe"
handler_type = "multi_field"
icon         = "stripe"
category     = "payments"
description  = "Stripe API keys (publishable + secret) plus webhook signing."
homepage     = "https://dashboard.stripe.com/apikeys"

[[fields]]
name         = "publishable_key"
label        = "Publishable key"
help         = "Safe to expose client-side; starts with pk_live_ or pk_test_."
placeholder  = "pk_live_..."
prefix_check = "pk_"
required     = true

[[fields]]
name         = "secret_key"
label        = "Secret key"
help         = "Server-only; starts with sk_live_, sk_test_, or rk_live_ (restricted)."
placeholder  = "sk_live_... / rk_live_..."
prefix_check = "sk_"
required     = true

[[fields]]
name         = "webhook_signing_secret"
label        = "Webhook signing secret"
help         = "Optional. Used to verify incoming Stripe webhooks (whsec_...)."
placeholder  = "whsec_..."
prefix_check = "whsec_"
required     = false

[verify]
endpoint       = "https://api.stripe.com/v1/balance"
method         = "GET"
auth_template  = "Authorization: Bearer {secret_key}"
success_codes  = [200]
