[provider]
name         = "github_pat"
display_name = "GitHub Personal Access Token"
handler_type = "bearer_token"
icon         = "github"
category     = "vcs"
description  = "Pre-issued PAT for git operations + GitHub API."
homepage     = "https://github.com/settings/tokens"

[[fields]]
name         = "token"
label        = "Personal access token"
help         = "Create a fine-grained PAT at https://github.com/settings/tokens?type=beta"
placeholder  = "github_pat_... or ghp_..."

[verify]
endpoint       = "https://api.github.com/user"
method         = "GET"
auth_template  = "Authorization: Bearer {token}"
success_codes  = [200]
