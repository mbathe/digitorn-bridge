[provider]
name         = "aws"
display_name = "AWS"
handler_type = "aws_access_key"
icon         = "aws"
category     = "cloud"
description  = "AWS access key + secret + region. Validated via STS GetCallerIdentity."
homepage     = "https://console.aws.amazon.com/iam/home#/security_credentials"

# Field overrides minimal - the handler already declares the proper
# fields with regex + region choices. The catalog just adds help text
# and consumer hints.
[[fields]]
name = "access_key_id"
help = "20-character key starting with AKIA (long-term) or ASIA (STS)."
