[provider]
name         = "notion"
display_name = "Notion (OAuth)"
handler_type = "oauth2"
icon         = "notion"
category     = "oauth"
description  = "Sign in with Notion. Used for pages, databases, search."
homepage     = "https://www.notion.so/my-integrations"

[oauth]
auth_url  = "https://api.notion.com/v1/oauth/authorize"
token_url = "https://api.notion.com/v1/oauth/token"
scopes    = []  # Notion uses workspace-level permissions, not OAuth scopes.
