[provider]
name         = "postgres"
display_name = "PostgreSQL"
handler_type = "connection_string"
icon         = "postgres"
category     = "database"
description  = "PostgreSQL relational database connection (URI form)."
homepage     = "https://www.postgresql.org/"

[[fields]]
name         = "connection_string"
label        = "PostgreSQL URL"
help         = "Standard libpq URI: postgres://user:pass@host:5432/db"
placeholder  = "postgres://app:secret@db.internal:5432/myapp"
